<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>УЧЁБА FLOW — Планировщик заданий</title>
    <!-- Подключаем шрифты и иконки -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #09090b;
            --bg-card: rgba(18, 18, 24, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent-cyan: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-glow: 0 0 25px rgba(139, 92, 246, 0.2);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            position: relative;
        }

        /* Фоновый Canvas для плавающих точек */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* Шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 18px 25px;
            margin-bottom: 25px;
            box-shadow: var(--shadow-glow);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        .logo-text h1 {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            padding: 8px 15px;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
        }

        .user-badge:hover {
            border-color: var(--primary);
        }

        /* Баннер */
        .banner {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(6, 182, 212, 0.1));
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        .banner h2 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .banner h2 span {
            color: #c084fc;
        }

        .banner p {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 20px;
        }

        /* Статистика */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-icon {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
        }

        .stat-icon.total { background: rgba(139, 92, 246, 0.2); color: var(--primary); }
        .stat-icon.done { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .stat-icon.pending { background: rgba(245, 158, 11, 0.2); color: var(--warning); }

        .stat-info h4 { font-size: 22px; font-weight: 700; }
        .stat-info p { font-size: 12px; color: var(--text-muted); }

        /* Панель управления */
        .controls {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
        }

        .search-input {
            flex: 1;
            min-width: 220px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 10px 15px;
            color: white;
            outline: none;
        }

        .search-input:focus { border-color: var(--primary); }

        select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 10px 15px;
            color: white;
            outline: none;
            cursor: pointer;
        }

        select:focus { border-color: var(--primary); }

        .btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
        }

        /* Список задач */
        .tasks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }

        .task-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
        }

        .task-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .task-card.completed { opacity: 0.6; }
        .task-card.completed .task-title { text-decoration: line-through; color: var(--text-muted); }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .task-subject {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 10px;
            background: rgba(139, 92, 246, 0.15);
            color: #c084fc;
        }

        .badge-high { color: var(--danger); background: rgba(239, 68, 68, 0.15); padding: 3px 6px; border-radius: 6px; font-size: 10px; font-weight: 700; }
        .badge-medium { color: var(--warning); background: rgba(245, 158, 11, 0.15); padding: 3px 6px; border-radius: 6px; font-size: 10px; font-weight: 700; }
        .badge-low { color: var(--success); background: rgba(16, 185, 129, 0.15); padding: 3px 6px; border-radius: 6px; font-size: 10px; font-weight: 700; }

        .task-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; word-break: break-word; }
        .task-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 15px; word-break: break-word; }

        .task-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-glass);
            padding-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
        }

        .task-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .icon-btn:hover { background: rgba(255, 255, 255, 0.15); }

        /* Модальные окна */
        .modal-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .modal-bg.active { opacity: 1; pointer-events: auto; }

        .modal {
            background: #121218;
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 25px;
        }

        .modal h3 { font-size: 18px; margin-bottom: 15px; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            padding: 10px;
            color: white;
            outline: none;
        }
        .form-group textarea { resize: vertical; min-height: 70px; }

        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

        .empty { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-muted); }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <!-- Шапка -->
        <header>
            <div class="logo-area">
                <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
                <div class="logo-text">
                    <h1>УЧЁБА FLOW</h1>
                    <p>Проект • 9 класс</p>
                </div>
            </div>
            <div class="user-badge" onclick="openProfileModal()">
                <i class="fa-solid fa-user-circle" style="color: var(--primary); font-size: 18px;"></i>
                <span id="header-name" style="font-weight: 600; font-size: 14px;">Школьник</span>
            </div>
        </header>

        <!-- Баннер -->
        <section class="banner">
            <h2 id="greeting">Привет! 👋</h2>
            <p>Удобный планировщик заданий для учеников. Создавай, выполняй и следи за успеваемостью.</p>
            <button class="btn" onclick="openTaskModal()"><i class="fa-solid fa-plus"></i> Добавить задание</button>
        </section>

        <!-- Статистика -->
        <section class="stats">
            <div class="stat-card">
                <div class="stat-icon total"><i class="fa-solid fa-list"></i></div>
                <div class="stat-info"><h4 id="stat-total">0</h4><p>Всего</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon done"><i class="fa-solid fa-check"></i></div>
                <div class="stat-info"><h4 id="stat-done">0</h4><p>Выполнено</p></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon pending"><i class="fa-solid fa-clock"></i></div>
                <div class="stat-info"><h4 id="stat-pending">0</h4><p>В процессе</p></div>
            </div>
        </section>

        <!-- Управление -->
        <section class="controls">
            <input type="text" id="search" class="search-input" placeholder="Поиск по задачам..." oninput="render()">
            <select id="filter-status" onchange="render()">
                <option value="all">Все статусы</option>
                <option value="pending">В процессе</option>
                <option value="completed">Выполненные</option>
            </select>
            <select id="filter-priority" onchange="render()">
                <option value="all">Все приоритеты</option>
                <option value="high">Высокий</option>
                <option value="medium">Средний</option>
                <option value="low">Низкий</option>
            </select>
        </section>

        <!-- Список заданий -->
        <section>
            <div class="tasks-grid" id="tasks-box"></div>
        </section>
    </div>

    <!-- Модалка задачи -->
    <div class="modal-bg" id="task-modal">
        <div class="modal">
            <h3 id="modal-title">Новое задание</h3>
            <form id="task-form" onsubmit="saveTask(event)">
                <input type="hidden" id="task-id">
                <div class="form-group">
                    <label>Название *</label>
                    <input type="text" id="t-name" required placeholder="Например: Выучить стих">
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="t-desc" placeholder="Детали задания..."></textarea>
                </div>
                <div class="form-group">
                    <label>Предмет</label>
                    <select id="t-subject">
                        <option value="Информатика">Информатика</option>
                        <option value="Математика">Математика</option>
                        <option value="Физика">Физика</option>
                        <option value="Литература">Литература</option>
                        <option value="Другое">Другое</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Дата сдачи</label>
                    <input type="date" id="t-date">
                </div>
                <div class="form-group">
                    <label>Приоритет</label>
                    <select id="t-priority">
                        <option value="low">Низкий</option>
                        <option value="medium" selected>Средний</option>
                        <option value="high">Высокий</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Отмена</button>
                    <button type="submit" class="btn">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Модалка профиля (Ввод имени) -->
    <div class="modal-bg" id="profile-modal">
        <div class="modal">
            <h3 id="profile-modal-title">Как вас зовут?</h3>
            <form onsubmit="saveProfile(event)">
                <div class="form-group">
                    <label>Введите ваше имя:</label>
                    <input type="text" id="p-name" required placeholder="Ваше имя...">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="profile-cancel" onclick="closeProfileModal()" style="display:none;">Отмена</button>
                    <button type="submit" class="btn">Готово</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        /* 1. ФОНОВЫЙ CANVAS */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize;
        resize();

        let dots = Array.from({length: 30}, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            vx: (Math.random() - 0.5) * 0.5,
            vy: (Math.random() - 0.5) * 0.5
        }));

        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach(d => {
                d.x += d.vx; d.y += d.vy;
                if (d.x < 0 || d.x > canvas.width) d.vx *= -1;
                if (d.y < 0 || d.y > canvas.height) d.vy *= -1;
                ctx.beginPath();
                ctx.arc(d.x, d.y, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(139, 92, 246, 0.3)';
                ctx.fill();
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        /* 2. ДАННЫЕ И LOCALSTORAGE */
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [
            { id: '1', title: 'Сдать проект по информатике', desc: 'Защитить веб-приложение Учёба Flow', subject: 'Информатика', date: '2026-06-01', priority: 'high', completed: false }
        ];
        let userName = localStorage.getItem('userName') || '';

        function persist() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
            localStorage.setItem('userName', userName);
            updateStats();
        }

        /* 3. ПРОФИЛЬ */
        function checkProfile() {
            if (!userName) {
                document.getElementById('profile-modal-title').textContent = 'Добро пожаловать!';
                document.getElementById('profile-cancel').style.display = 'none';
                document.getElementById('profile-modal').classList.add('active');
            } else {
                document.getElementById('header-name').textContent = userName;
                document.getElementById('greeting').innerHTML = `Привет, <span>${userName}</span>! 👋`;
            }
        }

        function openProfileModal() {
            document.getElementById('profile-modal-title').textContent = 'Изменить имя';
            document.getElementById('p-name').value = userName;
            document.getElementById('profile-cancel').style.display = 'inline-block';
            document.getElementById('profile-modal').classList.add('active');
        }

        function closeProfileModal() {
            if (!userName) return;
            document.getElementById('profile-modal').classList.remove('active');
        }

        function saveProfile(e) {
            e.preventDefault();
            const val = document.getElementById('p-name').value.trim();
            if (val) {
                userName = val;
                persist();
                checkProfile();
                document.getElementById('profile-modal').classList.remove('active');
            }
        }

        /* 4. ЗАДАЧИ (CRUD) */
        function openTaskModal(id = null) {
            const form = document.getElementById('task-form');
            form.reset();
            document.getElementById('task-id').value = '';
            document.getElementById('t-date').valueAsDate = new Date();

            if (id) {
                document.getElementById('modal-title').textContent = 'Редактировать задание';
                const t = tasks.find(x => x.id === id);
                if (t) {
                    document.getElementById('task-id').value = t.id;
                    document.getElementById('t-name').value = t.title;
                    document.getElementById('t-desc').value = t.desc;
                    document.getElementById('t-subject').value = t.subject;
                    document.getElementById('t-date').value = t.date;
                    document.getElementById('t-priority').value = t.priority;
                }
            } else {
                document.getElementById('modal-title').textContent = 'Новое задание';
            }
            document.getElementById('task-modal').classList.add('active');
        }

        function closeTaskModal() {
            document.getElementById('task-modal').classList.remove('active');
        }

        function saveTask(e) {
            e.preventDefault();
            const id = document.getElementById('task-id').value;
            const title = document.getElementById('t-name').value.trim();
            const desc = document.getElementById('t-desc').value.trim();
            const subject = document.getElementById('t-subject').value;
            const date = document.getElementById('t-date').value;
            const priority = document.getElementById('t-priority').value;

            if (!title) return;

            if (id) {
                tasks = tasks.map(t => t.id === id ? {...t, title, desc, subject, date, priority} : t);
            } else {
                tasks.unshift({ id: Date.now().toString(), title, desc, subject, date, priority, completed: false });
            }

            persist();
            render();
            closeTaskModal();
        }

        function toggleComplete(id) {
            tasks = tasks.map(t => t.id === id ? {...t, completed: !t.completed} : t);
            persist();
            render();
        }

        function deleteTask(id) {
            if (confirm('Удалить это задание?')) {
                tasks = tasks.filter(t => t.id !== id);
                persist();
                render();
            }
        }

        /* 5. СТАТИСТИКА И РЕНДЕР */
        function updateStats() {
            document.getElementById('stat-total').textContent = tasks.length;
            document.getElementById('stat-done').textContent = tasks.filter(t => t.completed).length;
            document.getElementById('stat-pending').textContent = tasks.filter(t => !t.completed).length;
        }

        function render() {
            const box = document.getElementById('tasks-box');
            const search = document.getElementById('search').value.toLowerCase();
            const sFilter = document.getElementById('filter-status').value;
            const pFilter = document.getElementById('filter-priority').value;

            let list = tasks.filter(t => {
                let matchSearch = t.title.toLowerCase().includes(search) || t.desc.toLowerCase().includes(search);
                let matchStatus = sFilter === 'all' ? true : sFilter === 'completed' ? t.completed : !t.completed;
                let matchPriority = pFilter === 'all' ? true : t.priority === pFilter;
                return matchSearch && matchStatus && matchPriority;
            });

            if (list.length === 0) {
                box.innerHTML = `<div class="empty">Заданий не найдено</div>`;
                return;
            }

            const pLabels = { high: 'Высокий', medium: 'Средний', low: 'Низкий' };

            box.innerHTML = list.map(t => `
                <div class="task-card ${t.completed ? 'completed' : ''}">
                    <div>
                        <div class="task-header">
                            <span class="task-subject">${t.subject}</span>
                            <span class="badge-${t.priority}">${pLabels[t.priority]}</span>
                        </div>
                        <h4 class="task-title">${t.title}</h4>
                        <p class="task-desc">${t.desc || 'Без описания'}</p>
                    </div>
                    <div class="task-footer">
                        <span><i class="fa-regular fa-calendar"></i> ${t.date || 'Нет даты'}</span>
                        <div class="task-actions">
                            <button class="icon-btn" onclick="toggleComplete('${t.id}')" title="Выполнить"><i class="fa-solid ${t.completed ? 'fa-rotate-left' : 'fa-check'}"></i></button>
                            <button class="icon-btn" onclick="openTaskModal('${t.id}')" title="Изменить"><i class="fa-solid fa-pen"></i></button>
                            <button class="icon-btn" onclick="deleteTask('${t.id}')" title="Удалить"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Запуск при загрузке
        checkProfile();
        updateStats();
        render();
    </script>
</body>
</html>
