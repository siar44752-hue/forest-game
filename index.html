<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoxType — Тренажёр диктовки и речи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0d17;
      --card-bg: rgba(22, 26, 46, 0.65);
      --card-border: rgba(138, 43, 226, 0.2);
      --primary: #8a2be2;
      --primary-hover: #9d4edd;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.35);
      --text-main: #f0f3fe;
      --text-muted: #a0a7cc;
      --danger: #ff4757;
      --warning: #ffa502;
      --success: #2ed573;
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
    }

    header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      background: rgba(11, 13, 23, 0.7);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text-main), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: var(--transition);
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(138, 43, 226, 0.3);
    }

    main {
      flex: 1;
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 1.5rem;
    }

    @media (max-width: 968px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Controls Panel */
    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.2rem;
      margin-bottom: 1rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      justify-content: space-between;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px 14px;
      background: rgba(11, 13, 23, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent);
      transition: var(--transition);
    }

    /* Editor Area */
    .editor-container {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .text-area-wrapper {
      position: relative;
      width: 100%;
      min-height: 280px;
    }

    textarea {
      width: 100%;
      height: 100%;
      min-height: 280px;
      background: rgba(11, 13, 23, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1rem;
      color: var(--text-main);
      font-size: 1.05rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
      transition: var(--transition);
    }

    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(138, 43, 226, 0.2);
    }

    .formatted-reader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 1rem;
      background: rgba(11, 13, 23, 0.95);
      border: 1px solid var(--primary);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 1.05rem;
      line-height: 1.6;
      overflow-y: auto;
      display: none;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .sentence-highlight {
      background-color: rgba(0, 242, 254, 0.25);
      border-bottom: 2px solid var(--accent);
      border-radius: 4px;
      padding: 2px 0;
    }

    /* Buttons Panel */
    .action-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(138, 43, 226, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-danger {
      background: rgba(255, 71, 87, 0.2);
      color: var(--danger);
      border: 1px solid rgba(255, 71, 87, 0.3);
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger);
      color: white;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Visualizer & Progress */
    .visualizer-card {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      justify-content: center;
    }

    canvas#equalizer {
      width: 100%;
      height: 60px;
      border-radius: 8px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.2s linear;
    }

    /* Stats Panel */
    .stats-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(11, 13, 23, 0.4);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .stat-value {
      font-weight: 600;
      color: var(--accent);
      font-size: 1rem;
    }

    /* Dictation Test Section */
    .test-section {
      display: none;
      flex-direction: column;
      gap: 1.5rem;
    }

    .test-section.active {
      display: flex;
    }

    .diff-box {
      min-height: 120px;
      padding: 1rem;
      background: rgba(11, 13, 23, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      line-height: 1.8;
      font-size: 1rem;
    }

    .word-correct {
      color: var(--success);
      background: rgba(46, 213, 115, 0.15);
      padding: 2px 4px;
      border-radius: 4px;
      margin: 0 2px;
    }

    .word-missing {
      color: var(--danger);
      text-decoration: line-through;
      background: rgba(255, 71, 87, 0.15);
      padding: 2px 4px;
      border-radius: 4px;
      margin: 0 2px;
    }

    .word-extra {
      color: var(--warning);
      background: rgba(255, 165, 2, 0.15);
      padding: 2px 4px;
      border-radius: 4px;
      margin: 0 2px;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-info {
      background: rgba(0, 242, 254, 0.15);
      color: var(--accent);
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">V</div>
      <span>VoxType</span>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-trainer" onclick="switchMode('trainer')">Тренажёр</button>
      <button class="tab-btn" id="tab-test" onclick="switchMode('test')">Проверка диктанта</button>
    </div>
  </header>

  <main>
    <!-- MODE 1: TRAINER -->
    <div id="mode-trainer" class="grid-layout">
      <div class="glass-card" style="display: flex; flex-direction: column; gap: 1rem;">
        
        <!-- Controls -->
        <div class="controls-grid">
          <div class="control-group">
            <label for="voice-select">Голос диктора</label>
            <select id="voice-select"><option value="">Загрузка голосов...</option></select>
          </div>

          <div class="control-group">
            <label for="rate-range">Скорость: <span id="rate-val" class="stat-value">1.0x</span></label>
            <input type="range" id="rate-range" min="0.5" max="2" step="0.1" value="1">
          </div>

          <div class="control-group">
            <label for="pitch-range">Высота тона: <span id="pitch-val" class="stat-value">1.0</span></label>
            <input type="range" id="pitch-range" min="0.5" max="1.5" step="0.1" value="1">
          </div>

          <div class="control-group">
            <label for="volume-range">Громкость: <span id="volume-val" class="stat-value">100%</span></label>
            <input type="range" id="volume-range" min="0" max="1" step="0.05" value="1">
          </div>
        </div>

        <!-- Text Area / Display -->
        <div class="editor-container">
          <div class="text-area-wrapper">
            <textarea id="source-text" placeholder="Введите или вставьте текст для диктовки сюда..."></textarea>
            <div id="formatted-reader" class="formatted-reader"></div>
          </div>
        </div>

        <!-- Visualizer & Progress -->
        <div class="visualizer-card">
          <div class="progress-bar-container">
            <div id="dictation-progress" class="progress-bar"></div>
          </div>
          <canvas id="equalizer"></canvas>
        </div>

        <!-- Action Buttons -->
        <div class="action-bar">
          <div class="btn-group">
            <button id="btn-play" class="btn btn-primary" onclick="startSpeech()">▶ Старт</button>
            <button id="btn-pause" class="btn btn-secondary" onclick="pauseSpeech()" disabled>⏸ Пауза</button>
            <button id="btn-stop" class="btn btn-danger" onclick="stopSpeech()" disabled>⏹ Стоп</button>
            <button id="btn-restart" class="btn btn-secondary" onclick="restartSpeech()" disabled>🔄 Заново</button>
          </div>
          <button class="btn btn-secondary" onclick="clearText()">
