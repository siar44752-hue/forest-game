<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VoxType Pro Ultimate — Идеальный школьный диктант</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #06070c;
      --card-bg: rgba(15, 18, 35, 0.85);
      --card-border: rgba(138, 43, 226, 0.3);
      --primary: #8a2be2;
      --primary-hover: #9d4edd;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.4);
      --text-main: #f0f3fe;
      --text-muted: #8e96c0;
      --danger: #ff4757;
      --success: #2ed573;
      --warning: #ffa502;
      --radius: 16px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(138, 43, 226, 0.2) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }

    header {
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      background: rgba(6, 7, 12, 0.85);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: bold;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    main {
      flex: 1;
      max-width: 1050px;
      width: 100%;
      margin: 0 auto;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .control-group {
      display: flex; flex-direction: column; gap: 6px;
    }

    .control-group label {
      font-size: 0.75rem; color: var(--text-muted); font-weight: 600;
      display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: 0.5px;
    }

    select {
      width: 100%; padding: 10px 12px;
      background: rgba(6, 7, 12, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 10px; color: var(--text-main);
      font-size: 0.85rem; outline: none;
    }

    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px; outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px;
      border-radius: 50%; background: var(--accent);
      cursor: pointer; box-shadow: 0 0 10px var(--accent);
    }

    .toggle-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: rgba(6, 7, 12, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 10px;
    }

    .toggle-label {
      font-size: 0.8rem;
      color: var(--text-main);
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      transition: .3s; border-radius: 22px;
    }

    .slider:before {
      position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--primary); }
    input:checked + .slider:before { transform: translateX(18px); }

    .editor-container {
      position: relative; display: flex; flex-direction: column; gap: 10px;
    }

    textarea {
      width: 100%; min-height: 180px;
      background: rgba(6, 7, 12, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 12px; padding: 1rem;
      color: var(--text-main); font-size: 1rem; line-height: 1.6;
      resize: vertical; outline: none; transition: var(--transition);
    }

    textarea:focus { border-color: var(--primary); }

    .formatted-reader {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      padding: 1rem; background: rgba(6, 7, 12, 0.96);
      border: 1px solid var(--primary); border-radius: 12px;
      color: var(--text-main); font-size: 1.05rem; line-height: 1.8;
      overflow-y: auto; display: none; white-space: pre-wrap;
    }

    .clause-highlight {
      background-color: rgba(138, 43, 226, 0.4);
      border-bottom: 2px solid var(--accent);
      border-radius: 4px; padding: 2px 4px;
    }

    .action-bar {
      display: flex; flex-direction: column; gap: 10px; margin-top: 0.5rem;
    }

    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; }

    .btn {
      flex: 1;
      min-width: 90px;
      padding: 12px 14px; border-radius: 12px; border: none;
      font-weight: 700; font-size: 0.85rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px; transition: var(--transition);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white; box-shadow: 0 4px 18px rgba(138, 43, 226, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08); color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-warning {
      background: rgba(255, 165, 2, 0.2); color: var(--warning);
      border: 1px solid rgba(255, 165, 2, 0.3);
    }

    .btn-danger {
      background: rgba(255, 71, 87, 0.2); color: var(--danger);
      border: 1px solid rgba(255, 71, 87, 0.3);
    }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status-badge {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: rgba(0, 242, 254, 0.1);
      border: 1px solid var(--accent); border-radius: 12px;
      font-size: 0.9rem; color: var(--accent); font-weight: 600;
    }

    .speed-card {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: rgba(255, 255, 255, 0.03);
      border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.8rem; color: var(--text-muted);
    }

    @media (max-width: 600px) {
      main { padding: 0.5rem; }
      .controls-grid { grid-template-columns: 1fr 1fr; }
      .btn { padding: 10px 4px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">V</div>
      <span>VoxType Pro Ultimate</span>
    </div>
  </header>

  <main>
    <div class="glass-card" style="display: flex; flex-direction: column; gap: 1rem;">
      
      <!-- Controls -->
      <div class="controls-grid">
        <div class="control-group" style="grid-column: span 2;">
          <label for="voice-select">Русский голос диктора (Лучшие сверху)</label>
          <select id="voice-select"><option value="">Поиск русских голосов...</option></select>
        </div>

        <div class="control-group">
          <label for="sentence-pause">Пауза в тетрадь: <span id="sent-pause-val" style="color:var(--accent);">5 сек</span></label>
          <input type="range" id="sentence-pause" min="1" max="30" step="1" value="5">
        </div>

        <div class="control-group">
          <label for="punct-pause">Пауза на знаках: <span id="punct-pause-val" style="color:var(--accent);">1.5 сек</span></label>
          <input type="range" id="punct-pause" min="0.5" max="4" step="0.5" value="1.5">
        </div>

        <div class="control-group">
          <label for="rate-range">Скорость чтения: <span id="rate-val" style="color:var(--accent);">0.85x</span></label>
          <input type="range" id="rate-range" min="0.4" max="1.2" step="0.05" value="0.85">
        </div>

        <div class="control-group">
          <label for="pitch-range">Тон голоса: <span id="pitch-val" style="color:var(--accent);">1.0</span></label>
          <input type="range" id="pitch-range" min="0.5" max="1.5" step="0.1" value="1.0">
        </div>

        <div class="toggle-group">
          <span class="toggle-label">🗣 Знаки голосом</span>
          <label class="switch">
            <input type="checkbox" id="speak-punct-toggle" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="toggle-group">
          <span class="toggle-label">🔔 Звуковой сигнал</span>
          <label class="switch">
            <input type="checkbox" id="beep-toggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>

      <!-- Info Bar -->
      <div class="speed-card">
        <span>Комфорт письма: <strong id="req-speed" style="color:var(--accent);">~0 сл/мин</strong></span>
        <span>Предложений: <strong id="total-sentences" style="color:var(--text-main);">0</strong></span>
      </div>

      <!-- Status Indicator -->
      <div id="dictation-status" style="display: none;" class="status-badge">
        <span id="status-text">Готов к диктанту</span>
        <span id="status-timer">0%</span>
      </div>

      <!-- Text Area / Display -->
      <div class="editor-container">
        <div class="text-area-wrapper">
          <textarea id="source-text" placeholder="Вставьте русский текст диктанта сюда... Диктор сделает чёткие паузы на запятых, озвучит знаки и даст время записать всё в тетрадь."></textarea>
          <div id="formatted-reader" class="formatted-reader"></div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="action-bar">
        <div class="btn-group">
          <button id="btn-prev" class="btn btn-secondary" onclick="stepSentence(-1)" disabled>⏮ Назад</button>
          <button id="btn-play" class="btn btn-primary" onclick="startNotebookDictation()">▶ Начать</button>
          <button id="btn-repeat-phrase" class="btn btn-warning" onclick="repeatCurrentPhrase()" disabled>🔂 Повторить</button>
          <button id="btn-next" class="btn btn-secondary" onclick="stepSentence(1)" disabled>Вперёд ⏭</button>
          <button id="btn-pause" class="btn btn-secondary" onclick="pauseNotebookDictation()" disabled>⏸ Пауза</button>
          <button id="btn-stop" class="btn btn-danger" onclick="stopNotebookDictation()" disabled>⏹</button>
        </div>
      </div>

    </div>
  </main>

  <script>
    const synth = window.speechSynthesis;
    let voices = [];
    let sentences = [];
    let currentSentIdx = 0;
    let currentClauseIdx = 0;
    let isPlaying = false;
    let isPaused = false;
    let pauseTimeout = null;
    let audioCtx = null;

    const voiceSelect = document.getElementById('voice-select');
    const sentPauseRange = document.getElementById('sentence-pause');
    const sentPauseVal = document.getElementById('sent-pause-val');
    const punctPauseRange = document.getElementById('punct-pause');
    const punctPauseVal = document.getElementById('punct-pause-val');
    const rateRange = document.getElementById('rate-range');
    const rateVal = document.getElementById('rate-val');
    const pitchRange = document.getElementById('pitch-range');
    const pitchVal = document.getElementById('pitch-val');
    const speakPunctToggle = document.getElementById('speak-punct-toggle');
    const beepToggle = document.getElementById('beep-toggle');

    const sourceText = document.getElementById('source-text');
    const formattedReader = document.getElementById('formatted-reader');
    const statusBox = document.getElementById('dictation-status');
    const statusText = document.getElementById('status-text');
    const statusTimer = document.getElementById('status-timer');
    const reqSpeedEl = document.getElementById('req-speed');
    const totalSentencesEl = document.getElementById('total-sentences');

    const btnPlay = document.getElementById('btn-play');
    const btnPause = document.getElementById('btn-pause');
    const btnStop = document.getElementById('btn-stop');
    const btnRepeatPhrase = document.getElementById('btn-repeat-phrase');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    const punctSpokenMap = {
      ',': 'запятая',
      '—': 'тире',
      '-': 'тире',
      ':': 'двоеточие',
      ';': 'точка с запятой',
      '?': 'вопросительный знак',
      '!': 'восклицательный знак',
      '.': 'точка'
    };

    function playBeep() {
      if (!beepToggle.checked) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 620;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch(e){}
    }

    // Filter STRICTLY Russian voices and sort by natural quality
    function populateVoices() {
      if (!synth) return;
      const allVoices = synth.getVoices();
      
      // Keep ONLY Russian language voices
      voices = allVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith('ru'));

      voiceSelect.innerHTML = '';

      if (voices.length === 0) {
        const option = document.createElement('option');
        option.value = "";
        option.textContent = "Русские голоса не найдены в системе!";
        voiceSelect.appendChild(option);
        return;
      }

      // Sort with preference to Google / Microsoft Natural / Premium
      voices.sort((a, b) => {
        const an = a.name.toLowerCase();
        const bn = b.name.toLowerCase();
        const scoreA = (an.includes('google') || an.includes('natural') || an.includes('premium')) ? 2 : 1;
        const scoreB = (bn.includes('google') || bn.includes('natural') || bn.includes('premium')) ? 2 : 1;
        return scoreB - scoreA;
      });

      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
      });

      // Default select best available Russian voice
      voiceSelect.value = 0;
    }

    populateVoices();
    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = populateVoices;
    }

    sentPauseRange.addEventListener('input', () => { sentPauseVal.textContent = sentPauseRange.value + ' сек'; calculateSpeed(); });
    punctPauseRange.addEventListener('input', () => { punctPauseVal.textContent = punctPauseRange.value + ' сек'; calculateSpeed(); });
    rateRange.addEventListener('input', () => { rateVal.textContent = parseFloat(rateRange.value).toFixed(2) + 'x'; calculateSpeed(); });
    pitchRange.addEventListener('input', () => { pitchVal.textContent = parseFloat(pitchRange.value).toFixed(1); });
    sourceText.addEventListener('input', calculateSpeed);

    function calculateSpeed() {
      const text = sourceText.value.trim();
      const wordsArr = text.split(/\s+/).filter(Boolean);
      const sentencesArr = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [];
      const commasCount = (text.match(/[,:;\u2014-]/g) || []).length;
      
      totalSentencesEl.textContent = sentencesArr.length;

      if (wordsArr.length === 0) {
        reqSpeedEl.textContent = '~0 сл/мин';
        return;
      }

      const speed = parseFloat(rateRange.value);
      const sPause = parseInt(sentPauseRange.value);
      const pPause = parseFloat(punctPauseRange.value);

      const speechMin = (wordsArr.length / (130 * speed));
      const pauseMin = ((sentencesArr.length * sPause) + (commasCount * pPause)) / 60;
      const totalMin = speechMin + pauseMin;

      const wpm = Math.round(wordsArr.length / totalMin);
      reqSpeedEl.textContent = `~${wpm} сл/мин`;
    }

    function parseTextDetailed(text) {
      const rawSentences = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g) || [text];
      
      return rawSentences.map(sentStr => {
        const clauseMatches = sentStr.match(/[^,:;\u2014-]+[,:;\u2014-]?/g) || [sentStr];
        return {
          fullText: sentStr.trim(),
          clauses: clauseMatches.map(c => c.trim()).filter(Boolean)
        };
      });
    }

    function startNotebookDictation() {
      const text = sourceText.value.trim();
      if (!text) {
        alert("Пожалуйста, введите текст диктанта.");
        return;
      }

      if (isPaused) {
        synth.resume();
        isPaused = false;
        isPlaying = true;
        updateUI();
        return;
      }

      stopNotebookDictation();

      sentences = parseTextDetailed(text);
      currentSentIdx = 0;
      currentClauseIdx = 0;
      isPlaying = true;
      isPaused = false;

      setupReaderView();
      statusBox.style.display = 'flex';
      updateUI();

      playNextClause();
    }

    function playNextClause() {
      if (!isPlaying || isPaused) return;

      if (currentSentIdx >= sentences.length) {
        statusText.textContent = "🎉 Диктант завершён!";
        statusTimer.textContent = "100%";
        stopNotebookDictation();
        return;
      }

      const currentSentence = sentences[currentSentIdx];
      const clauseText = currentSentence.clauses[currentClauseIdx];

      const pct = Math.round((currentSentIdx / sentences.length) * 100);
      statusTimer.textContent = `${pct}%`;

      if (currentClauseIdx === 0) {
        playBeep();
      }

      highlightClause(currentSentIdx, currentClauseIdx);

      statusText.textContent = `📖 Предложение ${currentSentIdx + 1} из ${sentences.length}`;

      const matchPunct = clauseText.match(/([,:;\u2014-]|[.!?])$/);
      let punctMark = matchPunct ? matchPunct[0] : null;

      let textToRead = clauseText;
      if (speakPunctToggle.checked && punctMark && punctSpokenMap[punctMark]) {
        textToRead = clauseText.replace(/([,:;\u2014-]|[.!?])$/, '') + ', ' + punctSpokenMap[punctMark];
      }

      const utterance = new SpeechSynthesisUtterance(textToRead);
      const selectedVoice = voices[voiceSelect.value];
      if (selectedVoice) utterance.voice = selectedVoice;
      
      utterance.rate = parseFloat(rateRange.value);
      utterance.pitch = parseFloat(pitchRange.value);

      // Natural intonation tuning on sentence ends
      if (clauseText.endsWith('?')) utterance.pitch += 0.2;
      else if (clauseText.endsWith('!')) utterance.pitch += 0.15;

      utterance.onend = () => {
        if (!isPlaying || isPaused) return;

        const isLastClauseInSentence = (currentClauseIdx >= currentSentence.clauses.length - 1);

        if (!isLastClauseInSentence) {
          const pPauseMs = parseFloat(punctPauseRange.value) * 1000;
          statusText.textContent = `⏸ Пауза на знаке...`;
          pauseTimeout = setTimeout(() => {
            currentClauseIdx++;
            playNextClause();
          }, pPauseMs);
        } else {
          currentClauseIdx = 0;
          const mainPauseSec = parseInt(sentPauseRange.value);
          let timeLeft = mainPauseSec;
          statusText.textContent = `✍️ Пишите в тетрадь... (${timeLeft}с)`;

          const countdownInterval = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0 && isPlaying && !isPaused) {
              statusText.textContent = `✍️ Пишите в тетрадь... (${timeLeft}с)`;
            } else {
              clearInterval(countdownInterval);
              if (isPlaying && !isPaused) {
                currentSentIdx++;
                playNextClause();
              }
            }
          }, 1000);
        }
      };

      utterance.onerror = () => {
        currentSentIdx++;
        currentClauseIdx = 0;
        playNextClause();
      };

      synth.speak(utterance);
    }

    function repeatCurrentPhrase() {
      if (synth) synth.cancel();
      if (pauseTimeout) clearTimeout(pauseTimeout);
      currentClauseIdx = 0;
      isPaused = false;
      isPlaying = true;
      updateUI();
      playNextClause();
    }

    function stepSentence(direction) {
      if (synth) synth.cancel();
      if (pauseTimeout) clearTimeout(pauseTimeout);
      currentSentIdx = Math.max(0, Math.min(sentences.length - 1, currentSentIdx + direction));
      currentClauseIdx = 0;
      isPaused = false;
      isPlaying = true;
      updateUI();
      playNextClause();
    }

    function pauseNotebookDictation() {
      if (synth.speaking) synth.pause();
      if (pauseTimeout) clearTimeout(pauseTimeout);
      isPaused = true;
      isPlaying = false;
      statusText.textContent = "⏸ На паузе";
      updateUI();
    }

    function stopNotebookDictation() {
      if (synth) synth.cancel();
      if (pauseTimeout) clearTimeout(pauseTimeout);
      isPlaying = false;
      isPaused = false;
      currentSentIdx = 0;
      currentClauseIdx = 0;

      formattedReader.style.display = 'none';
      sourceText.style.display = 'block';
      statusBox.style.display = 'none';
      updateUI();
    }

    function setupReaderView() {
      formattedReader.innerHTML = '';
      sentences.forEach((sent, sIdx) => {
        const sentSpan = document.createElement('span');
        sentSpan.id = `sent-${sIdx}`;
        sent.clauses.forEach((clause, cIdx) => {
          const clauseSpan = document.createElement('span');
          clauseSpan.id = `clause-${sIdx}-${cIdx}`;
          clauseSpan.textContent = clause + ' ';
          sentSpan.appendChild(clauseSpan);
        });
        formattedReader.appendChild(sentSpan);
      });
      sourceText.style.display = 'none';
      formattedReader.style.display = 'block';
    }

    function highlightClause(sIdx, cIdx) {
      const allClauses = formattedReader.querySelectorAll('span[id^="clause-"]');
      allClauses.forEach(el => el.className = '');
      const activeClause = document.getElementById(`clause-${sIdx}-${cIdx}`);
      if (activeClause) {
        activeClause.className = 'clause-highlight';
        activeClause.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function updateUI() {
      btnPlay.textContent = isPaused ? '▶ Продолжить' : '▶ Начать';
      btnPause.disabled = !isPlaying;
      btnStop.disabled = !isPlaying && !isPaused;
      btnRepeatPhrase.disabled = !isPlaying && !isPaused;
      btnPrev.disabled = !isPlaying && !isPaused;
      btnNext.disabled = !isPlaying && !isPaused;
    }
  </script>
</body>
</html>
