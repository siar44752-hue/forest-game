const TOUCH=matchMedia('(pointer:coarse)').matches;let S=Object.assign({vol:.7,mute:false,mus:.6,sfx:1,sens:1,q:TOUCH?0:2},store.get('nh_set',{}));if(TOUCH)document.body.classList.add('tch');

let AC,MG,CIC,SG,MU,musOn=false;

function nb(len){const b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}

 const lf=AC.createOscillator(),lg=AC.createGain();lf.frequency.value=.12;lg.gain.value=220;lf.connect(lg);lg.connect(f.frequency);lf.start();
 [55,55.8,82.4].forEach(fr=>{const o=AC.createOscillator(),og=AC.createGain(),lp=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=fr;lp.type='lowpass';lp.frequency.value=150;og.gain.value=.03;o.connect(lp);lp.connect(og);og.connect(MG);o.start()});
 const c=AC.createBufferSource();c.buffer=nb(2);c.loop=true;const cf=AC.createBiquadFilter();cf.type='bandpass';cf.frequency.value=6500;cf.Q.value=8;CIC=AC.createGain();CIC.gain.value=.03;const tr=AC.createOscillator(),tg=AC.createGain();tr.frequency.value=22;tg.gain.value=.03;tr.connect(tg);tg.connect(CIC.gain);tr.start();c.connect(cf);cf.connect(CIC);CIC.connect(MG);c.start()}
function T(f,d,type='sine',v=.2,f2,dest){if(!A())return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(dest||SG);o.start(n);o.stop(n+d+.05)}

const sfx={knock:n=>{for(let i=0;i<n;i++)setTimeout(()=>{T(110,.18,'sine',.5,55);Nz(.1,500,.3);Fx.swing(.5);Fx.shake()},i*280)},creak:()=>T(90,.8,'sawtooth',.07,170),meow:()=>{T(600,.15,'triangle',.16,900);setTimeout(()=>T(900,.3,'triangle',.16,500),150)},
 beat:()=>{T(60,.12,'sine',.5);setTimeout(()=>T(50,.14,'sine',.4),170)},ding:()=>{T(880,.4,'sine',.18);setTimeout(()=>T(1320,.5,'sine',.14),90)},shot:()=>{Nz(.5,3000,.8);T(70,.4,'square',.35,30);Fx.swing(1.6)},
 click:()=>T(500,.05,'triangle',.12),stinger:()=>{T(45,2.6,'sawtooth',.18,40);T(47.5,2.6,'sawtooth',.12,42);T(300,1.6,'sine',.04,150)},voice:v=>{const b=v?95+((v.id*53)%90):140,g=v&&v.guest,k=8+(Math.random()*6|0);for(let i=0;i<k;i++)setTimeout(()=>{const f=b*(1+Math.random()*.5);T(f,.07,g?'sawtooth':'triangle',g?.03:.05,f*.9);if(g)T(f*.5,.09,'square',.02)},i*(g?105:85))},stat:()=>Nz(.7,2500,.12,'bandpass'),step:()=>{T(70,.08,'sine',.12);Nz(.06,260,.06)},slam:()=>{Nz(.3,400,.5);T(60,.3,'sine',.5,30);Fx.swing(1.2)},zoom:()=>{T(200,.35,'sine',.05,520);Nz(.3,1800,.04,'bandpass')},tick:()=>T(1800,.02,'square',.035),
 siren:()=>{if(!A())return;Fx.siren();const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter(),n=AC.currentTime;o.type='sawtooth';lp.type='lowpass';lp.frequency.value=650;o.frequency.setValueAtTime(420,n);for(let i=0;i<4;i++){o.frequency.linearRampToValueAtTime(760,n+i*2.2+1.1);o.frequency.linearRampToValueAtTime(420,n+i*2.2+2.2)}g.gain.setValueAtTime(.0001,n);g.gain.linearRampToValueAtTime(.05,n+1.5);g.gain.linearRampToValueAtTime(.0001,n+9);o.connect(lp);lp.connect(g);g.connect(SG);o.start(n);o.stop(n+9.2)}};

vigilante:['Гнев Стрелка','«Ты солгал мне», — сказал Стрелок. Вспышки выстрелов в темноте, и дом больше не ваш.'],cult:['Да очистит смерть наши грехи','Трое последователей дожили до ночи ритуала. Лидер культа кивает: «Теперь вы с нами». Огонь очищает дом и ваши грехи.'],embrace:['Прими неизбежное','Пророк не обманул. Вы выкопали яму в подвале и прыгнули вниз, в тишину, где жара не достаёт.'],shroom:['Гриб или гибель','Гриб, яблоко, часы. Пол в подвале раскрылся, и вы шагнули в Страну грибов. Там тоже кто-то стучит.'],child:['Дитя гибели','Вы нашли младенца во всех трёх углах дома. Ночью посмотрели в окно, и он посмотрел на вас оттуда.'],fema:['Добро пожаловать в FEMA','Три звонка, три уведомления, никаких ошибок. Люди в форме разрешили вам стать одним из них.'],dark:['В темноте','Вы не заколотили окна и погасили свет. В темноте кто-то сел рядом и тихо сказал: «Мы подождём».']};
