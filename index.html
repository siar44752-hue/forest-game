<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игровая комната — играй с друзьями</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0b0818;color:#ece9ff;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(900px 600px at 10% -10%,#5b21b655,transparent),radial-gradient(800px 500px at 100% 10%,#0891b244,transparent),radial-gradient(700px 500px at 50% 110%,#be185d33,transparent);z-index:-2}
.bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bg i{position:absolute;font-style:normal;opacity:.07;animation:fl linear infinite}
@keyframes fl{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}
header{display:flex;gap:10px;align-items:center;padding:10px 18px;position:sticky;top:0;background:#0b0818dd;backdrop-filter:blur(10px);z-index:30;border-bottom:1px solid #ffffff14}
#logo{font-size:20px;font-weight:800;cursor:pointer;white-space:nowrap;background:linear-gradient(90deg,#c4b5fd,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
#me{cursor:pointer;font-weight:600;padding:6px 12px;background:#ffffff12;border-radius:20px;white-space:nowrap}
#frbtn{display:none}
input{background:#ffffff12;border:1px solid #ffffff26;color:#fff;border-radius:10px;padding:10px 12px;font-size:15px;outline:none;min-width:0;font-family:inherit}
input:focus{border-color:#a78bfa}
#wrap{display:flex;gap:16px;max-width:1360px;margin:0 auto;padding:0 14px}
main{flex:1;min-width:0;padding:16px 0 40px}
#fr{width:250px;flex:none;position:sticky;top:62px;align-self:flex-start;max-height:calc(100vh - 74px);overflow:auto;background:#ffffff0c;border:1px solid #ffffff1c;border-radius:16px;padding:12px;margin-top:16px;font-size:14px}
#fr h4{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
#fr small,.small{font-size:12px;color:#a9a3cc}
.myid{background:#0004;border-radius:10px;padding:6px 10px;margin-bottom:8px;font-size:13px}.myid b{letter-spacing:2px;color:#67e8f9}
.fr{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:10px}.fr:hover{background:#ffffff0d}
.fr .d{width:9px;height:9px;border-radius:50%;background:#64748b;flex:none}.fr.on .d{background:#22c55e;box-shadow:0 0 8px #22c55e}
.fr .fn{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .x{cursor:pointer;opacity:.4}.fr .x:hover{opacity:1}
.inv{background:#7c3aed33;border:1px solid #a78bfa66;border-radius:12px;padding:8px;margin:6px 0}
.muted{color:#a9a3cc}
.hero{text-align:center;padding:26px 0 8px}
.hero h1{font-size:clamp(30px,6vw,54px);margin:8px 0;line-height:1.05}
.hero h1 span{background:linear-gradient(90deg,#c4b5fd,#67e8f9,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-block;padding:4px 14px;border-radius:20px;background:#ffffff12;border:1px solid #ffffff1f;font-size:13px}
.join{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;margin:16px 0}
.join input{width:150px;text-transform:uppercase;letter-spacing:3px;text-align:center}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:10px 0}.tabs input{margin-left:auto;width:190px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:12px}
.card{background:#ffffff0b;border:1px solid #ffffff1c;border-radius:20px;overflow:hidden;transition:.2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-5px);box-shadow:0 16px 36px #0009,0 0 0 1px var(--c)}
.ban{height:104px;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 30% 20%,var(--c),transparent 70%),linear-gradient(135deg,#ffffff0a,#0006)}
.ban .ic{font-size:56px;filter:drop-shadow(0 6px 10px #0008);transition:.3s}.card:hover .ic{transform:scale(1.18) rotate(-6deg)}
.ban .tag{position:absolute;top:8px;right:10px;font-size:12px;background:#0006;padding:2px 9px;border-radius:12px}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}.cb h3{margin:0 0 4px}.cb p{margin:0 0 10px;color:#c9c4e8;font-size:13.5px;line-height:1.4;flex:1}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.meta span{font-size:12px;background:#ffffff12;padding:2px 9px;border-radius:12px;color:#c9c4e8}
.btn{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;margin:3px;transition:.15s;font-family:inherit}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.97)}
.btn.big{padding:13px 24px;font-size:17px}.btn.sm{padding:6px 12px;font-size:13px}.btn.ghost{background:#ffffff14}
.bar{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.bar b{font-size:18px;margin-right:auto}
.lob{max-width:600px;margin:20px auto;text-align:center;background:#ffffff0d;border:1px solid #ffffff1f;border-radius:22px;padding:22px}
.lob h2{margin:4px 0}.code{font-size:56px;font-weight:900;letter-spacing:10px;color:#67e8f9;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 16px}
.chip{display:inline-flex;gap:6px;align-items:center;background:#ffffff12;border:1px solid var(--c,#fff3);border-radius:20px;padding:5px 12px;font-size:14px}
.chip.st{background:#7c3aed55}.chip.out{opacity:.45}
.rules{text-align:left;font-size:13px;color:#c9c4e8;background:#0004;border-radius:12px;padding:10px 14px;margin:10px 0}
.opts{background:#0003;border-radius:12px;padding:6px 10px;margin:10px 0;text-align:left}.orow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:3px 0;font-size:14px}
.av{font-size:30px;cursor:pointer;padding:6px;border-radius:12px;border:2px solid transparent;display:inline-block}.av.on{border-color:#a78bfa;background:#7c3aed33}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111e;border:1px solid #fff3;padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:50}
#toast.on{opacity:1}
.cf{position:fixed;top:-30px;font-size:26px;z-index:60;pointer-events:none;animation:cf 2.8s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
.sc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mb{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:3px;aspect-ratio:1;max-width:680px;margin:0 auto}
.mc{background:#ffffff10;border:1px solid #ffffff1a;border-radius:6px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:clamp(7px,1.5vw,11px);padding:2px;overflow:hidden;line-height:1.15}
.mc i{position:absolute;top:0;left:0;right:0;height:6px}.mc u{position:absolute;bottom:0;left:0;right:0;height:5px}
.mc .tk{font-size:clamp(10px,2.2vw,18px);line-height:1}
.mid{grid-area:2/2/7/7;background:#0005;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;font-size:clamp(11px,1.8vw,14px)}
.dice{font-size:clamp(30px,7vw,56px);letter-spacing:6px;line-height:1}
.pp{display:flex;gap:8px;align-items:center;padding:6px 12px;border-radius:12px;background:#ffffff0d;border-left:4px solid var(--c);margin:4px 0}.pp.cur{background:#7c3aed44}.pp.out{opacity:.4;text-decoration:line-through}
.log{font-size:12px;color:#b8b2dc;max-height:90px;overflow:hidden}
.hand,.tbl{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.pc{width:104px;height:146px;border-radius:12px;overflow:hidden;cursor:pointer;border:3px solid transparent;transition:.15s;flex:none;background:#000}
.pc svg{display:block;width:100%;height:100%}
.pc:hover{transform:translateY(-4px) scale(1.04)}.pc.sel{border-color:#fff;transform:translateY(-8px);box-shadow:0 0 18px #fff6}
.tc{text-align:center;font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:center}.tc.win .pc{border-color:#facc15;box-shadow:0 0 18px #facc1588}
.uc{width:64px;height:92px;border-radius:10px;border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;cursor:pointer;transition:.15s;flex:none;text-shadow:0 2px 4px #0006;box-shadow:inset 0 0 0 4px #fff2}
.uc.no{opacity:.45;cursor:default}.uc.ok:hover{transform:translateY(-8px)}.uc.big{width:90px;height:130px;font-size:40px;cursor:default}
.uno{display:flex;gap:18px;align-items:center;justify-content:center;margin:14px 0;flex-wrap:wrap}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #fff;vertical-align:middle}
.role{font-size:22px;text-align:center;background:#ffffff10;border-radius:16px;padding:22px;margin:12px 0}
.locs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#cv{width:100%;max-width:800px;background:#fff;border-radius:14px;touch-action:none;display:block;margin:0 auto;cursor:crosshair}
#cv.hk{background:#0e4a5c;cursor:none}
.tools{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff8;cursor:pointer;display:inline-block}
.chat{max-width:640px;margin:10px auto;font-size:14px}.chat div{padding:3px 0}.chat .ok{color:#86efac;font-weight:700}.chat .sys{color:#fbbf24;font-style:italic}
.dk{width:58px;height:84px;background:#fff;color:#111;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;cursor:pointer;flex:none;border:2px solid #0003;transition:.15s;flex-direction:column}
.dk.r{color:#dc2626}.dk.big{width:70px;height:100px;cursor:default}.dk.no{opacity:.5;cursor:default}.dk:hover:not(.no):not(.big){transform:translateY(-6px)}
.pair{position:relative;width:84px;height:100px}.pair .dk{position:absolute;left:0;top:0}.pair .dk.on{left:24px;top:14px;box-shadow:0 0 0 2px #22c55e}
.dt{border-collapse:collapse;width:100%;max-width:640px;margin:10px auto;font-size:13px}.dt td,.dt th{border:1px solid #ffffff1f;padding:5px 7px;text-align:center}.dt td:first-child{text-align:left}.pk{background:#22c55e33;cursor:pointer;font-weight:700}
.dd{font-size:54px;cursor:pointer;padding:0 4px;border-radius:10px;line-height:1.1;display:inline-block}.dd.hold{background:#facc1544;box-shadow:0 0 0 2px #facc15}
.mg{display:grid;gap:8px;max-width:420px;margin:10px auto}
.mm{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5vw,34px);background:#ffffff14;border:3px solid #ffffff22;border-radius:12px;cursor:pointer;transition:.2s}.mm.up{background:#ffffff33}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:420px;margin:10px auto;background:#1d4ed8;padding:10px;border-radius:14px}
.c4 i{aspect-ratio:1;border-radius:50%;background:#0b0818;display:block;cursor:pointer}.c4 i.p1{background:#ef4444}.c4 i.p2{background:#facc15}
.rv{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;max-width:440px;margin:10px auto;background:#14532d;padding:6px;border-radius:12px}
.rv i{aspect-ratio:1;background:#16a34a;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:clamp(16px,5vw,30px);border-radius:4px}.rv i.mv{cursor:pointer;background:#22c55e}.rv i.mv:after{content:"•";color:#fff8}
.qo{display:block;width:100%;text-align:left;margin:6px 0;padding:12px 14px;background:#ffffff14}.qo.ok{background:#16a34a}.qo.bad{background:#dc2626}.qo.me{box-shadow:0 0 0 2px #fff}
.wb{display:grid;grid-template-columns:repeat(5,46px);gap:4px;justify-content:center;margin:8px auto}.wc{height:46px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;text-transform:uppercase;border-radius:7px;background:#ffffff12;border:2px solid #ffffff2a}
.wm{grid-template-columns:repeat(5,16px);gap:2px}.wm .wc{height:10px;border-radius:2px;border-width:1px}
@media(max-width:900px){#fr{position:fixed;right:8px;top:58px;z-index:40;display:none;width:270px;margin:0}#fr.open{display:block}#frbtn{display:inline-block}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<header>
  <div id="logo" onclick="leave()">🎲 Игровая комната</div>
  <div style="flex:1"></div>
  <button id="sndbtn" class="btn sm ghost" onclick="togSnd()">🔊</button>
  <button id="frbtn" class="btn sm ghost" onclick="$('#fr').classList.toggle('open')">👥 <span id="frn"></span></button>
  <div id="me" onclick="welcome()"></div>
</header>
<div id="wrap"><main id="app"></main><aside id="fr"></aside></div>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ============ утилиты ============ */
var reg=[],freg=[],sel=null,unoPend=null,STROKES=[],lastR=0,tool={c:'#111111',w:5},tmr=null,net={},prof=null,uid=null,FR=[],online={},pc={},pend=[],invs=[],pst='в меню',pp=null,presDup=false,HK=null,hkRaf=0,homeCat='all',homeQ='';
const $=s=>document.querySelector(s),app=$('#app');
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const B=(l,f,c='')=>{reg.push(f);return `<button class="btn ${c}" onclick="reg[${reg.length-1}]()">${l}</button>`};
const FB=(l,f,c='')=>{freg.push(f);return `<button class="btn ${c}" onclick="freg[${freg.length-1}]()">${l}</button>`};
const FH=f=>{freg.push(f);return `freg[${freg.length-1}]()`};
const H=f=>{reg.push(f);return `reg[${reg.length-1}]()`};
const rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const COL=['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#f97316','#14b8a6','#ec4899','#84cc16','#06b6d4'];
const DEFTOK=['🔴','🔵','🟢','🟡','🟣','🟠','⚪','⚫','🟤','🔶'],TOK=DEFTOK.slice();
const setTok=ps=>{for(let i=0;i<10;i++)TOK[i]=(ps[i]&&ps[i].av)||DEFTOK[i]};
const AVS=['🦊','🐼','🐸','🐯','🦄','🐙','🦁','🐵','🐧','🐲','👽','🎃','🐱','🐶','🦉','🐻','🦖','🐰','🦈','🧛'];
const BN=['Борис','Вера','Гоша','Дина','Ёжик','Зина','Иван','Клава','Лев'],BA=['🤖','👾','🧠','🎩','🦾','🛸','🎲','🔮','🧞'];
const LV=()=>net.lvl==null?1:net.lvl;
const v_=(o,k,d)=>o&&o[k]!=null?o[k]:d;
const hnow=()=>Date.now()-(net.skew||0);
const norm=s=>String(s).toLowerCase().replace(/ё/g,'е').trim();
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3000)}
function pickSel(el,id){sel=id;document.querySelectorAll('.hand .pc').forEach(e=>e.classList.remove('sel'));el.classList.add('sel')}
var snd=true;try{snd=localStorage.getItem('snd')!=='0'}catch(e){}
function togSnd(){snd=!snd;try{localStorage.setItem('snd',snd?'1':'0')}catch(e){}$('#sndbtn').textContent=snd?'🔊':'🔇'}
function sfx(win){if(!snd)return;try{const c=sfx.c||(sfx.c=new (window.AudioContext||window.webkitAudioContext)());(win?[523,659,784,1047]:[330,262,196]).forEach((f,k)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.08;o.connect(g);g.connect(c.destination);o.start(c.currentTime+k*.12);o.stop(c.currentTime+k*.12+.2)})}catch(e){}}
function confetti(){const a=['🎉','✨','⭐','🎊','🏆'];for(let i=0;i<36;i++){const d=document.createElement('div');d.className='cf';d.textContent=a[rnd(a.length)];d.style.left=rnd(100)+'vw';d.style.animationDelay=(Math.random()*.8)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}}
(function(){let h='';for(let i=0;i<16;i++)h+=`<i style="left:${rnd(100)}%;font-size:${24+rnd(40)}px;animation-duration:${25+rnd(35)}s;animation-delay:-${rnd(40)}s">${['🎲','🃏','♠️','🎯','🧩','🎭','🏙️','🎮'][rnd(8)]}</i>`;$('#bg').innerHTML=h})();
try{prof=JSON.parse(localStorage.getItem('prof'));uid=localStorage.getItem('uid');FR=JSON.parse(localStorage.getItem('fr'))||[]}catch(e){}
if(!uid){uid=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[rnd(32)]).join('');try{localStorage.setItem('uid',uid)}catch(e){}}
const saveFr=()=>{try{localStorage.setItem('fr',JSON.stringify(FR))}catch(e){}};
const stats=()=>{try{return JSON.parse(localStorage.getItem('st'))||{}}catch(e){return{}}};
function addStat(g,w){const s=stats();s[g]=s[g]||{p:0,w:0};s[g].p++;if(w)s[g].w++;try{localStorage.setItem('st',JSON.stringify(s))}catch(e){}}
function setHead(){$('#me').innerHTML=prof?`${prof.av} ${E(prof.name)} ✎`:''}

/* ============ регистрация ============ */
function welcome(then){
  reg=[];let av=prof?prof.av:AVS[rnd(AVS.length)];
  app.innerHTML=`<div class="lob"><h2>👋 ${prof?'Твой профиль':'Добро пожаловать!'}</h2><p class="muted">Придумай имя и выбери аватар — друзья увидят их в играх. Профиль и твой ID хранятся в браузере.</p>
  <input id="pn" value="${prof?E(prof.name):''}" maxlength="14" placeholder="Твоё имя" style="width:80%;font-size:18px;text-align:center">
  <div style="margin:14px 0">${AVS.map(a=>`<span class="av ${a===av?'on':''}" onclick="${H(()=>{av=a;document.querySelectorAll('.av').forEach(e=>e.classList.toggle('on',e.textContent===a))})}">${a}</span>`).join('')}</div>
  ${B('Готово ➜',()=>{const n=$('#pn').value.trim();if(!n)return toast('Введи имя');prof={name:n.slice(0,14),av};try{localStorage.setItem('prof',JSON.stringify(prof))}catch(e){}setHead();initPresence();renderFr();typeof then==='function'?then():home()},'big')}</div>`;
}

/* ============ друзья и присутствие ============ */
function initPresence(){
  if(pp||!prof)return;
  pp=new Peer('ggu-'+uid);
  pp.on('open',()=>{pollFriends();setInterval(pollFriends,10000)});
  pp.on('connection',c=>presConn(c));
  pp.on('disconnected',()=>{try{pp.reconnect()}catch(e){}});
  pp.on('error',e=>{if(e.type==='unavailable-id'){presDup=true;renderFr()}});
}
function presConn(c){
  c.on('open',()=>c.send({t:'me',uid,name:prof.name,av:prof.av,s:pst}));
  c.on('data',m=>presRecv(c,m));
  c.on('close',()=>{if(c._u&&pc[c._u]===c){delete pc[c._u];delete online[c._u];renderFr()}});
}
function connectFriend(f){if(!pp||!pp.open||presDup||(pc[f.id]&&pc[f.id].open))return;try{presConn(pp.connect('ggu-'+f.id))}catch(e){}}
const pollFriends=()=>FR.forEach(connectFriend);
function setSt(s){pst=s;Object.values(pc).forEach(c=>c.open&&c.send({t:'st',s}))}
function presRecv(c,m){
  if(m.t==='me'){c._u=m.uid;const f=FR.find(x=>x.id===m.uid);if(f){f.name=m.name;f.av=m.av;saveFr();pc[m.uid]=c;online[m.uid]=m.s||'в сети';renderFr()}}
  else if(m.t==='st'&&c._u&&online[c._u]!==undefined){online[c._u]=m.s||'в сети';renderFr()}
  else if(m.t==='req'){if(FR.some(x=>x.id===m.uid)){addFriend(m);c.send({t:'acc',uid,name:prof.name,av:prof.av})}else if(!pend.some(x=>x.uid===m.uid)){m.c=c;pend.push(m);renderFr();toast(m.name+' хочет добавить тебя в друзья')}}
  else if(m.t==='acc'){addFriend(m);toast(m.name+' теперь твой друг!')}
  else if(m.t==='inv'&&FR.some(x=>x.id===m.uid)){invs=invs.filter(i=>i.code!==m.code);invs.push(m);renderFr();toast(m.name+' зовёт тебя играть!');$('#fr').classList.add('open')}
}

const broadcast=m=>Object.values(net.conns||{}).forEach(c=>c.open&&c.send(m));
const pub=o=>JSON.parse(JSON.stringify(o,(k,v)=>k[0]==='_'?undefined:v));
function pushState(){const G=GM[net.gid],S=net.S;for(const k in net.conns){const c=net.conns[k];if(c&&c.open)c.send({t:'state',S:pub(G.view?G.view(S,+k):S)})}}
const genCode=()=>Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[rnd(24)]).join('');
const mePl=()=>({name:prof.name,av:prof.av});
function hostRoom(gid){net={host:true,gid,players:[mePl()],conns:{},me:0,S:null,started:false,opts:{},lvl:1};setTok(net.players);openPeer(genCode())}
function soloGame(gid){
  const G=GM[gid];net={host:true,solo:true,gid,players:[mePl()],conns:{},me:0,S:null,started:false,code:'solo',opts:{},lvl:1};
  for(let k=0;k<G.sb;k++)addBot();setTok(net.players);lobby();
}
function addBot(){const u=net.players.filter(p=>p.bot).length;net.players.push({name:'Бот '+BN[u%9],av:BA[u%9],bot:true})}
function openPeer(code){
  net.code=code;const p=new Peer('ggames-'+code);net.peer=p;
  p.on('open',()=>{history.replaceState(null,'','#'+code);lobby()});
  p.on('disconnected',()=>{try{p.reconnect()}catch(e){}});
  p.on('error',e=>{if(e.type==='unavailable-id'){p.destroy();openPeer(genCode())}else if(e.type!=='peer-unavailable')toast('Ошибка сети: '+e.type)});
  p.on('connection',c=>{
    c.on('data',m=>hostRecv(c,m));
    c.on('close',()=>{
      const i=c._i;if(i==null||net.conns[i]!==c)return;const G=GM[net.gid];
      if(!net.started)return removePlayer(i);
      toast((net.players[i]?net.players[i].name:'Игрок')+' вышел');
      if(G.bot){net.players[i].bot=true;botTick()}else{clearInterval(net.rt);removePlayer(i)}
    });
  });
}
function hostRecv(c,m){
  const G=GM[net.gid];
  if(m.t==='join'){
    if(net.started)return c.send({t:'err',msg:'Игра уже идёт'});
    if(net.players.length>=G.max)return c.send({t:'err',msg:'Комната заполнена'});
    let av=m.av;if(net.players.some(p=>p.av===av))av=AVS.find(a=>!net.players.some(p=>p.av===a));
    const i=net.players.push({name:String(m.name).slice(0,14),av})-1;net.conns[i]=c;c._i=i;
    c.send({t:'hi',idx:i});sendLobby();
  }else if(m.t==='start'){if(!net.started&&net.players.length>=G.min)start()}
  else if(m.t==='act'&&net.started)applyAct(c._i,m.a);
  else if(m.t==='mv'&&c._i!=null){const G=GM[net.gid];G&&G.mv&&G.mv(c._i,m)}
  else if(m.t==='d'){drawSeg(m.seg);Object.values(net.conns).forEach(o=>o!==c&&o.open&&o.send(m))}
}
function removePlayer(j){
  net.players.splice(j,1);const nc={};
  for(const k in net.conns){const o=+k;if(o===j)continue;const ni=o>j?o-1:o;nc[ni]=net.conns[k];nc[ni]._i=ni;if(ni!==o&&nc[ni].open)nc[ni].send({t:'hi',idx:ni})}
  net.conns=nc;sendLobby();
}
function sendLobby(){net.started=false;clearInterval(net.rt);clearTimeout(net.bt);clearTimeout(net.at);setTok(net.players);broadcast({t:'lobby',gid:net.gid,players:net.players,code:net.code,opts:net.opts});lobby()}
function joinRoom(code){
  code=(code||'').trim().toUpperCase();if(code.length<4)return toast('Введи код комнаты');
  if(!prof)return welcome(()=>joinRoom(code));
  net={host:false,players:[],me:-1,code,S:null,started:false,opts:{}};
  app.innerHTML='<p class="muted" style="text-align:center;margin-top:60px">Подключаемся к комнате '+E(code)+'…</p>';
  const p=new Peer();net.peer=p;
  net.jt=setTimeout(()=>{if(net.peer===p&&net.me<0){toast('Не удалось подключиться. Проверь код и сеть.');cleanup();home()}},12000);
  p.on('open',()=>{
    const c=p.connect('ggames-'+code,{reliable:true});net.conn=c;
    c.on('open',()=>c.send({t:'join',name:prof.name,av:prof.av}));
    c.on('data',guestRecv);
    c.on('close',()=>{if(net.peer===p){toast('Связь с хостом потеряна');cleanup();home()}});
  });
  p.on('error',e=>{if(net.peer!==p)return;toast(e.type==='peer-unavailable'?'Комната не найдена':'Ошибка сети: '+e.type);cleanup();home()});
}
function guestRecv(m){
  if(m.t==='hi'){net.me=m.idx;clearTimeout(net.jt)}
  else if(m.t==='lobby'){net.gid=m.gid;net.players=m.players;net.code=m.code;net.opts=m.opts||{};net.started=false;setTok(net.players);lobby()}
  else if(m.t==='state'){setTok(net.players);net.skew=Date.now()-(m.S.now||Date.now());net.S=m.S;net.started=true;showGame()}
  else if(m.t==='rt'){const G=GM[net.gid];G&&G.rt&&G.rt(m.h)}
  else if(m.t==='d')drawSeg(m.seg);
  else if(m.t==='err'){toast(m.msg);cleanup();home()}
  else if(m.t==='end'){toast('Хост закрыл комнату');cleanup();home()}
}
function cleanup(){clearTimeout(net.jt);clearTimeout(net.bt);clearTimeout(net.at);clearInterval(net.rt);try{net.peer&&net.peer.destroy()}catch(e){}net={};HK=null;clearInterval(tmr);try{history.replaceState(null,'',location.pathname)}catch(e){}}
function leave(quiet){if(net.host)broadcast({t:'end'});cleanup();if(quiet===true)return;if(prof)home();else welcome()}
const toLobby=()=>sendLobby();
const reqStart=()=>{if(net.host)start();else net.conn&&net.conn.send({t:'start'})};
const optsOf=G=>{const o={};(G.opts||[]).forEach(op=>o[op.k]=v_(net.opts,op.k,op.d||0));return o};
function start(){
  const G=GM[net.gid];if(net.players.length<G.min)return;
  setTok(net.players);clearTimeout(net.bt);clearTimeout(net.at);clearInterval(net.rt);
  net.S=G.init(net.players.map(p=>p.name),optsOf(G));net.S.gameId=Date.now()+'_'+rnd(1e6);net.S.now=Date.now();net.started=true;
  STROKES=[];lastR=0;HK=null;pushState();showGame();G.onStart&&G.onStart();schedAuto();botTick();
}
function send(a){sel=null;unoPend=null;if(net.host)applyAct(net.me,a);else net.conn&&net.conn.send({t:'act',a})}
function schedAuto(){
  const S=net.S;clearTimeout(net.at);
  if(S&&S.auto){const au=S.auto,ms=au.at?Math.max(0,au.at-Date.now()):au.ms;net.at=setTimeout(()=>{if(net.S===S&&S.auto===au)applyAct(-1,au)},ms)}
}
function applyAct(i,a){
  const G=GM[net.gid];try{G.act(net.S,i,a)}catch(e){console.error(e);return}
  net.S.now=Date.now();pushState();showGame();schedAuto();botTick();
}
function botTick(){
  clearTimeout(net.bt);const G=GM[net.gid],S=net.S;
  if(!net.host||!net.started||!S||!G.bot)return;
  net.bt=setTimeout(()=>{
    if(net.S!==S||!net.started)return;
    const all=net.players.every(p=>p.bot);
    for(let i=0;i<net.players.length;i++){if(!net.players[i].bot)continue;const a=G.bot(S,i,all);if(a){applyAct(i,a);return}}
  },G.bd||900);
}

const EM=EMW.map(x=>x[0]),EW=Object.fromEntries(EMW);
const prng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const NC=160,CE={},ART={};
function cardEm(id){if(CE[id])return CE[id];const R=prng(id*7919+13);return CE[id]=[0,1,2].map(()=>EM[Math.floor(R()*EM.length)])}
function art(id){

/* ============ 3. УНО ============ */
const UC={R:'#dc2626',G:'#16a34a',B:'#2563eb',Y:'#ca8a04',W:'#1f2937'},UN={R:'🔴',G:'🟢',B:'🔵',Y:'🟡'};
const ul=c=>c.v==='s'?'⛔':c.v==='r'?'⇄':c.v==='w'?'🌈':c.v;
const ucard=(c,cls,on)=>`<div class="uc ${cls||''}" style="background:${UC[c.c]}" ${on?`onclick="${on}"`:''}>${ul(c)}</div>`;
function unoDraw(S,p,k){for(let j=0;j<k;j++){if(!S._deck.length){S._deck=shuf(S._disc);S._disc=[]}if(!S._deck.length)return;S.hands[p].push(S._deck.pop())}}
const unoOk=(S,c)=>c.c==='W'||c.c===S.col||c.v===S.top.v;
const UNO={id:'uno',name:'Уно',icon:'🃏',color:'#ef4444',cat:['card','fast'],time:'10 мин',min:2,max:6,sb:3,bd:900,
desc:'Классические карточки: сбрасывай карты по цвету или значению и первым избавься от всех. Пропуски, развороты, +2 и +4!',

init(names,o){const deck=[];for(const c of 'RGBY'){deck.push({c,v:'0'});for(const v of ['1','2','3','4','5','6','7','8','9','s','r','+2'])deck.push({c,v},{c,v})}
  for(let i=0;i<4;i++)deck.push({c:'W',v:'w'},{c:'W',v:'+4'});
  const d=shuf(deck),hn=[5,7,10][v_(o,'hand',1)],hands=names.map(()=>d.splice(0,hn));let top;do{top=d.pop();if(top.c==='W'){d.unshift(top);top=null}}while(!top);

act(S,i,a){

},
bot(S,i){if(S.win>=0||S.turn!==i)return null;const h=S.hands[i];

/* ============ 4. ДУРАК ============ */
const SU='♠♥♦♣',RK={11:'В',12:'Д',13:'К',14:'Т'};

const dlab=c=>{const x=dc(c);return (RK[x.r]||x.r)+SU[x.s]};
const dbeat=(S,a,d)=>{const x=dc(a),y=dc(d);return (y.s===x.s&&y.r>x.r)||(y.s===S.tr&&x.s!==S.tr)};
const dcard=(c,cls,on)=>`<div class="dk ${dc(c).s===1||dc(c).s===2?'r':''} ${cls||''}" ${on?`onclick="${on}"`:''}>${dlab(c)}</div>`;
function dEnd(S,took){
  const n=S.names.length;S.table=[];
  const order=[S.att];for(let k=1;k<n;k++){const j=(S.att+k)%n;if(j!==S.def)order.push(j)}order.push(S.def);
  order.forEach(p=>{while(S.hands[p].length<6&&S.deck.length)S.hands[p].push(S.deck.pop())});
  if(!S.deck.length)S.hands.forEach((h,p)=>{if(!h.length)S.out[p]=true});
  const alive=S.out.map((o,p)=>o?-1:p).filter(p=>p>=0);
  if(alive.length<=1){S.over=true;S.lose=alive.length?alive[0]:-1;S.log=S.lose>=0?`Дурак — ${S.names[S.lose]}!`:'Ничья!';return}
  const nxt=p=>{let q=p;do{q=(q+1)%n}while(S.out[q]);return q};
  const na=took?nxt(S.def):(S.out[S.def]?nxt(S.def):S.def);
  S.att=na;S.def=nxt(na);S.lim=Math.min(6,S.hands[S.def].length);

const DUR={id:'dur',name:'Дурак',icon:'♠️',color:'#64748b',cat:['card'],time:'10 мин',min:2,max:4,sb:1,bd:900,
desc:'Классический подкидной дурак колодой из 36 карт. Отбивайся, подкидывай и не останься последним с картами!',
rules:'Козырь бьёт любую некозырную масть. Атакующий кладёт карту, защитник бьёт старшей картой той же масти или козырем (или «Беру»). Когда всё побито — атакующий подкидывает карты тех же значений или говорит «Бито». После хода все добирают до 6 карт. Кто последним остался с картами — дурак.',
init(names){const n=names.length,d=shuf([...Array(36).keys()]),hands=names.map(()=>d.splice(0,6)),tr=dc(d[0]).s;
  const S={names,deck:d,tr,hands,att:0,def:1%n,table:[],lim:6,out:names.map(()=>false),over:false,lose:-1,log:'Игра началась'};S.lim=Math.min(6,hands[S.def].length);return S},
act(S,i,a){
  if(S.over)return;const T=S.table,und=T.filter(p=>!p.d).length;
  if(a.t==='att'&&i===S.att){const h=S.hands[i];if(!h.includes(a.c)||T.length>=S.lim)return;
    if(T.length&&!T.some(p=>dc(p.a).r===dc(a.c).r||(p.d!=null&&dc(p.d).r===dc(a.c).r)))return;

bot(S,i){if(S.over)return null;const h=S.hands[i],T=S.table,key=c=>dc(c).r+(dc(c).s===S.tr?20:0);

  if(i===S.att){
    const ok=h.filter(c=>!T.length||T.some(p=>dc(p.a).r===dc(c).r||(p.d!=null&&dc(p.d).r===dc(c).r))).sort((a,b)=>key(a)-key(b));

/* ============ 5. МАФИЯ ============ */

const MAF={id:'maf',name:'Мафия',icon:'🕶️',color:'#7c3aed',cat:['party'],time:'15 мин',min:4,max:10,sb:5,bd:1000,

    else h+='<p class="muted" style="text-align:center">🌙 Город спит… Ждём утра.</p>';
  }else if(S.ph==='day'){
    h+=al[me]?(S.ready[me]?'<p class="muted" style="text-align:center">Ждём остальных…</p>':`<div style="text-align:center">${B('Готов голосовать ✋',()=>send({t:'rdy'}),'big')}</div>`)+chatIn('Скажи что-нибудь городу…',t=>({t:'say',text:t})):'';
  }else if(S.ph==='vote'){

/* ============ 6. АЭРОХОККЕЙ (физика) ============ */
const HW=800,HH=440,PRD=34,KRD=17,GHT=160;
const hkInit=()=>({k:[HW/2,HH/2,0,0],p:[[100,HH/2],[HW-100,HH/2]],pv:[[0,0],[0,0]],tg:[[100,HH/2],[HW-100,HH/2]],pause:75});
function hkBot(i){const sp=[300,480,740][LV()]/60,K=HK.k,p=HK.p[i],own=i?HW:0,inHalf=i?K[0]>HW/2-45:K[0]<HW/2+45;let tx,ty;
  if(inHalf&&HK.pause<=0){
    const gx=i?0:HW,gy=HH/2+(Math.random()-.5)*60*(LV()?0:1),ax=gx-K[0],ay=gy-K[1],al=Math.hypot(ax,ay)||1,ux=ax/al,uy=ay/al,R=PRD+KRD;
    const sx=K[0]-ux*(R+6),sy=K[1]-uy*(R+6),dot=(K[0]-p[0])*ux+(K[1]-p[1])*uy,perp=Math.abs((K[0]-p[0])*uy-(K[1]-p[1])*ux);
    if(dot>0&&perp<PRD*.9){tx=K[0]+ux*60;ty=K[1]+uy*60}else{tx=sx;ty=sy}
  }else{tx=own+(i?-90:90);ty=HH/2+(K[1]-HH/2)*.35}
  const dx=tx-p[0],dy=ty-p[1],d=Math.hypot(dx,dy)||1,st=Math.min(d,sp);HK.tg[i]=[p[0]+dx/d*st,p[1]+dy/d*st]}
function hkGoal(p){HK.k=[HW/2,HH/2,0,0];HK.pause=80;applyAct(-1,{t:'goal',p})}
function hkStep(dt){
  const K=HK.k;
  for(let i=0;i<2;i++){
    if(net.players[i]&&net.players[i].bot)hkBot(i);
    let[tx,ty]=HK.tg[i];const lo=i?HW/2+PRD:PRD,hi=i?HW-PRD:HW/2-PRD;
    tx=Math.max(lo,Math.min(hi,tx));ty=Math.max(PRD,Math.min(HH-PRD,ty));
    const p=HK.p[i],dx=tx-p[0],dy=ty-p[1],d=Math.hypot(dx,dy),mx=1500*dt,s=d>mx?mx/d:1,nx=p[0]+dx*s,ny=p[1]+dy*s;
    HK.pv[i]=[(nx-p[0])/dt,(ny-p[1])/dt];p[0]=nx;p[1]=ny;
  }
  if(HK.pause>0){HK.pause--;return}
  K[0]+=K[2]*dt;K[1]+=K[3]*dt;const f=Math.pow(.6,dt);K[2]*=f;K[3]*=f;
  if(K[1]<KRD){K[1]=KRD;K[3]=Math.abs(K[3])*.92}if(K[1]>HH-KRD){K[1]=HH-KRD;K[3]=-Math.abs(K[3])*.92}
  const inG=K[1]>(HH-GHT)/2+KRD*.4&&K[1]<(HH+GHT)/2-KRD*.4;
  if(K[0]<KRD&&!inG){K[0]=KRD;K[2]=Math.abs(K[2])*.92}
  if(K[0]>HW-KRD&&!inG){K[0]=HW-KRD;K[2]=-Math.abs(K[2])*.92}
  for(let i=0;i<2;i++){const p=HK.p[i],dx=K[0]-p[0],dy=K[1]-p[1],d=Math.hypot(dx,dy),R=PRD+KRD;
    if(d<R&&d>0){const nx=dx/d,ny=dy/d;K[0]=p[0]+nx*R;K[1]=p[1]+ny*R;const vn=(K[2]-HK.pv[i][0])*nx+(K[3]-HK.pv[i][1])*ny;
      if(vn<0){K[2]-=1.9*vn*nx;K[3]-=1.9*vn*ny}const sp=Math.hypot(K[2],K[3]);if(sp>1400){K[2]*=1400/sp;K[3]*=1400/sp}}}
  if(K[0]<-KRD||K[0]>HW+KRD)hkGoal(K[0]<0?1:0);
}
function hkStart(){
  clearInterval(net.rt);HK=hkInit();let f=0;
  net.rt=setInterval(()=>{if(!net.S||net.S.over)return;hkStep(1/60);if(++f%2===0){const K=HK.k,p=HK.p;broadcast({t:'rt',h:[K[0]|0,K[1]|0,p[0][0]|0,p[0][1]|0,p[1][0]|0,p[1][1]|0]})}},16);
}
function hkDraw(cv){
  const x=cv.getContext('2d');x.clearRect(0,0,HW,HH);
  const g=x.createLinearGradient(0,0,0,HH);g.addColorStop(0,'#0e4a5c');g.addColorStop(1,'#08303d');x.fillStyle=g;x.fillRect(0,0,HW,HH);
  x.strokeStyle='#ffffff55';x.lineWidth=4;x.strokeRect(2,2,HW-4,HH-4);x.beginPath();x.moveTo(HW/2,0);x.lineTo(HW/2,HH);x.stroke();x.beginPath();x.arc(HW/2,HH/2,70,0,7);x.stroke();
  const gy=(HH-GHT)/2;x.fillStyle=COL[0]+'66';x.fillRect(0,gy,12,GHT);x.fillStyle=COL[1]+'66';x.fillRect(HW-12,gy,12,GHT);
  if(!HK)return;
  HK.p.forEach((p,i)=>{x.beginPath();x.arc(p[0],p[1],PRD,0,7);x.fillStyle=COL[i];x.shadowColor=COL[i];x.shadowBlur=18;x.fill();x.shadowBlur=0;x.beginPath();x.arc(p[0],p[1],PRD*.6,0,7);x.fillStyle='#ffffff33';x.fill();x.font='26px serif';x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText(TOK[i],p[0],p[1]+2)});
  const K=HK.k;x.beginPath();x.arc(K[0],K[1],KRD,0,7);x.fillStyle='#111';x.shadowColor='#fff';x.shadowBlur=14;x.fill();x.shadowBlur=0;x.lineWidth=3;x.strokeStyle='#fff';x.stroke();
}
function hkLoop(){if(net.gid!=='hock'){hkRaf=0;return}const cv=$('#cv');if(cv)hkDraw(cv);hkRaf=requestAnimationFrame(hkLoop)}
const HOCK={id:'hock',name:'Аэрохоккей',icon:'🏒',color:'#06b6d4',cat:['fast'],time:'5 мин',min:2,max:2,sb:1,bd:60000,
desc:'Настоящая физика: шайба отскакивает от бортов и бит. Двигай биту мышью или пальцем и забивай в ворота соперника!',
opts:[{k:'pts',n:'Игра до',v:['5','7','10'],d:1}],
rules:'Ты управляешь битой мышью или пальцем — она двигается в твоей половине поля. Загони шайбу в ворота соперника (слева играет 1-й игрок, справа 2-й). Побеждает первый, кто забьёт нужное число голов.',
init(names,o){return{names,sc:[0,0],lim:[5,7,10][v_(o,'pts',1)],over:false,log:'Вперёд!'}},
onStart:hkStart,
act(S,i,a){if(S.over||i!==-1||a.t!=='goal')return;S.sc[a.p]++;S.log=`Гол! ${S.names[a.p]}`;if(S.sc[a.p]>=S.lim)S.over=true},
bot(){return null},
win(S,me){return S.over?S.sc[me]>S.sc[1-me]:null},
render(S,me){
  return `<div class="sc">${S.names.map((x,i)=>`<span class="chip" style="--c:${COL[i]}">${TOK[i]} ${E(x)}${i===me?' (ты)':''} <b>${S.sc[i]}</b></span>`).join('')}<span class="chip">до ${S.lim}</span></div>
  ${S.over?`<h2 style="text-align:center">🏆 ${E(S.names[S.sc[0]>S.sc[1]?0:1])} победил(а)!</h2>`:`<p class="muted" style="text-align:center">${E(S.log)} · ты играешь ${me?'справа':'слева'}</p>`}
  <canvas id="cv" class="hk" width="${HW}" height="${HH}"></canvas>`;
},
after(S,me){
  const cv=$('#cv');if(!cv)return;let ls=0;
  const mv=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*HW,y=(e.clientY-r.top)/r.height*HH;
    if(net.host){if(HK)HK.tg[net.me]=[x,y]}else{const t=Date.now();if(t-ls>30){ls=t;net.conn&&net.conn.send({t:'mv',x,y})}}};
  cv.onpointermove=mv;cv.onpointerdown=mv;
  if(!hkRaf)hkRaf=requestAnimationFrame(hkLoop);
}};

function line(x,s){x.strokeStyle=s.c;x.lineWidth=s.w*2;x.lineCap='round';x.beginPath();x.moveTo(s.p[0][0]*800,s.p[0][1]*550);x.lineTo(s.p[1][0]*800,s.p[1][1]*550);x.stroke()}
function redraw(){const cv=$('#cv'),x=cv&&cv.getContext&&cv.getContext('2d');if(!x)return;x.fillStyle='#fff';x.fillRect(0,0,800,550);STROKES.forEach(s=>line(x,s))}
function drawSeg(s){
  if(s.clr){STROKES=[];redraw()}else if(s.undo){STROKES=STROKES.filter(x=>x.sid!==s.undo);redraw()}
  else{STROKES.push(s);const cv=$('#cv'),x=cv&&cv.getContext&&cv.getContext('2d');x&&line(x,s)}
}
function emit(s){drawSeg(s);if(net.host)broadcast({t:'d',seg:s});else net.conn&&net.conn.send({t:'d',seg:s})}
function crNew(S){S.word=S._pool.length?S._pool.pop():'слово';S.hint=shuf([...Array(S.word.length).keys()]);S.t0=Date.now();S.auto={t:'end',at:S.t0+S.lim*1000,r:S.round}}

rules:'Один рисует загаданное слово (писать буквы нельзя!), остальные вводят догадки. Угадавший получает +2, художник +1, и угадавший рисует следующим. Если время вышло — слово раскрывается, рисует следующий. По ходу раунда открываются буквы-подсказки.',
init(names,o){const S={names,dr:0,_pool:wordPool(v_(o,'w',2)),lim:[60,90,120][v_(o,'t',1)],score:names.map(()=>0),chat:[],round:1};crNew(S);return S},
act(S,i,a){
  const n=S.names.length;

    else pushChat(S,i,t);
  }else if(a.t==='skip'&&i===S.dr){pushChat(S,i,'сменил(а) слово',{sys:1});S.round++;crNew(S)}
  else if(a.t==='end'&&i<0&&a.r===S.round){pushChat(S,-1,`⏰ Время вышло! Слово было: «${S.word}»`,{sys:1});S.dr=(S.dr+1)%n;S.round++;crNew(S)}
},

    const ht=$('#ht');if(ht){const nr=Math.min(Math.floor(e/S.lim*3),Math.max(0,S.word.length-2)),sh=S.hint.slice(0,nr);ht.textContent=S.word.split('').map((c,k)=>c===' '?'  ':sh.includes(k)?c:'_').join(' ')}};

/* ============ 10. ОБЪЯСНИ СЛОВО ============ */

  if(d===0)return rvEval(b,me);

  let v=1e9;for(const k of mv){v=Math.min(v,rvMM(rvApply(b,k,p),3-p,d-1,me,al,be));be=Math.min(be,v);if(al>=be)break}return v}
const REV={id:'rev',name:'Реверси',icon:'⚫',color:'#16a34a',cat:['board'],time:'10 мин',min:2,max:2,sb:1,bd:800,

rules:'Ходи на пустую клетку так, чтобы зажать ряд фишек соперника между новой фишкой и своей — они перевернутся. Подсвеченные клетки — допустимые ходы. Если ходов нет, ход пропускается. Побеждает тот, у кого больше фишек.',

const C4={id:'c4',name:'Четыре в ряд',icon:'🔴',color:'#3b82f6',cat:['board','fast'],time:'5 мин',min:2,max:2,sb:1,bd:700,

const AW=800,AH=440;var ARA={a:60,p:60},ARAN=null,arSeen=0,arRaf=0,snRaf=0,SN=null;
function artSim(S,i,a,p){
  const tk=S.tk[i],T=S.T,rad=a*Math.PI/180,v=p*7.5;let x=tk.x,y=T[x>>2]-14,vx=Math.cos(rad)*v,vy=-Math.sin(rad)*v;const path=[[x,y]];
  for(let st=0;st<1200;st++){
    vx+=S.wind*.02;vy+=9;x+=vx*.02;y+=vy*.02;if(st%2===0)path.push([x|0,y|0]);
    if(x<0||x>=AW||y>AH+60)return{path,hit:null};
    if(st>2&&y>=T[x>>2])return{path,hit:[x,T[x>>2]]};
    for(let j=0;j<S.tk.length;j++){const t=S.tk[j];if(t.hp<=0||(j===i&&st<14))continue;if(Math.hypot(x-t.x,y-(T[t.x>>2]-8))<13)return{path,hit:[x,y]}}

}
function artBoom(S,hx,hy){

  const tg=x.createLinearGradient(0,200,0,AH);tg.addColorStop(0,'#4ade80');tg.addColorStop(.15,'#166534');tg.addColorStop(1,'#422006');x.fillStyle=tg;x.fill();
  S.tk.forEach((t,i)=>{if(t.hp<=0)return;const ty=S.T[t.x>>2];x.fillStyle=COL[i];x.fillRect(t.x-12,ty-10,24,10);x.beginPath();x.arc(t.x,ty-10,8,Math.PI,0);x.fill();
    const aim=(i===S.turn&&i===net.me&&!S.over)?ARA.a:S.last[i][0],r=aim*Math.PI/180;x.strokeStyle='#111';x.lineWidth=4;x.beginPath();x.moveTo(t.x,ty-12);x.lineTo(t.x+Math.cos(r)*20,ty-12-Math.sin(r)*20);x.stroke();
    x.font='15px serif';x.textAlign='center';x.fillStyle='#fff';x.fillText(TOK[i],t.x,ty-26);x.fillStyle='#0008';x.fillRect(t.x-16,ty-46,32,5);x.fillStyle='#22c55e';x.fillRect(t.x-16,ty-46,32*t.hp/S.maxhp,5);
    if(i===S.turn&&!S.over){x.fillStyle='#fff';x.fillText('▼',t.x,ty-52)}});
  if(ARAN){const a=ARAN,pth=a.path,el=performance.now()-a.t0,k=Math.min(pth.length-1,Math.floor(el/18));
    x.strokeStyle='#ffffff99';x.lineWidth=2;x.beginPath();pth.slice(0,k+1).forEach((p,j)=>j?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.beginPath();x.arc(pth[k][0],pth[k][1],4,0,7);x.fillStyle='#fff';x.fill();
    if(k>=pth.length-1&&a.hit){const e=Math.min(1,(el-pth.length*18)/450);if(e<1){x.beginPath();x.arc(a.hit[0],a.hit[1],10+e*36,0,7);x.fillStyle=`rgba(255,${(190-e*130)|0},40,${1-e})`;x.fill()}}}
}
function arLoop(){if(net.gid!=='art'){arRaf=0;return}artDraw();if(ARAN&&performance.now()-ARAN.t0>ARAN.path.length*18+500)ARAN=null;arRaf=ARAN?requestAnimationFrame(arLoop):0}
function ARU(k,v){const lim=k==='a'?[0,180]:[10,100];ARA[k]=Math.max(lim[0],Math.min(lim[1],+v));const e=$('#'+k+'sl'),l=$('#'+k+'v');if(e)e.value=ARA[k];if(l)l.textContent=ARA[k];if(!arRaf)artDraw()}
const ARTL={id:'art',name:'Артиллерия',icon:'💣',color:'#ef4444',cat:['fast','board'],time:'8 мин',min:2,max:4,sb:1,bd:1400,
desc:'Физика снарядов: выбери угол и силу, учти ветер и разрушай землю под противником. Кратеры меняют поле!',

init(names,o){const n=names.length,mh=[50,100,150][v_(o,'hp',1)],p1=Math.random()*6,p2=Math.random()*6,p3=Math.random()*6,T=Array.from({length:200},(_,c)=>Math.round(290+30*Math.sin(c*.045+p1)+20*Math.sin(c*.11+p2)+12*Math.sin(c*.23+p3)));

act(S,i,a){

  const ang=Math.max(0,Math.min(180,+a.a||0)),pw=Math.max(10,Math.min(100,+a.p||10)),r=artSim(S,i,ang,pw);

bot(S,i){if(S.over||S.turn!==i)return null;const tg=S.tk.map((t,k)=>k).filter(k=>k!==i&&S.tk[k].hp>0);if(!tg.length)return null;

  const er=[14,6,1.5][LV()];return{t:'fire',a:ba+(Math.random()-.5)*2*er,p:bp+(Math.random()-.5)*er}},

  ${S.over?`<h2 style="text-align:center">${S.win>=0?'🏆 '+E(S.names[S.win])+' победил(а)!':'Ничья!'}</h2>`:`<p class="muted" style="text-align:center">${my?'Твой выстрел!':'Целится '+E(S.names[S.turn])+'…'}</p>`}

/* ============ 16. ЗМЕЙКИ (реальное время) ============ */
const SW=32,SH=20,SC=22,SDIR=[[1,0],[0,1],[-1,0],[0,-1]];
const pairs=a=>{const r=[];for(let i=0;i<a.length;i+=2)r.push([a[i],a[i+1]]);return r};
function snFood(){const occ=new Set();SN.sn.forEach(s=>s.b.forEach(c=>occ.add(c[0]+','+c[1])));SN.f.forEach(c=>occ.add(c[0]+','+c[1]));
  for(let t=0;t<300;t++){const c=[rnd(SW),rnd(SH)];if(!occ.has(c[0]+','+c[1])){SN.f.push(c);return}}}
function snInit(n,wrap){
  const st=[[[3,3],0],[[SW-4,SH-4],2],[[SW-4,3],1],[[3,SH-4],3]],sn=[];
  for(let i=0;i<n;i++){const[h,d]=st[i],dv=SDIR[d],b=[];for(let k=0;k<3;k++)b.push([h[0]-dv[0]*k,h[1]-dv[1]*k]);sn.push({b,d,nd:d,a:true,c:0})}
  SN={sn,f:[],wrap,tick:0};for(let k=0;k<Math.max(2,n);k++)snFood();
}
function snDir(i,d){const s=SN&&SN.sn[i];if(s&&s.a&&d>=0&&d<4&&(d+2)%4!==s.d)s.nd=d}
function snBot(i){
  const s=SN.sn[i],h=s.b[0],lv=LV(),occ=new Set();SN.sn.forEach(o=>o.b.forEach(c=>occ.add(c[0]+','+c[1])));
  const free=(x,y)=>{if(SN.wrap){x=(x+SW)%SW;y=(y+SH)%SH}return x>=0&&x<SW&&y>=0&&y<SH&&!occ.has(x+','+y)};
  const f=SN.f.reduce((a,c)=>{const d=Math.abs(c[0]-h[0])+Math.abs(c[1]-h[1]);return !a||d<a[1]?[c,d]:a},null);let best=-1e9,bd=s.d;
  for(let d=0;d<4;d++){if((d+2)%4===s.d)continue;const x=h[0]+SDIR[d][0],y=h[1]+SDIR[d][1];if(!free(x,y))continue;let sc=0;
    if(f)sc-=Math.abs(f[0][0]-x)+Math.abs(f[0][1]-y);
    if(lv>=1){let o=0;for(let e=0;e<4;e++)if(free(x+SDIR[e][0],y+SDIR[e][1]))o++;sc+=o*1.5}
    if(lv===0)sc+=Math.random()*6;if(sc>best){best=sc;bd=d}}
  s.nd=bd;
}
function snStep(){
  const sn=SN.sn;SN.tick++;
  sn.forEach((s,i)=>{if(s.a&&net.players[i]&&net.players[i].bot)snBot(i)});
  const nh=sn.map(s=>{if(!s.a)return null;s.d=s.nd;const dv=SDIR[s.d];let x=s.b[0][0]+dv[0],y=s.b[0][1]+dv[1];if(SN.wrap){x=(x+SW)%SW;y=(y+SH)%SH}return[x,y]});
  const dead=sn.map(()=>false);
  nh.forEach((h,i)=>{if(!h)return;if(h[0]<0||h[0]>=SW||h[1]<0||h[1]>=SH){dead[i]=true;return}
    for(let j=0;j<sn.length;j++){const o=sn[j];if(!o.a)continue;const L=o.b.length-1;
      for(let k=0;k<L;k++)if(o.b[k][0]===h[0]&&o.b[k][1]===h[1])dead[i]=true;
      if(j!==i&&nh[j]&&nh[j][0]===h[0]&&nh[j][1]===h[1])dead[i]=true}});
  sn.forEach((s,i)=>{if(!s.a)return;if(dead[i]){s.a=false;s.b=[];return}s.b.unshift(nh[i]);
    const fi=SN.f.findIndex(c=>c[0]===nh[i][0]&&c[1]===nh[i][1]);if(fi>=0){SN.f.splice(fi,1);s.c++;snFood()}else s.b.pop()});
  const al=sn.map((s,i)=>s.a?i:-1).filter(i=>i>=0);

  for(let i=0;i<30;i++){s+=ln('h',i);s+=ln('v',i)}for(let r=0;r<6;r++)for(let c=0;c<6;c++)s+=`<circle cx="${P(c)}" cy="${P(r)}" r="5" fill="#fff"/>`;
  return `<div class="sc">${S.names.map((x,i)=>`<span class="chip ${i===S.turn&&!S.over?'st':''}" style="--c:${COL[i]}">${TOK[i]} ${E(x)}${i===me?' (ты)':''} <b>${S.sc[i]}</b></span>`).join('')}</div>
  ${S.over?`<h2 style="text-align:center">🏆 ${E(S.names[S.sc.indexOf(Math.max(...S.sc))])} победил(а)!</h2>`:`<p class="muted" style="text-align:center">${my?'Твой ход — проведи линию':'Ходит '+E(S.names[S.turn])+'…'}</p>`}
  <svg viewBox="0 0 300 300" style="width:100%;max-width:460px;display:block;margin:0 auto;background:#ffffff0a;border-radius:16px">${s}</svg>`;
}};

/* ===== личные представления состояния (скрытая информация) ===== */
HOCK.rt=h=>{HK={k:[h[0],h[1],0,0],p:[[h[2],h[3]],[h[4],h[5]]]}};
HOCK.mv=(i,m)=>{if(HK)HK.tg[i]=[+m.x||0,+m.y||0]};
UNO.view=(S,i)=>({...S,hands:S.hands.map((h,k)=>k===i?h:h.map(()=>0))});
DUR.view=(S,i)=>({...S,hands:S.hands.map((h,k)=>k===i?h:h.map(()=>0)),deck:S.deck.map((c,k)=>k===0?c:0)});
IMG.view=(S,i)=>{const V={...S,hands:S.hands.map((h,k)=>k===i?h:h.map(()=>0))};
  if(S.ph==='pick')V.table=S.table.map(t=>t.o===i?t:{o:-1,c:-1});
  else if(S.ph==='vote'){V.table=S.table.map(t=>t.o===i?t:{o:-1,c:t.c});V.votes=Object.fromEntries(Object.keys(S.votes).map(k=>[k,+k===i?S.votes[k]:1]))}
  return V};
MAF.view=(S,i)=>{const r=S.role[i];return{...S,role:S.role.map((x,k)=>(S.ph==='over'||!S.alive[k]||k===i||(r==='m'&&x==='m'))?x:'?'),act:{m:{[i]:S.act.m[i]},d:r==='d'?S.act.d:undefined,s:r==='s'?S.act.s:undefined},chk:{[i]:S.chk[i]}}};
SPY.view=(S,i)=>{if(S.ph==='end')return S;if(S.dbl)return{...S,locs:S.locs.map((l,k)=>k===i?l:-1)};return{...S,loc:S.spy===i?-1:S.loc,spy:S.spy===i?i:-2}};
QUIZ.view=(S,i)=>({...S,qs:S.qs.map((q,k)=>k<S.qi||(k===S.qi&&S.ph!=='q')?q:{...q,a:-1,o:k===S.qi?q.o:[]})});
window.addEventListener('keydown',e=>{const G=GM[net.gid];if(G&&G.key&&net.started&&!/INPUT|TEXTAREA/.test((e.target||{}).tagName||''))G.key(e)});

/* ============ запуск ============ */
const GAMES=[MONO,IMG,UNO,DUR,MAF,HOCK,ARTL,SNK,QUIZ,CRO,SPY,ALS,WRD,CIT,REV,DAB,DICE,MEM,C4],GM=Object.fromEntries(GAMES.map(g=>[g.id,g]));
setHead();$('#sndbtn').textContent=snd?'🔊':'🔇';
if(prof)initPresence();
if(location.hash.length>3)prof?joinRoom(location.hash.slice(1)):welcome(()=>joinRoom(location.hash.slice(1)));
else prof?home():welcome();
renderFr();
</script>
