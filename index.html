 Object.keys(E.nodes).forEach(k=>edges(E.nodes[k]).forEach(t=>{if(pos[t])h+=`<line x1="${pos[k][0]+110}" y1="${pos[k][1]+16}" x2="${pos[t][0]}" y2="${pos[t][1]+16}" stroke="#e8a54b" stroke-opacity=".6" marker-end="url(#ar)"/>`}));
 Object.keys(E.nodes).forEach(k=>h+=`<g data-id="${esc(k)}" style="cursor:pointer"><rect x="${pos[k][0]}" y="${pos[k][1]}" width="110" height="32" rx="6" fill="${C[E.nodes[k].t]||'#333'}" stroke="${k===esel?'#e8a54b':'#556'}" stroke-width="${k===esel?2:1}"/><text x="${pos[k][0]+6}" y="${pos[k][1]+20}" fill="#e9e4d8" font-size="12">${esc(k.slice(0,15))}</text></g>`);
 const sv_=$('#eg');sv_.setAttribute('viewBox',`0 0 ${W+10} ${H+10}`);sv_.setAttribute('width',W+10);sv_.setAttribute('height',H+10);sv_.innerHTML=h}
function check(){const r=[],N=E.nodes,s=$('#es').value.trim();if(!N[s])r.push('Стартовый узел «'+s+'» не существует');const seen=new Set(),q=N[s]?[s]:[];
 while(q.length){const k=q.pop();if(seen.has(k))continue;seen.add(k);edges(N[k]).forEach(t=>N[t]&&q.push(t))}
 let ends=0;for(const k in N){const n=N[k];if(n.t==='end')ends++;if(n.t==='wait'&&!n.obj)r.push(k+': у wait нет объекта');if(n.t==='choice'&&!(n.choices||[]).length)r.push(k+': у choice нет выборов');
  if(n.t!=='end'&&!n.next&&!(n.choices||[]).length)r.push(k+': нет перехода');
  edges(n).forEach(t=>{if(!N[t])r.push(k+': переход на несуществующий «'+t+'»')});if(N[s]&&!seen.has(k))r.push(k+': недостижим из старта')}
 if(!ends)r.push('В истории нет ни одной концовки');return r}

let U=[],Rd=[];const sn=v=>Math.round(v/grid)*grid;
const snap=()=>{U.push(JSON.stringify(layout));if(U.length>60)U.shift();Rd.length=0};
const undo=()=>{if(!U.length)return;Rd.push(JSON.stringify(layout));layout=JSON.parse(U.pop());sel=null;rebuild()};
const redo=()=>{if(!Rd.length)return;U.push(JSON.stringify(layout));layout=JSON.parse(Rd.pop());sel=null;rebuild()};
const clampIt=it=>{it.x=cl(it.x,-5.6,5.6);it.z=cl(it.z,-4.6,4.6)};
function rot(){if(sel==null)return;snap();layout[sel].r=(layout[sel].r+1)&3;rebuild()}

function bpick(e){V.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);RC.setFromCamera(V,cam);
 const objs=furn.children.filter(g=>sel==null||layout[g.userData.i].t!=='rug'),h=RC.intersectObjects(objs,true)[0];
 if(h){let o=h.object;while(o.parent!==furn)o=o.parent;sel=o.userData.i;$('#bCol').value=layout[sel].c;updSel();return}
 const pt=new THREE.Vector3();if(sel!=null&&RC.ray.intersectPlane(PL,pt)){snap();const it=layout[sel];it.x=sn(pt.x);it.z=sn(pt.z);clampIt(it);rebuild()}else{sel=null;updSel()}}

rs();setBr();rebuild();pnl('menu');refreshMenu();tick();
