<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Forest Survival</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1c10; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; touch-action: none; overscroll-behavior: none; }

/* ============ МЕНЮ ============ */
#menu { position: fixed; inset: 0; background: radial-gradient(circle at 70% 30%, #122a18 0%, #050a06 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; text-align: center; transition: opacity 0.6s; }
#menu h1 { font-size: 64px; color: #c6ff00; text-shadow: 0 0 40px #4caf50, 0 0 15px #fff; margin-bottom: 10px; letter-spacing: 4px; font-weight: 900; }
#menu .tag { color: #c6ff00; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; font-weight: 700; }
#menu p { color: #8ba88e; margin-bottom: 30px; font-size: 15px; max-width: 500px; }
.btn { background: #c6ff00; color: #000; font-size: 18px; font-weight: 800; padding: 16px 44px; border: none; border-radius: 10px; cursor: pointer; margin: 6px; text-transform: uppercase; letter-spacing: 2px; transition: 0.2s; box-shadow: 0 0 20px rgba(198,255,0,0.3); }
.btn:hover { background: #d4ff33; transform: translateY(-3px); box-shadow: 0 0 30px rgba(198,255,0,0.6); }
.btn2 { background: transparent; color: #fff; border: 2px solid #c6ff00; }
.btn2:hover { background: rgba(198,255,0,0.1); }

/* ============ ВЫБОР ПЕРСОНАЖА ============ */
#charsel { position: fixed; inset: 0; background: radial-gradient(circle at center, #122a18 0%, #050a06 100%); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 101; padding: 20px; }
#charsel h2 { font-size: 32px; color: #c6ff00; margin-bottom: 30px; letter-spacing: 3px; text-transform: uppercase; }
.chars { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
.char-card { background: rgba(18,40,25,0.7); border: 2px solid rgba(198,255,0,0.2); border-radius: 16px; padding: 20px; cursor: pointer; transition: 0.2s; width: 180px; text-align: center; backdrop-filter: blur(10px); }
.char-card:hover { border-color: #c6ff00; transform: translateY(-5px); box-shadow: 0 10px 30px rgba(198,255,0,0.3); }
.char-card canvas { display: block; margin: 0 auto 10px; }
.char-card .name { color: #c6ff00; font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: 1px; }
.char-card .desc { color: #8ba88e; font-size: 11px; margin-top: 5px; }

/* ============ ИГРА ============ */
#game { display: none; position: relative; width: 100vw; height: 100vh; }
canvas#cv { display: block; position: absolute; top: 0; left: 0; }
#ui { position: absolute; top: 15px; left: 15px; background: rgba(10,20,15,0.7); padding: 12px 14px; border-radius: 12px; font-size: 12px; pointer-events: none; backdrop-filter: blur(10px); border: 1px solid rgba(198,255,0,0.15); }
#ui div { margin-bottom: 7px; font-weight: 700; }
.bar { width: 170px; height: 11px; background: #000; border-radius: 6px; overflow: hidden; margin-top: 3px; border: 1px solid rgba(255,255,255,0.1); }
.bar-inner { height: 100%; width: 100%; transition: width 0.2s; border-radius: 6px; }
#hp { background: linear-gradient(90deg,#b71c1c,#ef5350); }
#en { background: linear-gradient(90deg,#f57f17,#ffee58); }
#hg { background: linear-gradient(90deg,#4e342e,#a1887f); }
#info { position: absolute; top: 15px; right: 15px; background: rgba(10,20,15,0.7); padding: 10px 18px; border-radius: 12px; font-size: 13px; color: #c6ff00; font-weight: 700; pointer-events: none; backdrop-filter: blur(10px); border: 1px solid rgba(198,255,0,0.15); }
#hint { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 10px 24px; border-radius: 24px; color: #c6ff00; font-size: 13px; display: none; font-weight: 700; border: 1px solid #c6ff00; backdrop-filter: blur(10px); }
#btns { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 7px; background: rgba(10,20,15,0.75); padding: 9px; border-radius: 14px; backdrop-filter: blur(10px); border: 1px solid rgba(198,255,0,0.15); }
.slot { width: 52px; height: 52px; background: rgba(0,0,0,0.4); border: 2px solid #4caf50; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 23px; cursor: pointer; position: relative; transition: 0.15s; }
.slot:hover { background: rgba(198,255,0,0.1); }
.slot.active { border-color: #c6ff00; box-shadow: 0 0 18px rgba(198,255,0,0.5); background: rgba(198,255,0,0.1); transform: translateY(-3px); }
.slot span { position: absolute; bottom: 0; right: 5px; font-size: 12px; color: #fff; font-weight: 800; text-shadow: 1px 1px 2px #000; }
#notif { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 5px; align-items: center; pointer-events: none; z-index: 20; }
.nf { background: rgba(10,20,15,0.9); padding: 10px 22px; border-radius: 22px; border: 1px solid #c6ff00; color: #fff; font-size: 13px; font-weight: 700; backdrop-filter: blur(10px); animation: fade 2.5s forwards; }
@keyframes fade { 0%{opacity:1} 70%{opacity:1} 100%{opacity:0; transform: translateY(-20px);} }
#night { position: absolute; inset: 0; pointer-events: none; background: transparent; z-index: 5; }
#err { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(200,0,0,0.92); color: #fff; padding: 20px; border-radius: 10px; font-size: 13px; max-width: 90vw; display: none; z-index: 200; font-family: monospace; word-break: break-all; }
#mobile { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#joy { position: absolute; bottom: 30px; left: 30px; width: 140px; height: 140px; border-radius: 50%; background: rgba(198,255,0,0.1); border: 2px solid rgba(198,255,0,0.35); pointer-events: auto; }
#knob { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: rgba(198,255,0,0.55); border: 2px solid #c6ff00; transition: transform 0.05s; }
#actions { position: absolute; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }
.abtn { width: 74px; height: 74px; border-radius: 50%; background: rgba(10,20,15,0.7); border: 2px solid #c6ff00; color: #fff; font-size: 28px; display: flex; justify-content: center; align-items: center; cursor: pointer; user-select: none; backdrop-filter: blur(10px); }
.abtn:active { background: rgba(198,255,0,0.3); transform: scale(0.9); }
@media (max-width: 600px) {
  #menu h1 { font-size: 42px; }
  .char-card { width: 130px; padding: 12px; }
  .slot { width: 42px; height: 42px; font-size: 18px; }
  #ui { font-size: 10px; padding: 8px; }
  .bar { width: 120px; height: 9px; }
}
</style>
</head>
<body>

<!-- МЕНЮ -->
<div id="menu">
  <span class="tag">● Новая эра выживания · Сезон 01</span>
  <h1>FOREST SURVIVAL</h1>
  <p>Выживай, собирай ресурсы, строй базу, качайся. Выбери персонажа и стань легендой леса.</p>
  <div>
    <button class="btn" onclick="showCharSelect()">▶ НАЧАТЬ ИГРУ</button>
  </div>
  <div style="margin-top:15px;">
    <button class="btn btn2" onclick="if(confirm('Сбросить?')){try{localStorage.clear()}catch(e){}location.reload();}" style="font-size:13px;padding:10px 22px;">🗑️ СБРОС</button>
  </div>
</div>

<!-- ВЫБОР ПЕРСОНАЖА -->
<div id="charsel">
  <h2>Выбери персонажа</h2>
  <div class="chars" id="chars-list"></div>
</div>

<!-- ИГРА -->
<div id="game">
  <canvas id="cv"></canvas>

  <div id="ui">
    <div>❤️ HP<div class="bar"><div class="bar-inner" id="hp"></div></div></div>
    <div>⚡ Энергия<div class="bar"><div class="bar-inner" id="en"></div></div></div>
    <div>🍖 Сытость<div class="bar"><div class="bar-inner" id="hg"></div></div></div>
  </div>

  <div id="info">☀️ День 1, 06:00</div>
  <div id="hint">Нажми E</div>

  <div id="btns">
    <div class="slot active" onclick="selSlot(0,this)" title="Рука">✋</div>
    <div class="slot" onclick="selSlot(1,this)" title="Дерево">🪵<span id="c1">0</span></div>
    <div class="slot" onclick="selSlot(2,this)" title="Камень">🪨<span id="c2">0</span></div>
    <div class="slot" onclick="selSlot(3,this)" title="Ягода (Е - съесть)">🍓<span id="c3">0</span></div>
    <div class="slot" onclick="selSlot(4,this)" title="Бита">🏏<span id="c4">0</span></div>
    <div class="slot" onclick="selSlot(5,this)" title="Костёр">🔥<span id="c5">0</span></div>
    <div class="slot" onclick="selSlot(6,this)" title="Стена">🧱<span id="c6">0</span></div>
  </div>

  <div id="notif"></div>
  <div id="night"></div>
  <div id="err"></div>

  <div id="mobile">
    <div id="joy"><div id="knob"></div></div>
    <div id="actions">
      <div class="abtn" id="ab1">✋</div>
      <div class="abtn" id="ab2">⚔️</div>
      <div class="abtn" id="ab3">🏃</div>
    </div>
  </div>
</div>

<script>
// ============================================================
// БЕЗОПАСНЫЙ LOCALSTORAGE (для песочницы)
// ============================================================
function storageGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function storageSet(k,v){ try{localStorage.setItem(k,v);return true;}catch(e){return false;} }

// ============================================================
// ГЛОБАЛЬНЫЕ
// ============================================================
var canvas, ctx, W=800, H=600;
var gameOn = false;
var mobile = false;
var keys = {};
var world = { trees:[], stones:[], berries:[], lakes:[], flowers:[], bushes:[], walls:[], fires:[], mobs:[], drops:[] };
var cam = { x:0, y:0 };
var time = 0.25;         // 0..1 (0=полночь, 0.5=полдень)
var day = 1;
var slot = 0;
var selectedChar = 'boy'; // boy, ninja, cowboy, girl
var joyX=0, joyY=0, joyActive=false, touchStartX=0, touchStartY=0, touchId=null;
var mouseWorldX=0, mouseWorldY=0;
var lastT = 0;
var cullDist = 800;       // рисовать только в радиусе 800px от камеры

var p = {
  x:0, y:0, vx:0, vy:0, r:16,
  hp:100, maxhp:100,
  en:100, maxen:100,
  hg:100, maxhg:100,
  wood:0, stone:0, berry:0, fire:0, wall:0, bat:0,
  face:1, anim:0, atkCd:0, batSwing:0, eatCd:0
};

// ============================================================
// ОШИБКИ
// ============================================================
function showErr(m){
  console.error(m);
  var e=document.getElementById('err');
  if(e){e.style.display='block';e.textContent='ОШИБКА: '+m;}
}
window.onerror = function(m,u,l){ showErr(m+' (строка '+l+')'); return false; };

// ============================================================
// ВЫБОР ПЕРСОНАЖА
// ============================================================
var CHAR_LIST = [
  { id:'boy',    name:'Мальчик', desc:'С битой, сильные удары' },
  { id:'ninja',  name:'Ниндзя',  desc:'Быстрый, ловкий' },
  { id:'cowboy', name:'Ковбой',  desc:'Стрелок, дальний бой' },
  { id:'girl',   name:'Девочка', desc:'Умная, быстрая' }
];

function showCharSelect(){
  document.getElementById('menu').style.opacity = '0';
  setTimeout(function(){
    document.getElementById('menu').style.display = 'none';
    document.getElementById('charsel').style.display = 'flex';
    buildCharList();
  }, 400);
}

function buildCharList(){
  var list = document.getElementById('chars-list');
  list.innerHTML = '';
  CHAR_LIST.forEach(function(c){
    var card = document.createElement('div');
    card.className = 'char-card';
    var cv = document.createElement('canvas');
    cv.width = 100; cv.height = 100;
    card.appendChild(cv);
    var nm = document.createElement('div'); nm.className='name'; nm.textContent=c.name;
    var ds = document.createElement('div'); ds.className='desc'; ds.textContent=c.desc;
    card.appendChild(nm); card.appendChild(ds);
    card.onclick = function(){ startGame(c.id, false); };
    list.appendChild(card);
    drawCharPreview(cv, c.id);
  });
  // На мобильном добавляем кнопку телефона
  if (/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)) {
    var hint = document.createElement('div');
    hint.style.color = '#8ba88e';
    hint.style.marginTop = '20px';
    hint.style.fontSize = '12px';
    hint.textContent = 'На телефоне появится джойстик автоматически';
    list.parentElement.appendChild(hint);
  }
}

// Рисуем персонажа в маленькое превью
function drawCharPreview(cv, id){
  var c = cv.getContext('2d');
  c.clearRect(0,0,100,100);
  c.save();
  c.translate(50, 80);
  drawCharacter(c, id, 0, 1, 0, 0);
  c.restore();
}

// ============================================================
// СТАРТ
// ============================================================
function startGame(charId, isMobile){
  selectedChar = charId || 'boy';
  mobile = isMobile || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);

  try {
    canvas = document.getElementById('cv');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function(){ setTimeout(resize, 100); });

    document.getElementById('charsel').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    if (mobile) document.getElementById('mobile').style.display = 'block';

    generateWorld();
    loadSave();
    updateUI();
    setupInput();
    if (mobile) setupTouch();

    gameOn = true;
    requestAnimationFrame(loop);
  } catch(e){ showErr(e.message); }
}

function resize(){
  if(!canvas) return;
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

// ============================================================
// МИР
// ============================================================
function generateWorld(){
  world = { trees:[], stones:[], berries:[], lakes:[], flowers:[], bushes:[], walls:[], fires:[], mobs:[], drops:[] };
  p.x = 0; p.y = 0; p.vx = 0; p.vy = 0;

  var i,x,y,d,n;

  // Деревья
  for (i=0;i<180;i++){
    x=(Math.random()-0.5)*4000; y=(Math.random()-0.5)*4000;
    if (Math.sqrt(x*x+y*y)<120) continue;
    world.trees.push({x:x,y:y,r:30,got:false,hue:Math.random()*30-15});
  }
  // Камни
  for (i=0;i<80;i++){
    x=(Math.random()-0.5)*4000; y=(Math.random()-0.5)*4000;
    if (Math.sqrt(x*x+y*y)<120) continue;
    world.stones.push({x:x,y:y,r:22,got:false});
  }
  // Ягоды
  for (i=0;i<70;i++){
    x=(Math.random()-0.5)*4000; y=(Math.random()-0.5)*4000;
    if (Math.sqrt(x*x+y*y)<120) continue;
    world.berries.push({x:x,y:y,r:12,got:false});
  }
  // Озёра
  for (i=0;i<4;i++){
    x=(Math.random()-0.5)*3000; y=(Math.random()-0.5)*3000;
    if (Math.sqrt(x*x+y*y)<400) continue;
    world.lakes.push({x:x,y:y,r:90+Math.random()*80});
  }
  // Цветы (декор)
  for (i=0;i<300;i++){
    x=(Math.random()-0.5)*4500; y=(Math.random()-0.5)*4500;
    world.flowers.push({x:x,y:y,r:5,c:Math.random()<0.5?'#ffeb3b':'#ef5350', phase: Math.random()*6.28});
  }
  // Кусты (декор)
  for (i=0;i<120;i++){
    x=(Math.random()-0.5)*4500; y=(Math.random()-0.5)*4500;
    world.bushes.push({x:x,y:y,r:15});
  }
  // Мобы
  for (i=0;i<18;i++){
    x=(Math.random()-0.5)*3000; y=(Math.random()-0.5)*3000;
    d = Math.sqrt(x*x+y*y);
    if (d<400) continue;
    var isWolf = Math.random()<0.35;
    world.mobs.push({
      x:x, y:y, type: isWolf?'wolf':'rabbit',
      r: isWolf?16:11,
      hp: isWolf?35:12, maxhp: isWolf?35:12,
      vx:0, vy:0, cd:0, timer: 0, anim: 0,
      face: 1,
      speed: isWolf?0.35:0.22    // ← зайцы замедлены (было 0.35)
    });
  }
}

// ============================================================
// СОХРАНЕНИЕ
// ============================================================
function saveGame(){
  var d = {
    px:p.x, py:p.y, hp:p.hp, en:p.en, hg:p.hg,
    wood:p.wood, stone:p.stone, berry:p.berry, fire:p.fire, wall:p.wall, bat:p.bat,
    day:day, time:time, ch:selectedChar,
    walls:world.walls, fires:world.fires
  };
  if (storageSet('fs_v3', JSON.stringify(d))) showNotif('💾 Сохранено');
}

function loadSave(){
  var s = storageGet('fs_v3');
  if (!s) return;
  try {
    var d = JSON.parse(s);
    if (typeof d.px !== 'number' || isNaN(d.px)) return;
    p.x=d.px; p.y=d.py;
    p.hp=d.hp||100; p.en=d.en||100; p.hg=d.hg||100;
    p.wood=d.wood||0; p.stone=d.stone||0; p.berry=d.berry||0;
    p.fire=d.fire||0; p.wall=d.wall||0; p.bat=d.bat||0;
    day=d.day||1; time=d.time||0.25;
    if (d.ch) selectedChar = d.ch;
    if (Array.isArray(d.walls)) world.walls = d.walls;
    if (Array.isArray(d.fires)) world.fires = d.fires;
    showNotif('Прогресс загружен');
  } catch(e){}
}

// ============================================================
// ВВОД
// ============================================================
function setupInput(){
  window.addEventListener('keydown', function(e){
    var k = e.key.toLowerCase();
    keys[k] = true;
    if (k==='e' || k==='у') interact();
    if (e.key===' ') { e.preventDefault(); attack(); }
    if (k==='q' || k==='й') eatBerry();   // ← Q - съесть ягоду
    if (k==='f' || k==='а') saveGame();
    if (e.key>='1' && e.key<='7') {
      var s = document.querySelectorAll('.slot');
      selSlot(parseInt(e.key)-1, s[parseInt(e.key)-1]);
    }
  });
  window.addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

  canvas.addEventListener('mousemove', function(e){
    mouseWorldX = e.clientX + cam.x;
    mouseWorldY = e.clientY + cam.y;
  });
  canvas.addEventListener('mousedown', function(e){
    if (e.button===0) placeObject(e.clientX+cam.x, e.clientY+cam.y);
  });
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
}

function selSlot(i, el){
  slot = i;
  var s = document.querySelectorAll('.slot');
  for (var k=0;k<s.length;k++) s[k].classList.remove('active');
  if (el) el.classList.add('active');
}

function setupTouch(){
  var joy = document.getElementById('joy');
  if (!joy) return;
  var knob = document.getElementById('knob');

  joy.addEventListener('touchstart', function(e){
    e.preventDefault();
    var t = e.changedTouches[0];
    touchId = t.identifier;
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    joyActive = true;
  }, {passive:false});

  joy.addEventListener('touchmove', function(e){
    e.preventDefault();
    for (var i=0;i<e.changedTouches.length;i++){
      var t = e.changedTouches[i];
      if (t.identifier !== touchId) continue;
      var dx = t.clientX-touchStartX, dy = t.clientY-touchStartY;
      var d = Math.sqrt(dx*dx+dy*dy), max=55;
      if (d>max){dx=dx/d*max; dy=dy/d*max;}
      knob.style.transform = 'translate('+dx+'px,'+dy+'px)';
      joyX = dx/max; joyY = dy/max;
    }
  }, {passive:false});

  function endJoy(){ joyActive=false; joyX=0; joyY=0; knob.style.transform='translate(0,0)'; touchId=null; }
  joy.addEventListener('touchend', endJoy);
  joy.addEventListener('touchcancel', endJoy);

  document.getElementById('ab1').addEventListener('touchstart', function(e){e.preventDefault(); interact();});
  document.getElementById('ab2').addEventListener('touchstart', function(e){e.preventDefault(); attack();});
  document.getElementById('ab3').addEventListener('touchstart', function(e){e.preventDefault(); keys['shift']=true;});
  document.getElementById('ab3').addEventListener('touchend', function(e){e.preventDefault(); keys['shift']=false;});

  // Тап по экрану — поставить объект, если выбран слот 5 или 6
  canvas.addEventListener('touchstart', function(e){
    if (slot===5 || slot===6){
      var t = e.changedTouches[0];
      if (t) placeObject(t.clientX+cam.x, t.clientY+cam.y);
    }
  }, {passive:false});

  document.addEventListener('gesturestart', function(e){e.preventDefault();});
}

// ============================================================
// ДЕЙСТВИЯ
// ============================================================
function interact(){
  if (!gameOn) return;

  // Приоритет 1: подобрать дропы с земли
  for (var i=0;i<world.drops.length;i++){
    var dr = world.drops[i];
    var dd = Math.sqrt((p.x-dr.x)*(p.x-dr.x)+(p.y-dr.y)*(p.y-dr.y));
    if (dd < p.r + 25){
      if (dr.type==='wood') p.wood += dr.amount;
      if (dr.type==='stone') p.stone += dr.amount;
      if (dr.type==='berry') p.berry += dr.amount;
      showNotif('+'+dr.amount+' '+dr.icon);
      world.drops.splice(i,1);
      updateUI();
      return;
    }
  }

  // Приоритет 2: собрать ресурс
  var objs = [];
  for (var i=0;i<world.trees.length;i++)  objs.push({o:world.trees[i],   t:'tree'});
  for (var i=0;i<world.stones.length;i++) objs.push({o:world.stones[i],  t:'stone'});
  for (var i=0;i<world.berries.length;i++)objs.push({o:world.berries[i], t:'berry'});

  for (var i=0;i<objs.length;i++){
    var o = objs[i].o;
    if (o.got) continue;
    var d = Math.sqrt((p.x-o.x)*(p.x-o.x)+(p.y-o.y)*(p.y-o.y));
    if (d < p.r + o.r + 30){
      o.got = true;
      if (objs[i].t==='tree'){
        p.wood += 2; showNotif('+2 🪵');
        spawnDrop(o.x,o.y,'wood',2,'🪵');
      } else if (objs[i].t==='stone'){
        p.stone += 2; showNotif('+2 🪨');
        spawnDrop(o.x,o.y,'stone',2,'🪨');
      } else {
        p.berry += 1; showNotif('+1 🍓 (Q - съесть)');
        spawnDrop(o.x,o.y,'berry',1,'🍓');
      }
      updateUI();
      return;
    }
  }
  showNotif('Нечего собирать рядом');
}

function spawnDrop(x,y,type,amount,icon){
  world.drops.push({ x:x+Math.random()*20-10, y:y+Math.random()*20-10, type:type, amount:amount, icon:icon, life: 30000 });
}

function eatBerry(){
  if (p.berry <= 0) { showNotif('Нет ягод'); return; }
  if (p.eatCd > 0) return;
  p.berry -= 1;
  p.hp = Math.min(p.maxhp, p.hp + 20);
  p.hg = Math.min(p.maxhg, p.hg + 25);
  p.eatCd = 30;
  spawnNotifParticles(p.x, p.y, '#ef5350');
  showNotif('+20 HP, +25 сытости');
  updateUI();
}

function spawnNotifParticles(x,y,color){
  for (var i=0;i<12;i++){
    world.particles = world.particles || [];
    world.particles.push({
      x:x, y:y, vx:(Math.random()-0.5)*3, vy:-Math.random()*3-1,
      life:30, max:30, color:color, size: Math.random()*3+2
    });
  }
}

function attack(){
  if (!gameOn || p.atkCd > 0) return;
  p.atkCd = 22;
  p.batSwing = 1;

  var hit = false;
  for (var i=0;i<world.mobs.length;i++){
    var m = world.mobs[i];
    if (m.hp <= 0) continue;
    var d = Math.sqrt((p.x-m.x)*(p.x-m.x)+(p.y-m.y)*(p.y-m.y));
    if (d < p.r + m.r + 38){
      var dmg = 12 + Math.random()*6;
      if (selectedChar==='ninja') dmg *= 1.3;   // Ниндзя — сильнее
      if (selectedChar==='cowboy') dmg *= 1.2;
      m.hp -= dmg;
      hit = true;
      spawnNotifParticles(m.x, m.y, '#ef5350');
      spawnDamage(m.x, m.y-20, '-'+Math.floor(dmg));
      if (m.hp <= 0){
        p.hg = Math.min(p.maxhg, p.hg + (m.type==='wolf'?15:8));
        showNotif(m.type==='wolf'?'Волк побеждён! +15🍖':'Заяц! +8🍖');
      }
    }
  }
  if (hit) playBeep();
}

var audioCtx = null;
function playBeep(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.setValueAtTime(220, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime+0.1);
    g.gain.setValueAtTime(0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.12);
    o.start(); o.stop(audioCtx.currentTime+0.12);
  } catch(e){}
}

// ============================================================
// ЛОГИКА
// ============================================================
function update(dt){
  if (!gameOn) return;

  // Ввод
  var ax=0, ay=0;
  if (keys['w']||keys['ц']||keys['arrowup'])    ay -= 1;
  if (keys['s']||keys['ы']||keys['arrowdown'])  ay += 1;
  if (keys['a']||keys['ф']||keys['arrowleft'])  ax -= 1;
  if (keys['d']||keys['в']||keys['arrowright']) ax += 1;
  if (mobile && joyActive){ ax = joyX; ay = joyY; }

  var len = Math.sqrt(ax*ax+ay*ay);
  if (len > 1){ ax /= len; ay /= len; }

  var sprint = keys['shift'] && p.en > 0;
  var baseSpeed = 0.28;
  if (selectedChar==='ninja') baseSpeed = 0.35;
  if (selectedChar==='girl')  baseSpeed = 0.33;
  if (selectedChar==='cowboy') baseSpeed = 0.26;

  var spd = sprint ? baseSpeed*1.7 : baseSpeed;

  // ЭНЕРГИЯ: бег тратит БЫСТРО, восстанавливается МЕДЛЕННО
  if (sprint){
    p.en -= 0.9;                        // было 0.3
    if (p.en < 0) p.en = 0;
  } else if (p.en < p.maxen){
    p.en += 0.08;                       // медленное восстановление
  }

  p.vx += ax * spd;
  p.vy += ay * spd;
  p.vx *= 0.85;
  p.vy *= 0.85;
  p.x += p.vx * dt;
  p.y += p.vy * dt;

  if (p.vx > 0.05) p.face = 1;
  else if (p.vx < -0.05) p.face = -1;

  if (Math.abs(p.vx)>0.05 || Math.abs(p.vy)>0.05) p.anim += 0.22*dt;
  else p.anim = 0;

  if (p.atkCd > 0) p.atkCd -= dt;
  if (p.eatCd > 0) p.eatCd -= dt;
  if (p.batSwing > 0) p.batSwing -= 0.1*dt;

  // === Коллизии через квадраты расстояний (быстрее) ===
  checkCollisions(world.trees);
  checkCollisions(world.stones);
  checkCollisions(world.walls);
  checkLakes();

  // === Мобы ===
  for (var i=0;i<world.mobs.length;i++){
    var m = world.mobs[i];
    if (m.hp <= 0) continue;
    var dx = p.x-m.x, dy = p.y-m.y;
    var md2 = dx*dx+dy*dy;
    if (md2 > 250000) continue;   // 500px

    var md = Math.sqrt(md2);

    if (m.type==='wolf' && md < 220){
      m.vx += (dx/md)*0.12;
      m.vy += (dy/md)*0.12;
      if (md < p.r+m.r+5 && m.cd <= 0){
        p.hp -= 6; m.cd = 60; showNotif('-6 HP');
      }
    } else if (m.type==='rabbit' && md < 120){
      // Заяц убегает, но медленнее чем игрок — можно догнать!
      m.vx -= (dx/md)*0.12;
      m.vy -= (dy/md)*0.12;
    } else {
      m.timer -= dt;
      if (m.timer <= 0){
        m.timer = 120+Math.random()*180;
        m.vx = (Math.random()-0.5)*m.speed;
        m.vy = (Math.random()-0.5)*m.speed;
      }
    }
    if (m.cd > 0) m.cd -= dt;
    m.vx *= 0.9; m.vy *= 0.9;
    m.x += m.vx * dt;
    m.y += m.vy * dt;
    if (Math.abs(m.vx)>0.02) m.face = m.vx>0?1:-1;
    m.anim += 0.15*dt;
  }

  // Удаление мёртвых мобов (оптимизация)
  world.mobs = world.mobs.filter(function(m){ return m.hp > 0; });

  // === Голод ===
  p.hg -= 0.008 * dt;
  if (p.hg <= 0){ p.hg=0; p.hp -= 0.04*dt; }
  if (p.hp <= 0){
    p.hp = 0; gameOn = false;
    showErr('Вы погибли! Обновите страницу.');
    return;
  }

  // === Камера ===
  cam.x += (p.x - W/2 - cam.x) * 0.12;
  cam.y += (p.y - H/2 - cam.y) * 0.12;

  // === Частицы ===
  if (world.particles){
    for (var i=world.particles.length-1;i>=0;i--){
      var pt = world.particles[i];
      pt.x += pt.vx*dt; pt.y += pt.vy*dt;
      pt.vy += 0.15*dt;
      pt.life -= dt;
      if (pt.life <= 0) world.particles.splice(i,1);
    }
  }

  // Тексты урона
  for (var i=damageTexts.length-1;i>=0;i--){
    damageTexts[i].y -= 0.6*dt;
    damageTexts[i].life -= dt;
    if (damageTexts[i].life <= 0) damageTexts.splice(i,1);
  }

  // Дропы на земле — удаление по времени
  for (var i=world.drops.length-1;i>=0;i--){
    world.drops[i].life -= dt*16.6;
    if (world.drops[i].life <= 0) world.drops.splice(i,1);
  }

  // === Время суток — ЗАМЕДЛЕНО в 5 раз ===
  time += 0.00002 * dt;   // было 0.0001
  if (time > 1){ time = 0; day++; }
  var dark = Math.sin(time * Math.PI * 2) * 0.5 + 0.5;
  document.getElementById('night').style.background = 'rgba(0,0,30,'+(dark*0.55)+')';

  var hours = Math.floor(time*24);
  var mins = Math.floor((time*24-hours)*60);
  var icon = (hours>=6 && hours<18) ? '☀️' : '🌙';
  document.getElementById('info').textContent = icon+' День '+day+', '+(hours<10?'0':'')+hours+':'+(mins<10?'0':'')+mins;

  // HUD
  document.getElementById('hp').style.width = (p.hp/p.maxhp*100)+'%';
  document.getElementById('en').style.width = (p.en/p.maxen*100)+'%';
  document.getElementById('hg').style.width = (p.hg/p.maxhg*100)+'%';

  // Подсказка
  var near = false;
  var arr = world.trees.concat(world.stones, world.berries);
  for (var i=0;i<arr.length;i++){
    var o = arr[i];
    if (o.got) continue;
    var dx = p.x-o.x, dy = p.y-o.y;
    if (dx*dx+dy*dy < (p.r+o.r+30)*(p.r+o.r+30)){ near = true; break; }
  }
  document.getElementById('hint').style.display = near ? 'block' : 'none';
  if (near) document.getElementById('hint').textContent = 'Нажми E чтобы собрать';
}

function checkCollisions(arr){
  for (var i=0;i<arr.length;i++){
    var s = arr[i];
    if (s.got) continue;
    var dx = p.x-s.x, dy = p.y-s.y;
    var minD = p.r + s.r;
    var d2 = dx*dx + dy*dy;
    if (d2 < minD*minD && d2 > 0.01){
      var d = Math.sqrt(d2);
      var ang = Math.atan2(dy, dx);
      p.x = s.x + Math.cos(ang)*minD;
      p.y = s.y + Math.sin(ang)*minD;
    }
  }
}

function checkLakes(){
  for (var i=0;i<world.lakes.length;i++){
    var l = world.lakes[i];
    var dx = p.x-l.x, dy = p.y-l.y;
    var r = l.r + p.r;
    var d2 = dx*dx+dy*dy;
    if (d2 < r*r){
      var d = Math.sqrt(d2);
      var ang = Math.atan2(dy, dx);
      p.x = l.x + Math.cos(ang)*r;
      p.y = l.y + Math.sin(ang)*r;
      p.vx *= 0.5; p.vy *= 0.5;
    }
  }
}

function drawCharacter(c, id, anim, face, batSwing, attackCooldown){
  var legSwing = Math.sin(anim*3)*8;
  var armSwing = Math.cos(anim*3)*8;
  if (anim === 0){ legSwing = 0; armSwing = 0; }
  var batAngle = face === 1 ? -0.3 : 0.3;
  if (batSwing > 0) batAngle = face === 1 ? -1.5 : 1.5;

  // Тень
  c.fillStyle = 'rgba(0,0,0,0.35)';
  c.beginPath(); c.ellipse(0, 20, 18, 7, 0, 0, Math.PI*2); c.fill();

  // === НОГИ ===
  if (id === 'girl'){
    c.strokeStyle = '#f5d6a8'; c.lineWidth = 6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-6,10); c.lineTo(-6+legSwing,22); c.stroke();
    c.beginPath(); c.moveTo(6,10); c.lineTo(6-legSwing,22); c.stroke();
    c.fillStyle = '#111';
    c.beginPath(); c.arc(-6+legSwing,23,4,0,Math.PI*2); c.fill();
    c.beginPath(); c.arc(6-legSwing,23,4,0,Math.PI*2); c.fill();
    // Голубые носочки
    c.fillStyle = '#64b5f6';
    c.fillRect(-8+legSwing,18,5,5);
    c.fillRect(4-legSwing,18,5,5);
  } else if (id === 'ninja' || id === 'cowboy'){
    var pantsColor = id==='ninja' ? '#111' : '#3e2723';
    var shoeColor  = id==='ninja' ? '#000' : '#b71c1c';
    c.strokeStyle = pantsColor; c.lineWidth = 7;
    c.beginPath(); c.moveTo(-6,10); c.lineTo(-6+legSwing,22); c.stroke();
    c.beginPath(); c.moveTo(6,10); c.lineTo(6-legSwing,22); c.stroke();
    c.fillStyle = shoeColor;
    c.beginPath(); c.arc(-6+legSwing,22,5,0,Math.PI*2); c.fill();
    c.beginPath(); c.arc(6-legSwing,22,5,0,Math.PI*2); c.fill();
  } else {
    // Мальчик
    c.strokeStyle = '#1565c0'; c.lineWidth = 7;
    c.beginPath(); c.moveTo(-6,10); c.lineTo(-6+legSwing,22); c.stroke();
    c.beginPath(); c.moveTo(6,10); c.lineTo(6-legSwing,22); c.stroke();

    c.fillStyle = '#1565c0';
    c.beginPath(); c.arc(-6+legSwing,22,3,0,Math.PI*2); c.fill();

    c.fillStyle = '#1565c0';

    c.fillRect(7,-3,7,12);

// ============================================================
function isVisible(x, y){
  return (x > cam.x - 100 && x < cam.x + W + 100 && y > cam.y - 100 && y < cam.y + H + 100);
}

function draw(){
  if (!gameOn) return;

  // Фон — трава
  ctx.fillStyle = '#3a5a3a';
  ctx.fillRect(0, 0, W, H);

  // Лёгкая текстура травы (только в видимой области)
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  var startX = Math.floor(cam.x/60)*60;
  var startY = Math.floor(cam.y/60)*60;
  for (var x = startX; x < cam.x+W+60; x += 60){
    for (var y = startY; y < cam.y+H+60; y += 60){
      if ((x/60 + y/60) % 2 === 0) ctx.fillRect(x, y, 60, 60);
    }
  }

  ctx.save();
  ctx.translate(-cam.x, -cam.y);

  var i;

  // Цветы (декор, оптимизировано: только видимые)
  for (i=0;i<world.flowers.length;i++){
    var fl = world.flowers[i];
    if (!isVisible(fl.x, fl.y)) continue;
    var sway = Math.sin(Date.now()*0.002 + fl.phase) * 1;
    ctx.fillStyle = fl.c;
    ctx.beginPath(); ctx.arc(fl.x+sway, fl.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(fl.x+sway, fl.y, 1.5, 0, Math.PI*2); ctx.fill();
  }

  // Кусты
  for (i=0;i<world.bushes.length;i++){
    var b = world.bushes[i];
    if (!isVisible(b.x, b.y)) continue;
    ctx.fillStyle = '#1b5e20';
    ctx.beginPath(); ctx.arc(b.x, b.y, 15, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath(); ctx.arc(b.x-4, b.y-4, 9, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x+5, b.y-2, 8, 0, Math.PI*2); ctx.fill();
  }

  // Озёра
  for (i=0;i<world.lakes.length;i++){
    var l = world.lakes[i];
    if (!isVisible(l.x, l.y)) continue;
    ctx.fillStyle = '#1e3b5e';
    ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, Math.PI*2); ctx.fill();
    // Блик
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.arc(l.x + Math.sin(Date.now()*0.001)*10, l.y + Math.cos(Date.now()*0.001)*10, l.r*0.7, 0, Math.PI*2);
    ctx.fill();
    // Берег
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(l.x, l.y, l.r, 0, Math.PI*2); ctx.stroke();
  }

  // Стены
  for (i=0;i<world.walls.length;i++){
    var w = world.walls[i];
    if (!isVisible(w.x, w.y)) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(w.x-25, w.y-15, 50, 50);
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(w.x-25, w.y-25, 50, 50);
    ctx.fillStyle = '#8d6e63';
    ctx.fillRect(w.x-20, w.y-20, 40, 40);
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x-20, w.y-20, 40, 40);
  }

  // Деревья
  for (i=0;i<world.trees.length;i++){
    var t = world.trees[i];
    if (t.got || !isVisible(t.x, t.y)) continue;
    var sway = Math.sin(Date.now()*0.002 + t.x)*3;
    // Тень
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(t.x, t.y+15, 22, 8, 0, 0, Math.PI*2); ctx.fill();
    // Ствол
    ctx.fillStyle = '#5d4037';
    ctx.beginPath(); ctx.arc(t.x, t.y, 12, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3e2723';
    ctx.beginPath(); ctx.arc(t.x, t.y, 8, 0, Math.PI*2); ctx.fill();
    // Крона
    ctx.fillStyle = '#2e7d32';
    ctx.beginPath(); ctx.arc(t.x+sway, t.y-20, 26, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4caf50';
    ctx.beginPath(); ctx.arc(t.x-12+sway, t.y-30, 16, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(t.x+12+sway, t.y-25, 16, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#66bb6a';
    ctx.beginPath(); ctx.arc(t.x+sway, t.y-35, 12, 0, Math.PI*2); ctx.fill();
  }

  // Камни
  for (i=0;i<world.stones.length;i++){
    var s = world.stones[i];
    if (s.got || !isVisible(s.x, s.y)) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(s.x, s.y+10, 22, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#616161';
    ctx.beginPath(); ctx.arc(s.x, s.y, 22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#9e9e9e';
    ctx.beginPath(); ctx.arc(s.x-5, s.y-5, 13, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#bdbdbd';
    ctx.beginPath(); ctx.arc(s.x-8, s.y-8, 6, 0, Math.PI*2); ctx.fill();
  }

  // Ягоды
  for (i=0;i<world.berries.length;i++){
    var b = world.berries[i];
    if (b.got || !isVisible(b.x, b.y)) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath(); ctx.ellipse(b.x, b.y+8, 12, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#c62828';
    ctx.beginPath(); ctx.arc(b.x, b.y, 7, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x+7, b.y-4, 5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(b.x-4, b.y+7, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e53935';
    ctx.beginPath(); ctx.arc(b.x-2, b.y-2, 3, 0, Math.PI*2); ctx.fill();
    // Листик
    ctx.fillStyle = '#4caf50';
    ctx.beginPath(); ctx.ellipse(b.x, b.y-9, 4, 2, -0.5, 0, Math.PI*2); ctx.fill();
  }

  // Костры (пульсирующее свечение)
  for (i=0;i<world.fires.length;i++){
    var f = world.fires[i];
    if (!isVisible(f.x, f.y)) continue;
    var pulse = 145 + Math.sin(Date.now()*0.008 + f.x)*15;
    var g = ctx.createRadialGradient(f.x, f.y, 10, f.x, f.y, pulse);
    g.addColorStop(0, 'rgba(255,150,0,0.55)');
    g.addColorStop(1, 'rgba(255,150,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(f.x, f.y, pulse, 0, Math.PI*2); ctx.fill();
    // Дрова
    ctx.fillStyle = '#5d4037';
    ctx.fillRect(f.x-14, f.y-3, 28, 6);
    ctx.fillStyle = '#8d6e63';
    ctx.beginPath(); ctx.arc(f.x, f.y, 12, 0, Math.PI*2); ctx.fill();
    // Пламя
    ctx.fillStyle = '#ff5722';
    ctx.beginPath(); ctx.arc(f.x, f.y-5, 9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffeb3b';
    ctx.beginPath(); ctx.arc(f.x, f.y-8, 5, 0, Math.PI*2); ctx.fill();
  }

  // Дропы на земле
  for (i=0;i<world.drops.length;i++){
    var dr = world.drops[i];
    if (!isVisible(dr.x, dr.y)) continue;
    var bob = Math.sin(Date.now()*0.005 + i)*3;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(dr.x, dr.y+8, 8, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.font = '18px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(dr.icon, dr.x, dr.y+bob);
  }

  // Мобы
  for (i=0;i<world.mobs.length;i++){
    var m = world.mobs[i];
    if (m.hp <= 0 || !isVisible(m.x, m.y)) continue;
    // Тень
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath(); ctx.ellipse(m.x, m.y+m.r*0.8, m.r*0.8, m.r*0.4, 0, 0, Math.PI*2); ctx.fill();

    if (m.type === 'rabbit'){
      // Заяц — тело
      ctx.fillStyle = '#e0dcd8';
      ctx.beginPath(); ctx.ellipse(m.x, m.y, m.r+2, m.r-1, 0, 0, Math.PI*2); ctx.fill();
      // Голова
      ctx.beginPath(); ctx.arc(m.x + (m.face>0?8:-8), m.y-4, 7, 0, Math.PI*2); ctx.fill();
      // Уши
      ctx.fillStyle = '#c4b8b0';
      ctx.beginPath();
      ctx.ellipse(m.x + (m.face>0?8:-8), m.y-13, 2.5, 8, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath();
      ctx.ellipse(m.x + (m.face>0?12:-12), m.y-12, 2.5, 8, -0.2, 0, Math.PI*2); ctx.fill();
      // Красная часть уха (как на картинке)
      ctx.fillStyle = '#ef5350';
      ctx.beginPath();
      ctx.ellipse(m.x + (m.face>0?12:-12), m.y-12, 1.2, 5, -0.2, 0, Math.PI*2); ctx.fill();
      // Глаз
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(m.x + (m.face>0?10:-10), m.y-5, 1.8, 0, Math.PI*2); ctx.fill();
      // Хвост
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(m.x-(m.face>0?10:-10), m.y+2, 4, 0, Math.PI*2); ctx.fill();
    } else {
      // Волк — тело
      ctx.fillStyle = '#8d6e63';
      ctx.beginPath(); ctx.ellipse(m.x, m.y, m.r+2, m.r-2, 0, 0, Math.PI*2); ctx.fill();
      // Светлое брюхо
      ctx.fillStyle = '#d7ccc8';
      ctx.beginPath(); ctx.ellipse(m.x, m.y+4, m.r-4, m.r-8, 0, 0, Math.PI*2); ctx.fill();
      // Голова
      ctx.fillStyle = '#6d4c41';
      ctx.beginPath(); ctx.arc(m.x + (m.face>0?10:-10), m.y-4, 8, 0, Math.PI*2); ctx.fill();
      // Уши
      ctx.fillStyle = '#4e342e';
      ctx.beginPath();
      ctx.moveTo(m.x + (m.face>0?6:-6), m.y-10);
      ctx.lineTo(m.x + (m.face>0?4:-4), m.y-20);
      ctx.lineTo(m.x + (m.face>0?12:-12), m.y-12);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(m.x + (m.face>0?14:-14), m.y-10);
      ctx.lineTo(m.x + (m.face>0?16:-16), m.y-19);
      ctx.lineTo(m.x + (m.face>0?20:-20), m.y-10);
      ctx.closePath(); ctx.fill();
      // Глаз
      ctx.fillStyle = '#f44336';
      ctx.beginPath(); ctx.arc(m.x + (m.face>0?13:-13), m.y-5, 2, 0, Math.PI*2); ctx.fill();
      // Нос
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(m.x + (m.face>0?17:-17), m.y-2, 1.8, 0, Math.PI*2); ctx.fill();
    }
  }

  // Частицы
  if (world.particles){
    for (i=0;i<world.particles.length;i++){
      var pt = world.particles[i];
      ctx.fillStyle = pt.color;
      ctx.globalAlpha = pt.life/pt.max;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Игрок
  ctx.save();
  ctx.translate(p.x, p.y);
  drawCharacter(ctx, selectedChar, p.anim, p.face, p.batSwing, p.atkCd);
  ctx.restore();

  // Тексты урона
  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'center';
  for (i=0;i<damageTexts.length;i++){
    var d = damageTexts[i];
    ctx.fillStyle = '#ff5252';
    ctx.globalAlpha = d.life/50;
    ctx.fillText(d.txt, d.x, d.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();
}

// ============================================================
// ЦИКЛ
// ============================================================
function loop(t){
  if (!gameOn) return;
  var dt = (t - lastT)/16.66;
  lastT = t;
  if (dt > 3) dt = 3;
  if (dt < 0.1) dt = 1;
  try {
    update(dt);
    draw();
  } catch(e){
    showErr(e.message);
    gameOn = false;
    return;
  }
  requestAnimationFrame(loop);
}

// Автосохранение
setInterval(function(){ if (gameOn) saveGame(); }, 30000);
</script>
