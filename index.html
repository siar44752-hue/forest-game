<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Симулятор Рыбалки и Рыбного Ларька</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; }
        #canvas-container { width: 100%; height: 100%; position: absolute; left: 0; top: 0; z-index: 1; }
        
        /* UI Overlay */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .interactive { pointer-events: auto; }

        /* HUD Top Bar */
        .top-hud { display: flex; gap: 15px; align-items: center; }
        .hud-card { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); padding: 10px 20px; border-radius: 14px; color: #fff; display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        
        /* Crosshair */
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; transform: translate(-50%, -50%); border: 2px solid rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; }
        #crosshair::after { content: ''; position: absolute; top: 3px; left: 3px; width: 4px; height: 4px; background: #fff; border-radius: 50%; }

        /* Dialog & Orders */
        #order-panel { position: absolute; top: 80px; right: 20px; width: 320px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 2px solid #3b82f6; border-radius: 16px; padding: 18px; color: white; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        #order-panel h3 { color: #60a5fa; margin-bottom: 8px; font-size: 18px; }
        #order-panel p { font-size: 14px; line-height: 1.4; color: #cbd5e1; }

        /* Prompt Action */
        #action-prompt { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.8); border: 1px solid #60a5fa; color: white; padding: 12px 24px; border-radius: 30px; font-weight: bold; font-size: 16px; display: none; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.8; } 50% { opacity: 1; } 100% { opacity: 0.8; } }

        /* Butchery & Scale Station Modal */
        #station-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 650px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 25px; color: white; display: none; box-shadow: 0 20px 50px rgba(0,0,0,0.7); pointer-events: auto; }
        .station-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-bottom: 15px; }
        .station-body { display: flex; flex-direction: column; gap: 15px; align-items: center; }
        #cutting-board-canvas { background: #331f19; border: 4px solid #5c3a21; border-radius: 12px; cursor: crosshair; }
        .btn { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4); }

        /* Mobile Controls */
        #joystick-container { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; display: none; pointer-events: auto; }
        #joystick-handle { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(59, 130, 246, 0.8); border-radius: 50%; }
        #mobile-action-btn { position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px; background: #2563eb; border-radius: 50%; display: none; pointer-events: auto; color: white; font-weight: bold; border: none; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); }

        /* Start Screen */
        #start-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(15, 23, 42, 0.95); z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; gap: 20px; }
        #start-overlay h1 { font-size: 36px; color: #60a5fa; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.min.js"></script>
</head>
<body>

    <div id="start-overlay">
        <h1>3D РЫБАЛКА & РЫБНЫЙ ЛАРЕК</h1>
        <p>Выберите устройство для управления:</p>
        <div style="display: flex; gap: 20px;">
            <button class="btn" onclick="startGame('pc')">💻 Компьютер (WASD + Мышь)</button>
            <button class="btn" onclick="startGame('mobile')">📱 Телефон (Джойстик)</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="top-hud">
            <div class="hud-card">💰 Монеты: <span id="money-display" style="color:#f59e0b;">100</span></div>
            <div class="hud-card">🕒 Время: <span id="time-display">09:00</span></div>
            <div class="hud-card">🐟 Садок: <span id="fish-count">0/5</span></div>
        </div>

        <div id="crosshair"></div>
        <div id="action-prompt">Нажмите [E] или Кнопку для взаимодействия</div>

        <div id="order-panel">
            <h3>Покупатель у Ларька</h3>
            <p id="order-text">Загрузка заказа...</p>
        </div>

        <!-- Мобильное управление -->
        <div id="joystick-container"><div id="joystick-handle"></div></div>
        <button id="mobile-action-btn">E</button>
    </div>

    <!-- Окно Разделки и Взвешивания -->
    <div id="station-ui">
        <div class="station-header">
            <h2>Разделочный Стол и Весы</h2>
            <button class="btn" style="background:#ef4444; padding:6px 12px;" onclick="closeStation()">X</button>
        </div>
        <div class="station-body">
            <p style="font-size:14px; color:#94a3b8;">Проведите мышью/пальцем поперек рыбы, чтобы нарезать ее на филе!</p>
            <canvas id="cutting-board-canvas" width="400" height="200"></canvas>
            <div style="display:flex; gap:20px; width:100%; justify-content:space-between; align-items:center;">
                <div>Вес: <span id="scale-weight" style="font-weight:bold; color:#10b981;">0.00</span> кг</div>
                <button class="btn" onclick="packAndServe()">Завернуть в пакет и Отдать</button>
            </div>
        </div>
    </div>

    <script>
        // Игровые Переменные
        let scene, camera, renderer;
        let controlType = 'pc';
        let money = 100, inventory = [], currentCustomerOrder = null;
        let isStationOpen = false;
        
        // Управление ПК (Клавиши W/A/S/D и Ц/Ф/Ы/В)
        const keys = { forward: false, backward: false, left: false, right: false };
        let yaw = 0, pitch = 0;
        const player = { pos: new THREE.Vector3(0, 1.7, 5), speed: 0.12 };

        // Инициализация игры
        function startGame(mode) {
            controlType = mode;
            document.getElementById('start-overlay').style.display = 'none';
            if (mode === 'mobile') {
                document.getElementById('joystick-container').style.display = 'block';
                document.getElementById('mobile-action-btn').style.display = 'block';
                setupTouchControls();
            } else {
                setupPointerLock();
            }
            init3D();
            setupEvents();
            animate();
            spawnCustomer();
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(player.pos);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Освещение (Солнце)
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(50, 80, 50);
            sun.castShadow = true;
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));

            // Море (Вода)
            const waterGeo = new THREE.PlaneGeometry(200, 200, 32, 32);
            const waterMat = new THREE.MeshPhongMaterial({ color: 0x006699, shininess: 80, transparent: true, opacity: 0.85 });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.y = 0;
            scene.add(water);

            // Остров / Окружение
            const islandGeo = new THREE.BoxGeometry(40, 2, 40);
            const islandMat = new THREE.MeshLambertMaterial({ color: 0x2e7d32 });
            const island = new THREE.Mesh(islandGeo, islandMat);
            island.position.set(0, -0.9, 0);
            scene.add(island);

            // Пирс
            const pierGeo = new THREE.BoxGeometry(6, 0.4, 15);
            const pierMat = new THREE.MeshLambertMaterial({ color: 0x5c3a21 });
            const pier = new THREE.Mesh(pierGeo, pierMat);
            pier.position.set(0, 0.2, -15);
            scene.add(pier);

            // Рыбный Ларек
            createStall();
        }

        function createStall() {
            const stallGroup = new THREE.Group();
            
            // Стойка
            const counter = new THREE.Mesh(new THREE.BoxGeometry(4, 1.2, 1.5), new THREE.MeshLambertMaterial({ color: 0x8b5a2b }));
            counter.position.set(5, 0.6, 0);
            stallGroup.add(counter);

            // Навес
            const roof = new THREE.Mesh(new THREE.BoxGeometry(4.5, 0.2, 2f), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
            roof.position.set(5, 2.5, 0);
            stallGroup.add(roof);

            scene.add(stallGroup);
        }

        // Управление клавиатурой (Поддержка RU/EN)
        function setupEvents() {
            window.addEventListener('keydown', (e) => {
                const code = e.code;
                const key = e.key.toLowerCase();
                if (code === 'KeyW' || key === 'ц') keys.forward = true;
                if (code === 'KeyS' || key === 'ы') keys.backward = true;
                if (code === 'KeyA' || key === 'ф') keys.left = true;
                if (code === 'KeyD' || key === 'в') keys.right = true;
                if (code === 'KeyE' || key === 'у') interact();
            });

            window.addEventListener('keyup', (e) => {
                const code = e.code;
                const key = e.key.toLowerCase();
                if (code === 'KeyW' || key === 'ц') keys.forward = false;
                if (code === 'KeyS' || key === 'ы') keys.backward = false;
                if (code === 'KeyA' || key === 'ф') keys.left = false;
                if (code === 'KeyD' || key === 'в') keys.right = false;
            });
        }

        function setupPointerLock() {
            document.body.addEventListener('click', () => {
                if (!isStationOpen) document.body.requestPointerLock();
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * 0.002;
                    pitch -= e.movementY * 0.002;
                    pitch = Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
                }
            });
        }

        function interact() {
            // Дистанция до Пирса (Рыбалка)
            if (player.pos.distanceTo(new THREE.Vector3(0, 1.7, -15)) < 4) {
                catchFish();
            }
            // Дистанция до Ларька (Разделка/Продажа)
            else if (player.pos.distanceTo(new THREE.Vector3(5, 1.7, 0)) < 3) {
                openStation();
            }
        }

        function catchFish() {
            if (inventory.length >= 5) {
                alert("Садок полон!");
                return;
            }
            const weight = (Math.random() * 2 + 0.5).toFixed(2);
            inventory.push({ type: 'Лосось', weight: parseFloat(weight) });
            document.getElementById('fish-count').innerText = `${inventory.length}/5`;
            alert(`Вы поймали Лосося весом ${weight} кг!`);
        }

        function spawnCustomer() {
            currentCustomerOrder = { weight: (Math.random() * 1.5 + 0.5).toFixed(2) };
            document.getElementById('order-panel').style.display = 'block';
            document.getElementById('order-text').innerText = `Здравствуйте! Мне нужно ${currentCustomerOrder.weight} кг свежего нарезанного филе лосося.`;
        }

        function openStation() {
            if (inventory.length === 0) {
                alert("У вас нет рыбы для разделки!");
                return;
            }
            isStationOpen = true;
            document.exitPointerLock();
            document.getElementById('station-ui').style.display = 'block';
            document.getElementById('scale-weight').innerText = inventory[0].weight;
            drawFishOnBoard();
        }

        function closeStation() {
            isStationOpen = false;
            document.getElementById('station-ui').style.display = 'none';
        }

        function drawFishOnBoard() {
            const canvas = document.getElementById('cutting-board-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Рисуем простую рыбу
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.ellipse(200, 100, 120, 45, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        function packAndServe() {
            if (!inventory.length) return;
            const fish = inventory.shift();
            money += Math.round(fish.weight * 120);
            document.getElementById('money-display').innerText = money;
            document.getElementById('fish-count').innerText = `${inventory.length}/5`;
            closeStation();
            alert("Заказ успешно выполнен! Вы получили деньги.");
            spawnCustomer();
        }

        function animate() {
            requestAnimationFrame(animate);

            // Поворот камеры
            camera.rotation.order = 'YXZ';
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            // Движение игрока относительно взгляда
            const dir = new THREE.Vector3();
            if (keys.forward) dir.z -= 1;
            if (keys.backward) dir.z += 1;
            if (keys.left) dir.x -= 1;
            if (keys.right) dir.x += 1;
            dir.normalize();
            dir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            player.pos.addScaledVector(dir, player.speed);
            camera.position.copy(player.pos);

            // Подсказка взаимодействий
            const prompt = document.getElementById('action-prompt');
            if (player.pos.distanceTo(new THREE.Vector3(0, 1.7, -15)) < 4) {
                prompt.style.display = 'block';
                prompt.innerText = "Нажмите [E] чтобы Ловить Рыбу";
            } else if (player.pos.distanceTo(new THREE.Vector3(5, 1.7, 0)) < 3) {
                prompt.style.display = 'block';
                prompt.innerText = "Нажмите [E] чтобы Разрезать & Продать";
            } else {
                prompt.style.display = 'none';
            }

            renderer.render(scene, camera);
        }

        function setupTouchControls() {
            // Простая привязка для мобильных
            document.getElementById('mobile-action-btn').addEventListener('click', interact);
        }
    </script>
</body>
</html>
