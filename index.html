<script>
'use strict';
const $=s=>document.querySelector(s),Rn=Math.random,rnd=a=>a[Rn()*a.length|0],cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let S=Object.assign({vol:.7,mute:false},store.get('nh_set',{}));
function toast(t,ms=3000){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms)}
function fatal(m){const f=$('#fatal');f.style.display='flex';f.textContent=m}
addEventListener('error',e=>toast('Ошибка: '+e.message,5000));
// ---------- звук ----------
let AC,MG,CIC;
function A(){if(AC){if(AC.state==='suspended')AC.resume();return AC}try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=S.mute?0:S.vol;MG.connect(AC.destination);amb()}catch(e){}return AC}
function nb(len){const b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function amb(){const n=AC.createBufferSource();n.buffer=nb(3);n.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=420;f.Q.value=.6;const g=AC.createGain();g.gain.value=.1;n.connect(f);f.connect(g);g.connect(MG);n.start();
 const lf=AC.createOscillator(),lg=AC.createGain();lf.frequency.value=.12;lg.gain.value=220;lf.connect(lg);lg.connect(f.frequency);lf.start();
 [55,55.8,82.4].forEach(fr=>{const o=AC.createOscillator(),og=AC.createGain(),lp=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=fr;lp.type='lowpass';lp.frequency.value=150;og.gain.value=.03;o.connect(lp);lp.connect(og);og.connect(MG);o.start()});
 const c=AC.createBufferSource();c.buffer=nb(2);c.loop=true;const cf=AC.createBiquadFilter();cf.type='bandpass';cf.frequency.value=6500;cf.Q.value=8;CIC=AC.createGain();CIC.gain.value=.03;const tr=AC.createOscillator(),tg=AC.createGain();tr.frequency.value=22;tg.gain.value=.03;tr.connect(tg);tg.connect(CIC.gain);tr.start();c.connect(cf);cf.connect(CIC);CIC.connect(MG);c.start()}
function T(f,d,type='sine',v=.2,f2){if(!A())return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=type;o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(MG);o.start(n);o.stop(n+d+.05)}
function Nz(d,fc,v=.3,ty='lowpass'){if(!A())return;const s=AC.createBufferSource();s.buffer=nb(d);const f=AC.createBiquadFilter();f.type=ty;f.frequency.value=fc;const g=AC.createGain(),n=AC.currentTime;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);s.connect(f);f.connect(g);g.connect(MG);s.start()}
const sfx={knock:n=>{for(let i=0;i<n;i++)setTimeout(()=>{T(110,.18,'sine',.5,55);Nz(.1,500,.3);Fx.swing(.5)},i*280)},creak:()=>T(90,.8,'sawtooth',.07,170),meow:()=>{T(600,.15,'triangle',.16,900);setTimeout(()=>T(900,.3,'triangle',.16,500),150)},
 beat:()=>{T(60,.12,'sine',.5);setTimeout(()=>T(50,.14,'sine',.4),170)},ding:()=>{T(880,.4,'sine',.18);setTimeout(()=>T(1320,.5,'sine',.14),90)},shot:()=>{Nz(.5,3000,.8);T(70,.4,'square',.35,30);Fx.swing(1.6)},
 click:()=>T(500,.05,'triangle',.12),stinger:()=>{T(45,2.6,'sawtooth',.18,40);T(47.5,2.6,'sawtooth',.12,42);T(300,1.6,'sine',.04,150)},voice:()=>{for(let i=0;i<6;i++)setTimeout(()=>T(110+Math.random()*80,.07,'square',.035),i*85)},stat:()=>Nz(.7,2500,.12,'bandpass'),step:()=>T(70,.08,'sine',.12)};
function applyVol(){if(MG)MG.gain.value=S.mute?0:S.vol;$('#bMute').textContent=S.mute?'🔇':'🔊';store.set('nh_set',S)}
// ---------- данные ----------
const NAMES=['Марк','Лена','Игорь','Соня','Павел','Оля','Тимур','Вера','Глеб','Нина','Артём','Мила'],ROLES=['сосед','учительница','дальнобойщик','студентка','пожарный','врач','пенсионер','курьер'];
const SK=[0xe6c4a4,0xc99a76,0x8d5a3a,0xf0d4b8],CLO=[0x4a6a8a,0x7a3a3a,0x3a6a4a,0x8a7a4a,0x5a4a7a,0x6a6a6a],HAIR=[0x2a1a10,0x6a4a20,0xc8b070,0x1a1a1a,0xcfcfcf];
const PALE=[3,5,9,11],FEMA=[4,5,8,10],LAST=13,MAXE=5,MAXR=6;
const ENDS={the_end:['Это конец?','Вы дожили до конца жары. В доме остались только люди. Снаружи впервые за много дней дует прохладный ветер… но вы всё ещё не уверены, кто сидит рядом.'],not_alone:['Нет, я не один','Жара спала. Но среди тех, кто делил с вами дом, был Гость. Он улыбнулся идеально белыми зубами: «Теперь мы одна семья».'],alone:['Да, я один','«Ты один?» — «Да». Свет погас. Больше вас никто не видел.'],murderer:['Да, я убийца','Слишком много крови на ваших руках. На пороге стоит Пророк и вслух читает приговор.'],devoured:['Дом принадлежит Гостям','В доме не осталось людей, кроме вас. Ночью Гость подошёл к вашей кровати.']};
const RADIO=['«…сегодня +49°. Не выходите без воды. Бледный человек заходит по нечётным ночам, не оставайтесь в одиночестве…»','«…по данным FEMA, проверки в домах пройдут на четвёртую, пятую, восьмую и десятую ночь. Уведомления принимаются…»','«…Гости не знают, как выглядит усталость. Смотрите на зубы, ногти и глаза…»','«…кошки чувствуют Гостей. Корм творит чудеса…»'];
const G={day:1,clock:14,res:[],cat:false,food:0,notice:1,energy:4,credits:6,kills:0,hkills:0,over:false,cur:null,id:0};
let tests=0;
function genVisitor(sp){const guest=sp?sp.guest:Rn()<cl(.3+G.day*.025,0,.65),t={teeth:guest?Rn()<.7:Rn()<.08,nails:guest?Rn()<.6:Rn()<.1,eyes:guest?Rn()<.55:Rn()<.08,lie:guest?Rn()<.6:false};
 if(guest&&!t.teeth&&!t.nails&&!t.eyes&&!t.lie)t[rnd(['teeth','nails','eyes','lie'])]=true;
 return{id:++G.id,name:sp&&sp.name||rnd(NAMES),role:sp&&sp.role||rnd(ROLES),guest,t,cat:!!(sp&&sp.cat),skin:rnd(SK),cloth:rnd(CLO),hair:rnd(HAIR),notice:false,rev:{}}}
const sayIntro=v=>`«Здравствуйте! Я ${v.name}, ${v.role}. На улице смертельная жара, впустите, пожалуйста.»`+(v.cat?' (В руках у неё кошка.)':'');
const sayAsk=v=>v.t.lie?rnd(['«Меня выгнали из убежища. Сказали, что я лишний.»','«Из убежища меня выставили за дверь, представляете?»']):v.guest?rnd(['«Я просто шёл мимо и увидел ваш дом.»','«У меня никого нет. Я хочу к людям.»']):rnd(['«Я ушёл сам: в убежище закончилась вода.»','«Мы разошлись с соседями по убежищу, когда сломался генератор.»']);
const tRes={teeth:v=>v.t.teeth?'🦷 Зубы слишком белые и идеально ровные.':'🦷 Зубы жёлтые и неровные. Обычные.',nails:v=>v.t.nails?'✋ Под ногтями чёрная земля.':'✋ Ногти чистые.',eyes:v=>v.t.eyes?'👁 Глаза воспалены, налиты кровью.':'👁 Глаза усталые, но нормальные.',ask:v=>'💬 '+sayAsk(v)};
// ---------- игровая логика (без графики) ----------
const waitMs=ms=>window.__AUTO?Promise.resolve():new Promise(r=>setTimeout(r,ms));
let decideRes=null;
function card(title,text,btns){if(window.__AUTO)return Promise.resolve(window.__AUTO(btns,title));return new Promise(res=>{$('#ct').textContent=title;$('#cx').textContent=text;const b=$('#cb');b.innerHTML='';btns.forEach(x=>{const e=document.createElement('button');e.textContent=x[0];e.onclick=()=>{sfx.click();$('#card').classList.remove('on');res(x[1])};b.appendChild(e)});$('#card').classList.add('on')})}
const humans=()=>G.res.filter(r=>!r.guest);
function ending(id){if(G.over)return;G.over=true;store.del('nh_save');const f=store.get('nh_ends',[]);if(!f.includes(id)){f.push(id);store.set('nh_ends',f)}
 Fx.flash(id==='the_end'?0:1);sfx.stinger();$('#dlg').style.display='none';$('#hud').style.display='none';$('#et').textContent=ENDS[id][0];$('#ex').textContent=ENDS[id][1];setTimeout(()=>$('#end').classList.add('on'),window.__AUTO?0:1500);G.endId=id}
function save(){store.set('nh_save',{day:G.day,res:G.res,cat:G.cat,food:G.food,notice:G.notice,energy:G.energy,credits:G.credits,kills:G.kills,hkills:G.hkills})}
function makeQueue(){const q=[];const n=G.day===1?2:3;for(let i=0;i<n;i++)q.push(genVisitor());if(G.day===2&&!G.cat)q[0]=genVisitor({name:'Женщина',role:'с кошкой',guest:Rn()<.4,cat:true});return q}
function applyTest(v,k){if(G.energy<1){toast('Нет сил. Закажите EnerJeka на ноутбуке.');return false}G.energy--;v.rev[k]=tRes[k](v);tests++;return true}
function admit(v){if(G.res.length>=MAXR){toast('В доме нет места.');return false}const r={id:v.id,name:v.name,guest:v.guest,notice:false,skin:v.skin,cloth:v.cloth,hair:v.hair,t:v.t};G.res.push(r);if(v.cat){G.cat=true;toast('Вы получили кошку!');sfx.meow()}return r}
function killV(v){G.kills++;if(!v.guest)G.hkills++;toast(v.guest?'Из раны потекла чёрная жидкость. Это был Гость.':'Он истекал кровью… Это был человек.',3500)}
async function decide(v){if(window.__AUTO_V)return window.__AUTO_V(v);return new Promise(res=>{decideRes=res;showDlg(v)})}
async function night(){const n=G.day;let protect=false;
 Fx.setTod(1);await card('Ночь '+n,'Солнце уходит, но жара не спадает. Дом затихает, и слышно только вентилятор.',[['Дальше',1]]);
 if(G.cat&&G.food>0){const v=await card('Кошка','Покормить кошку особым кормом? Говорят, ночью она оберегает дом.',[['Покормить',1],['Не сейчас',0]]);if(v){G.food--;protect=true;sfx.meow()}}
 if(FEMA.includes(n)){const tk=G.res.filter(r=>r.notice);G.res=G.res.filter(r=>!r.notice);tk.forEach(r=>Fx.removeRes(r,'fade'));await card('FEMA',tk.length?'В дверь вежливо постучали люди в форме. Они забрали: '+tk.map(r=>r.name).join(', ')+'.':'Люди из FEMA осмотрели дом и ушли, ничего не сказав.',[['Дальше',1]])}
 const gs=G.res.filter(r=>r.guest);
 if(gs.length){if(protect)await card('Ночь прошла','Кошка шипела в темноту до утра. Никто не пострадал.',[['Дальше',1]]);else{const hs=humans();if(!hs.length){ending('devoured');return false}const k=Math.min(gs.length>1?2:1,hs.length),dead=[];for(let i=0;i<k;i++){const x=rnd(hs.filter(h=>!dead.includes(h)));dead.push(x)}G.res=G.res.filter(r=>!dead.includes(r));dead.forEach(r=>Fx.removeRes(r,'kill'));sfx.stinger();await card('Утро','Ночью что-то случилось. Не вышли к завтраку: '+dead.map(r=>r.name).join(', ')+'.',[['Дальше',1]])}}
 if(PALE.includes(n)){Fx.swing(2);sfx.stinger();const v=await card('Бледный человек','Он стоит у окна и не моргает. Ладони прижаты к стеклу.\n— Ты один?',[['Да, я один',1],['Нет, нас здесь несколько',0]]);if(v||!G.res.length){ending('alone');return false}await card('…','Он долго смотрит на силуэты в комнате. Потом уходит, оставив на стекле влажные следы.',[['Дальше',1]])}
 if(G.hkills>=3){ending('murderer');return false}
 G.day++;if(G.day>LAST){ending(G.res.some(r=>r.guest)?'not_alone':'the_end');return false}
 G.energy=Math.min(MAXE,G.energy+2);G.credits+=4;G.clock=14;save();Fx.setTod(0);return true}
async function runDay(){while(!G.over){G.clock=14;const q=makeQueue();Fx.setTod(0);Fx.draw();hud();
 for(const v of q){if(G.over)return;await Fx.arrive(v);G.cur=v;const d=await decide(v);G.cur=null;if(G.over)return;
  if(d==='in'){const r=admit(v);if(!r){await Fx.leave(v);}else await Fx.enter(v,r)}else if(d==='out')await Fx.leave(v);else{killV(v);await Fx.kill(v)}
  G.clock+=1.6;Fx.setTod(cl((G.clock-14)/9,0,.7));hud()}
 if(!(await night()))return;hud()}}
