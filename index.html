<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VoxType — Тренажёр диктовки в тетрадь</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0d17;
      --card-bg: rgba(22, 26, 46, 0.65);
      --card-border: rgba(138, 43, 226, 0.2);
      --primary: #8a2be2;
      --primary-hover: #9d4edd;
      --accent: #00f2fe;
      --accent-glow: rgba(0, 242, 254, 0.35);
      --text-main: #f0f3fe;
      --text-muted: #a0a7cc;
      --danger: #ff4757;
      --success: #2ed573;
      --radius: 16px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.12) 0%, transparent 40%);
      background-attachment: fixed;
    }

    header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      background: rgba(11, 13, 23, 0.7);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text-main), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: bold;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    main {
      flex: 1; max-width: 1000px; width: 100%;
      margin: 0 auto; padding: 2rem 1.5rem;
      display: flex; flex-direction: column; gap: 1.5rem;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      margin-bottom: 1rem;
    }

    .control-group {
      display: flex; flex-direction: column; gap: 6px;
    }

    .control-group label {
      font-size: 0.85rem; color: var(--text-muted); font-weight: 500;
      display: flex; justify-content: space-between;
    }

    select {
      width: 100%; padding: 10px 14px;
      background: rgba(11, 13, 23, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 10px; color: var(--text-main);
      font-size: 0.9rem; outline: none;
    }

    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px; outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: var(--accent);
      cursor: pointer; box-shadow: 0 0 10px var(--accent);
    }

    .editor-container {
      position: relative; display: flex; flex-direction: column; gap: 10px;
    }

    textarea {
      width: 100%; min-height: 220px;
      background: rgba(11, 13, 23, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 12px; padding: 1rem;
      color: var(--text-main); font-size: 1.05rem; line-height: 1.6;
      resize: vertical; outline: none; transition: var(--transition);
    }

    textarea:focus { border-color: var(--primary); }

    .formatted-reader {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      padding: 1rem; background: rgba(11, 13, 23, 0.95);
      border: 1px solid var(--primary); border-radius: 12px;
      color: var(--text-main); font-size: 1.1rem; line-height: 1.8;
      overflow-y: auto; display: none; white-space: pre-wrap;
    }

    .sentence-highlight {
      background-color: rgba(0, 242, 254, 0.25);
      border-bottom: 2px solid var(--accent);
      border-radius: 4px; padding: 2px 0;
    }

    .action-bar {
      display: flex; flex-wrap: wrap; gap: 10px;
      align-items: center; justify-content: space-between; margin-top: 1rem;
    }

    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

    .btn {
      padding: 10px 20px; border-radius: 10px; border: none;
      font-weight: 600; font-size: 0.9rem; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: var(--transition);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: white; box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08); color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.15); }

    .btn-danger {
      background: rgba(255, 71, 87, 0.2); color: var(--danger);
      border: 1px solid rgba(255, 71, 87, 0.3);
    }

    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 12px; background: rgba(0, 242, 254, 0.1);
      border: 1px solid var(--accent); border-radius: 8px;
      font-size: 0.9rem; color: var(--accent); font-weight: 500;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-icon">V</div>
      <span>VoxType — Диктант в тетрадь</span>
    </div>
  </header>

  <main>
    <div class="glass-card" style="display: flex; flex-direction: column; gap: 1rem;">
      
      <!-- Settings -->
      <div class="controls-grid">
        <div class="control-group">
          <label for="voice-select">Голос диктора</label>
          <select id="voice-select"><option value="">Загрузка голосов...</option></select>
        </div>

        <div class="control-group">
          <label for="pause-range">Пауза между предложениями: <span id="pause-val" class="stat-value" style="color:var(--accent);">5 сек</span></label>
          <input type="range" id="pause-range" min="1" max="15" step="1" value="5">
        </div>

        <div class="control-group">
          <label for="rate-range">Скорость чтения: <span id="rate-val" class="stat-value" style="color:var(--accent);">1.0x</span></label>
          <input type="range" id="rate-range" min="0.5" max="1.5" step="0.1" value="1">
        </div>
      </div>

      <!-- Status Indicator -->
      <div id="dictation-status" style="display: none;" class="status-badge">
        <span id="status-text">Ожидание...</span>
      </div>

      <!-- Text Area / Display -->
      <div class="editor-container">
        <div class="text-area-wrapper">
          <textarea id="source-text" placeholder="Вставьте текст диктанта сюда. Программа будет читать его предложение за предложением, делая паузы, чтобы вы успевали писать в тетради..."></textarea>
          <div id="formatted-reader" class="formatted-reader"></div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="action-bar">
        <div class="btn-group">
          <button id="btn-play" class="btn btn-primary" onclick="startNotebookDictation()">▶ Начать диктант</button>
          <button id="btn-pause" class="btn btn-secondary" onclick="pauseNotebookDictation()" disabled>⏸ Пауза</button>
          <button id="btn-stop" class="btn btn-danger" onclick="stopNotebookDictation()" disabled>⏹ Стоп</button>
        </div>
        <button class="btn btn-secondary" onclick="clearText()">Очистить</button>
      </div>

    </div>
  </main>

  <script>
    const synth = window.speechSynthesis;
    let voices = [];
    let sentences = [];
    let currentIndex = 0;
    let isPlaying = false;
    let isPaused = false;
    let pauseTimer = null;

    const voiceSelect = document.getElementById('voice-select');
    const pauseRange = document.getElementById('pause-range');
    const pauseVal = document.getElementById('pause-val');
    const rateRange = document.getElementById('rate-range');
    const rateVal = document.getElementById('rate-val');
    
    const sourceText = document.getElementById('source-text');
    const formattedReader = document.getElementById('formatted-reader');
    const statusBox = document.getElementById('dictation-status');
    const statusText = document.getElementById('status-text');

    const btnPlay = document.getElementById('btn-play');
    const btnPause = document.getElementById('btn-pause');
    const btnStop = document.getElementById('btn-stop');

    // Load Voices
    function populateVoices() {
      if (!synth) return;
      voices = synth.getVoices();
      if (voices.length === 0) return;
      voiceSelect.innerHTML = '';
      
      voices.forEach((voice, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
      });

      const ruIndex = voices.findIndex(v => v.lang.startsWith('ru'));
      if (ruIndex !== -1) voiceSelect.value = ruIndex;
    }

    populateVoices();
    if (synth && synth.onvoiceschanged !== undefined) {
      synth.onvoiceschanged = populateVoices;
    }

    pauseRange.addEventListener('input', () => {
      pauseVal.textContent = pauseRange.value + ' сек';
    });
    rateRange.addEventListener('input', () => {
      rateVal.textContent = parseFloat(rateRange.value).toFixed(1) + 'x';
    });

    // Split text into individual sentences
    function splitIntoSentences(text) {
      // Regex splits text by punctuation (. ! ?) keeping sentence integrity
      const matches = text.match(/[^.!?]+[.!?]+(\s|$)|[^.!?]+$/g);
      if (!matches) return [text];
      return matches.map(s => s.trim()).filter(Boolean);
    }

    function startNotebookDictation() {
      const text = sourceText.value.trim();
      if (!text) {
        alert("Пожалуйста, введите текст для диктанта.");
        return;
      }

      if (isPaused) {
        synth.resume();
        isPaused = false;
        isPlaying = true;
        updateUI();
        return;
      }

      stopNotebookDictation();

      sentences = splitIntoSentences(text);
      currentIndex = 0;
      isPlaying = true;
      isPaused = false;

      setupReaderView();
      statusBox.style.display = 'inline-flex';
      updateUI();
      
      readCurrentSentence();
    }

    function readCurrentSentence() {
      if (!isPlaying || isPaused) return;

      if (currentIndex >= sentences.length) {
        statusText.textContent = "✅ Диктант окончен!";
        stopNotebookDictation();
        return;
      }

      highlightSentence(currentIndex);
      statusText.textContent = `Читаю предложение ${currentIndex + 1} из ${sentences.length}...`;

      const utterance = new SpeechSynthesisUtterance(sentences[currentIndex]);
      const selectedVoice = voices[voiceSelect.value];
      if (selectedVoice) utterance.voice = selectedVoice;
      utterance.rate = parseFloat(rateRange.value);

      utterance.onend = () => {
        if (!isPlaying || isPaused) return;
        
        // Start waiting pause for writing into notebook
        const pauseSeconds = parseInt(pauseRange.value);
        let timeLeft = pauseSeconds;
        
        statusText.textContent = `✍️ Пишите в тетрадь... (Следующее через ${timeLeft}с)`;

        pauseTimer = setInterval(() => {
          timeLeft--;
          if (timeLeft > 0) {
            statusText.textContent = `✍️ Пишите в тетрадь... (Следующее через ${timeLeft}с)`;
          } else {
            clearInterval(pauseTimer);
            currentIndex++;
            readCurrentSentence();
          }
        }, 1000);
      };

      utterance.onerror = () => {
        currentIndex++;
        readCurrentSentence();
      };

      synth.speak(utterance);
    }

    function pauseNotebookDictation() {
      if (synth.speaking) {
        synth.pause();
      }
      if (pauseTimer) {
        clearInterval(pauseTimer);
      }
      isPaused = true;
      isPlaying = false;
      statusText.textContent = "⏸ Диктант на паузе";
      updateUI();
    }

    function stopNotebookDictation() {
      if (synth) synth.cancel();
      if (pauseTimer) clearInterval(pauseTimer);
      
      isPlaying = false;
      isPaused = false;
      currentIndex = 0;
      
      formattedReader.style.display = 'none';
      sourceText.style.display = 'block';
      statusBox.style.display = 'none';
      updateUI();
    }

    function setupReaderView() {
      formattedReader.innerHTML = '';
      sentences.forEach((s, idx) => {
        const span = document.createElement('span');
        span.id = `sent-${idx}`;
        span.textContent = s + ' ';
        formattedReader.appendChild(span);
      });
      sourceText.style.display = 'none';
      formattedReader.style.display = 'block';
    }

    function highlightSentence(index) {
      const spans = formattedReader.querySelectorAll('span');
      spans.forEach((s, i) => {
        if (i === index) {
          s.className = 'sentence-highlight';
          s.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          s.className = '';
        }
      });
    }

    function updateUI() {
      btnPlay.textContent = isPaused ? '▶ Продолжить' : '▶ Начать диктант';
      btnPause.disabled = !isPlaying;
      btnStop.disabled = !isPlaying && !isPaused;
    }

    function clearText() {
      stopNotebookDictation();
      sourceText.value = '';
    }
  </script>
</body>
</html>
