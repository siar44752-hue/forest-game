<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Игровая комната — играй с друзьями</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1100px 600px at 15% -10%,#4c1d9566,transparent),radial-gradient(900px 500px at 100% 0,#0e749055,transparent),#0d0a1c;color:#ece9ff;min-height:100vh}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 18px;position:sticky;top:0;background:#0d0a1ccc;backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid #ffffff14}
#logo{font-size:20px;font-weight:800;cursor:pointer;white-space:nowrap}
input{background:#ffffff12;border:1px solid #ffffff26;color:#fff;border-radius:10px;padding:10px 12px;font-size:15px;outline:none;min-width:0}
input:focus{border-color:#a78bfa}
main{max-width:1000px;margin:0 auto;padding:18px}
.hero{text-align:center;padding:22px 0 6px}
.hero h1{font-size:clamp(28px,6vw,50px);margin:0 0 6px;background:linear-gradient(90deg,#c4b5fd,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:#a9a3cc}
.join{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center;margin:16px 0}
.join input{width:130px;text-transform:uppercase;letter-spacing:3px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:18px}
.card{background:linear-gradient(160deg,#ffffff14,#ffffff06);border:1px solid #ffffff1f;border-top:4px solid var(--c);border-radius:18px;padding:18px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 30px #0008,0 0 0 1px var(--c)}
.card .ic{font-size:44px}.card h3{margin:6px 0}.card p{margin:0 0 10px;color:#c9c4e8;font-size:14px;line-height:1.4}
.card small{color:#a9a3cc}
.card.soon{border-style:dashed;cursor:default;opacity:.6}.card.soon:hover{transform:none;box-shadow:none}
.btn{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;margin:3px;transition:.15s}
.btn:hover{filter:brightness(1.15)}.btn:active{transform:scale(.97)}
.btn.big{padding:13px 22px;font-size:17px}.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{background:#ffffff14}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.bar b{font-size:18px;margin-right:auto}
.lob{max-width:560px;margin:20px auto;text-align:center;background:#ffffff0d;border:1px solid #ffffff1f;border-radius:20px;padding:22px}
.lob h2{margin:4px 0}.code{font-size:56px;font-weight:900;letter-spacing:10px;color:#67e8f9;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 16px}
.chip{display:inline-flex;gap:6px;align-items:center;background:#ffffff12;border:1px solid var(--c,#fff3);border-radius:20px;padding:5px 12px;font-size:14px}
.chip.st{background:#7c3aed44}
.rules{text-align:left;font-size:13px;color:#c9c4e8;background:#0004;border-radius:12px;padding:10px 14px;margin:10px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111c;border:1px solid #fff3;padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
.sc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
/* монополия */
.mb{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);gap:3px;aspect-ratio:1;max-width:680px;margin:0 auto}
.mc{background:#ffffff10;border:1px solid #ffffff1a;border-radius:6px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:clamp(7px,1.5vw,11px);padding:2px;overflow:hidden;line-height:1.15}
.mc i{position:absolute;top:0;left:0;right:0;height:6px}.mc u{position:absolute;bottom:0;left:0;right:0;height:5px}
.mc .tk{font-size:clamp(10px,2.2vw,18px);line-height:1}
.mid{grid-area:2/2/7/7;background:#0005;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;font-size:clamp(11px,1.8vw,14px)}
.dice{font-size:clamp(30px,7vw,56px);letter-spacing:6px;line-height:1}
.pp{display:flex;gap:8px;align-items:center;padding:6px 12px;border-radius:12px;background:#ffffff0d;border-left:4px solid var(--c);margin:4px 0}.pp.cur{background:#7c3aed44}.pp.out{opacity:.4;text-decoration:line-through}
.log{font-size:12px;color:#b8b2dc;max-height:90px;overflow:hidden}
/* карты имаджинариум */
.hand,.tbl{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.pc{width:100px;height:140px;border-radius:12px;overflow:hidden;cursor:pointer;border:3px solid transparent;transition:.15s;flex:none}
.pc:hover{transform:translateY(-4px)}.pc.sel{border-color:#fff;transform:translateY(-8px);box-shadow:0 0 18px #fff6}
.ic3{width:100%;height:100%;display:flex;align-items:center;justify-content:space-around;font-size:30px}
.ic3.l1{flex-direction:column}.ic3.l2{flex-wrap:wrap;padding:10px}.ic3 span:nth-child(2){font-size:42px}.ic3.l2 span:nth-child(1){font-size:50px}
.tc{text-align:center;font-size:12px;display:flex;flex-direction:column;gap:3px;align-items:center}.tc.win .pc{border-color:#facc15;box-shadow:0 0 18px #facc1588}
/* уно */
.uc{width:64px;height:92px;border-radius:10px;border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;cursor:pointer;transition:.15s;flex:none;text-shadow:0 2px 4px #0006}
.uc.no{opacity:.45;cursor:default}.uc.ok:hover{transform:translateY(-8px)}.uc.big{width:90px;height:130px;font-size:40px;cursor:default}
.uno{display:flex;gap:18px;align-items:center;justify-content:center;margin:14px 0;flex-wrap:wrap}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid #fff;vertical-align:middle}
/* шпион / крокодил */
.role{font-size:22px;text-align:center;background:#ffffff10;border-radius:16px;padding:22px;margin:12px 0}
.locs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#cv{width:100%;max-width:640px;aspect-ratio:640/440;background:#fff;border-radius:14px;touch-action:none;display:block;margin:0 auto;cursor:crosshair}
.tools{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid #fff8;cursor:pointer;display:inline-block}
.chat{max-width:640px;margin:10px auto;font-size:14px}.chat div{padding:3px 0}.chat .ok{color:#86efac;font-weight:700}
</style>
</head>
<body>
<header>
  <div id="logo" onclick="leave()">🎲 Игровая комната</div>
  <input id="nm" placeholder="Твоё имя" maxlength="14" style="width:150px">
</header>
<main id="app"></main>
<div id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ============ утилиты ============ */
var reg=[],sel=null,unoPend=null,STROKES=[],lastR=0,tool={c:'#111111',w:4},tmr=null;
const $=s=>document.querySelector(s),app=$('#app');
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const B=(l,f,c='')=>{reg.push(f);return `<button class="btn ${c}" onclick="reg[${reg.length-1}]()">${l}</button>`};
const H=f=>{reg.push(f);return `reg[${reg.length-1}]()`};
const rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const COL=['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#f97316'];
const TOK=['🔴','🔵','🟢','🟡','🟣','🟠'];
try{$('#nm').value=localStorage.getItem('nm')||'';$('#nm').oninput=e=>localStorage.setItem('nm',e.target.value)}catch(e){}
const nm=()=>(($('#nm').value||'').trim()||'Игрок'+(1+rnd(99))).slice(0,14);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function pickSel(el,id){sel=id;document.querySelectorAll('.hand .pc').forEach(e=>e.classList.remove('sel'));el.classList.add('sel')}

/* ============ сеть (WebRTC, PeerJS) ============ */
var net={};
const broadcast=m=>Object.values(net.conns||{}).forEach(c=>c.open&&c.send(m));
const genCode=()=>Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[rnd(24)]).join('');

function hostRoom(gid){
  net={host:true,gid,players:[{name:nm()}],conns:{},me:0,S:null,started:false};
  openPeer(genCode());
}
function openPeer(code){
  net.code=code;
  const p=new Peer('ggames-'+code);net.peer=p;
  p.on('open',()=>{history.replaceState(null,'','#'+code);lobby()});
  p.on('error',e=>{if(e.type==='unavailable-id'){p.destroy();openPeer(genCode())}else toast('Ошибка сети: '+e.type)});
  p.on('connection',c=>{
    c.on('data',m=>hostRecv(c,m));
    c.on('close',()=>{if(c._i!=null&&!net.started){delete net.conns[c._i];}});
  });
}
function hostRecv(c,m){
  const G=GM[net.gid];
  if(m.t==='join'){
    if(net.started)return c.send({t:'err',msg:'Игра уже идёт'});
    if(net.players.length>=G.max)return c.send({t:'err',msg:'Комната заполнена'});
    const i=net.players.push({name:m.name})-1;net.conns[i]=c;c._i=i;
    c.send({t:'hi',idx:i});sendLobby();
  }else if(m.t==='act')applyAct(c._i,m.a);
  else if(m.t==='d'){drawSeg(m.seg);Object.values(net.conns).forEach(o=>o!==c&&o.open&&o.send(m))}
}
function sendLobby(){broadcast({t:'lobby',gid:net.gid,players:net.players,code:net.code});lobby()}
function joinRoom(code){
  code=(code||'').trim().toUpperCase();if(code.length<4)return toast('Введи код комнаты');
  net={host:false,players:[],me:-1,code,S:null,started:false};
  app.innerHTML='<p class="muted" style="text-align:center;margin-top:60px">Подключаемся…</p>';
  const p=new Peer();net.peer=p;
  p.on('open',()=>{
    const c=p.connect('ggames-'+code,{reliable:true});net.conn=c;
    c.on('open',()=>c.send({t:'join',name:nm()}));
    c.on('data',guestRecv);
    c.on('close',()=>{if(net.peer===p){toast('Связь с хостом потеряна');cleanup();home()}});
  });
  p.on('error',e=>{toast(e.type==='peer-unavailable'?'Комната не найдена':'Ошибка: '+e.type);cleanup();home()});
}
function guestRecv(m){
  if(m.t==='hi')net.me=m.idx;
  else if(m.t==='lobby'){net.gid=m.gid;net.players=m.players;net.code=m.code;net.started=false;lobby()}
  else if(m.t==='state'){net.S=m.S;net.started=true;showGame()}
  else if(m.t==='d')drawSeg(m.seg);
  else if(m.t==='err'){toast(m.msg);cleanup();home()}
  else if(m.t==='end'){toast('Хост закрыл комнату');cleanup();home()}
}
function cleanup(){try{net.peer&&net.peer.destroy()}catch(e){}net={};clearInterval(tmr);history.replaceState(null,'',location.pathname)}
function leave(){if(net.host)broadcast({t:'end'});cleanup();home()}
function toLobby(){net.started=false;sendLobby()}
function start(){
  const G=GM[net.gid];net.S=G.init(net.players.map(p=>p.name));net.started=true;
  STROKES=[];lastR=0;broadcast({t:'state',S:net.S});showGame();
}
function send(a){sel=null;unoPend=null;if(net.host)applyAct(net.me,a);else net.conn&&net.conn.send({t:'act',a})}
function applyAct(i,a){
  try{GM[net.gid].act(net.S,i,a)}catch(e){console.error(e);return}
  broadcast({t:'state',S:net.S});showGame();
}

/* ============ экраны ============ */
function home(){
  reg=[];clearInterval(tmr);
  app.innerHTML=`<div class="hero"><h1>Играй с друзьями онлайн</h1>
  <p class="muted">Выбери игру → создай комнату → отправь другу код или ссылку. Всё работает прямо в браузере, без регистрации.</p></div>
  <div class="join"><span class="muted">Есть код комнаты?</span><input id="jc" maxlength="5" placeholder="КОД">${B('Войти',()=>joinRoom($('#jc').value))}</div>
  <div class="grid">${GAMES.map(g=>`<div class="card" style="--c:${g.color}" onclick="${H(()=>hostRoom(g.id))}">
    <div class="ic">${g.icon}</div><h3>${g.name}</h3><p>${g.desc}</p><small>👥 ${g.min}–${g.max} игроков</small></div>`).join('')}
    <div class="card soon" style="--c:#64748b"><div class="ic">✨</div><h3>Скоро ещё</h3><p>Дурак, Мафия, Активити, Codenames… Напиши, что добавить!</p></div></div>`;
}
function lobby(){
  reg=[];clearInterval(tmr);const G=GM[net.gid];const url=location.href.split('#')[0]+'#'+net.code;
  app.innerHTML=`<div class="lob"><div class="muted">Комната</div><h2>${G.icon} ${G.name}</h2>
  <div class="code">${net.code}</div>
  <p class="muted">Друг заходит на сайт → «Войти по коду», или отправь ему ссылку:</p>
  <div class="row"><input readonly value="${url}" onclick="this.select()" style="flex:1">${B('Копировать',()=>{try{navigator.clipboard.writeText(url)}catch(e){}toast('Ссылка скопирована')},'sm')}</div>
  <div class="rules">${G.rules}</div>
  <h3>Игроки (${net.players.length}/${G.max})</h3>
  <div class="pl">${net.players.map((p,i)=>`<span class="chip" style="--c:${COL[i]}">${TOK[i]} ${E(p.name)}${i===0?' 👑':''}${i===net.me?' (ты)':''}</span>`).join('')}</div>
  ${net.host?(net.players.length>=G.min?B('▶ Начать игру',start,'big'):`<p class="muted">Нужно минимум ${G.min} игрока(ов)</p>`):'<p class="muted">Ждём, пока хост начнёт игру…</p>'}
  <div>${B('← В меню',leave,'ghost sm')}</div></div>`;
}
function showGame(){
  const G=GM[net.gid],S=net.S;
  const keep={};document.querySelectorAll('#app input[id]').forEach(i=>keep[i.id]=i.value);
  const fa=document.activeElement&&document.activeElement.id;
  clearInterval(tmr);reg=[];
  app.innerHTML=`<div class="bar"><b>${G.icon} ${G.name}</b><span class="muted">комната ${net.code}</span>${net.host?B('В лобби',toLobby,'sm ghost'):''}${B('Выйти',leave,'sm ghost')}</div><div id="g">${G.render(S,net.me)}</div>`;
  for(const k in keep){const el=document.getElementById(k);if(el)el.value=keep[k]}
  if(fa){const el=document.getElementById(fa);el&&el.focus()}
  G.after&&G.after(S,net.me);
}

/* ============ 1. МОНОПОЛИЯ ============ */
const MB=[['СТАРТ','s'],['Хлебная ул.','p',60,6,'#92400e'],['Шанс','c'],['Кофейня','p',80,8,'#92400e'],['Налог','t',100],['Вокзал','p',150,20,'#64748b'],['Парк','p',100,10,'#16a34a'],
['Парковка','f'],['Кинотеатр','p',120,12,'#0ea5e9'],['Шанс','c'],['Музей','p',140,14,'#0ea5e9'],['Библиотека','p',140,14,'#0ea5e9'],['Отпуск','v'],
['Аэропорт','p',200,25,'#64748b'],['Отель','p',220,22,'#ec4899'],['Шанс','c'],['Казино','p',240,24,'#ec4899'],['Налог','t',150],['Порт','p',200,25,'#64748b'],
['Башня','p',260,26,'#f59e0b'],['Шанс','c'],['Небоскрёб','p',300,30,'#f59e0b'],['Дворец','p',350,40,'#ef4444'],['Лотерея','l']];
const CH=[['нашёл клад +150$',150],['штраф за парковку −80$',-80],['подарок от друга +100$',100],['ремонт машины −120$',-120],['налоговая вернула +60$',60],['купил билет в кино −40$',-40]];
const cp=i=>i<=6?[1,i+1]:i<=12?[i-5,7]:i<=18?[7,7-(i-12)]:[7-(i-18),1];
const lg=(S,t)=>{S.log.unshift(t);S.log.length=Math.min(S.log.length,6)};
function monoNext(S){const n=S.names.length;do{S.turn=(S.turn+1)%n}while(S.out[S.turn]);S.ph='roll'}
function monoLand(S,i){
  const c=MB[S.pos[i]],N=S.names[i];S.ph='end';
  if(c[1]==='p'){const o=S.own[S.pos[i]];
    if(o===undefined){if(S.money[i]>=c[2]){S.ph='buy';lg(S,`${N} на «${c[0]}»`)}else lg(S,`${N} на «${c[0]}», но не хватает денег`)}
    else if(o!==i){S.money[i]-=c[3];S.money[o]+=c[3];lg(S,`${N} платит ${c[3]}$ игроку ${S.names[o]} за «${c[0]}»`)}
    else lg(S,`${N} отдыхает на своей «${c[0]}»`)}
  else if(c[1]==='t'){S.money[i]-=c[2];lg(S,`${N} платит налог ${c[2]}$`)}
  else if(c[1]==='c'){const e=CH[rnd(CH.length)];S.money[i]+=e[1];lg(S,`${N}: ${e[0]}`)}
  else if(c[1]==='l'){const v=[-50,0,100,250][rnd(4)];S.money[i]+=v;lg(S,`${N} в лотерее: ${v>=0?'+':''}${v}$`)}
  else if(c[1]==='v'){S.money[i]+=50;lg(S,`${N} в отпуске: +50$`)}
  else lg(S,`${N} на «${c[0]}»`);
  if(S.money[i]<0){S.out[i]=true;for(const k in S.own)if(S.own[k]===i)delete S.own[k];lg(S,`💥 ${N} банкрот!`);
    const al=S.names.map((_,j)=>j).filter(j=>!S.out[j]);if(al.length===1){S.win=al[0];return}monoNext(S)}
}
const MONO={id:'mono',name:'Мини-Монополия',icon:'🏙️',color:'#f59e0b',min:2,max:4,
desc:'Бросай кубики, скупай улицы и разоряй друзей. Побеждает последний не обанкротившийся.',
rules:'🎲 Бросай кубики → если улица свободна, можешь купить. Наступил на чужую — платишь аренду. Прошёл СТАРТ — +200$. У кого деньги ушли в минус — банкрот. Выживает один!',
init(names){return{names,pos:names.map(()=>0),money:names.map(()=>1000),own:{},turn:0,ph:'roll',dice:[0,0],log:['Игра началась!'],out:names.map(()=>false),win:-1}},
act(S,i,a){
  if(S.win>=0||i!==S.turn)return;
  if(a.t==='roll'&&S.ph==='roll'){
    const d=[1+rnd(6),1+rnd(6)];S.dice=d;const o=S.pos[i],n=(o+d[0]+d[1])%24;
    if(n<o){S.money[i]+=200;lg(S,`${S.names[i]} прошёл СТАРТ +200$`)}
    S.pos[i]=n;monoLand(S,i);
  }else if(a.t==='buy'&&S.ph==='buy'){const c=MB[S.pos[i]];S.money[i]-=c[2];S.own[S.pos[i]]=i;lg(S,`${S.names[i]} купил «${c[0]}» за ${c[2]}$`);S.ph='end'}
  else if(a.t==='skip'&&S.ph==='buy')S.ph='end';
  else if(a.t==='next'&&S.ph==='end')monoNext(S);
},
render(S,me){
  const cell=(c,i)=>{const[r,k]=cp(i),own=S.own[i],here=S.pos.map((p,j)=>p===i&&!S.out[j]?TOK[j]:'').join('');
    const ic={s:'🏁',c:'❓',t:'💸',l:'🎰',v:'🏖️',f:'🅿️'}[c[1]]||'';
    return `<div class="mc" style="grid-row:${r};grid-column:${k}">${c[1]==='p'?`<i style="background:${c[4]}"></i>`:''}<b>${ic} ${c[0]}</b>${c[1]==='p'?`<small>${c[2]}$</small>`:c[1]==='t'?`<small>−${c[2]}$</small>`:''}${own!==undefined?`<u style="background:${COL[own]}"></u>`:''}<span class="tk">${here}</span></div>`};
  let ui;const my=S.turn===me;
  if(S.win>=0)ui=`<h2>🏆 ${E(S.names[S.win])} победил(а)!</h2>`;
  else if(my&&S.ph==='roll')ui=B('🎲 Бросить кубики',()=>send({t:'roll'}),'big');
  else if(my&&S.ph==='buy'){const c=MB[S.pos[me]];ui=`<div>Купить «${c[0]}» за ${c[2]}$ (аренда ${c[3]}$)?</div>`+B('Купить',()=>send({t:'buy'}))+B('Нет',()=>send({t:'skip'}),'ghost')}
  else if(my&&S.ph==='end')ui=B('Закончить ход ➜',()=>send({t:'next'}),'big');
  else ui=`<div class="muted">Ходит ${TOK[S.turn]} ${E(S.names[S.turn])}…</div>`;
  const dice=S.dice[0]?S.dice.map(d=>'⚀⚁⚂⚃⚄⚅'[d-1]).join(''):'🎲🎲';
  return `<div class="mb">${MB.map(cell).join('')}<div class="mid"><div class="dice">${dice}</div>${ui}<div class="log">${S.log.map(E).join('<br>')}</div></div></div>
  <div style="max-width:680px;margin:12px auto">${S.names.map((n,i)=>`<div class="pp ${i===S.turn?'cur':''} ${S.out[i]?'out':''}" style="--c:${COL[i]}">${TOK[i]} ${E(n)}${i===me?' (ты)':''} <b style="margin-left:auto">${S.money[i]}$</b> <small class="muted">${Object.values(S.own).filter(o=>o===i).length} улиц</small></div>`).join('')}</div>`;
}};

/* ============ 2. ИМАДЖИНАРИУМ ============ */
const EM=['🌙','🌞','🌊','🔥','🌲','🏰','🚀','🐉','🦋','🐙','🎭','🔑','🔦','🌈','⛵','🦉','🍄','🎪','🧙','🪐','🌋','🦊','🐺','🎻','⏰','🌹','🐚','🦢','🗻','🎈','🧸','🐝','🌻','⛄','⚡','🍂','🗿','🛸','🐘','🦄','🎨','📜','⚓','🔮','🌵','🐢','🎡','🦁','🐬','🍎','🐦','🏺','🧭','🌴','🦇','👑'];
const art=id=>{const L=EM.length,h=id*47%360,a=EM[id*7%L],b=EM[(id*13+5)%L],c=EM[(id*29+11)%L];
  return `<div class="ic3 l${id%3}" style="background:linear-gradient(${135+id*13%90}deg,hsl(${h},65%,32%),hsl(${(h+70)%360},70%,52%))"><span>${a}</span><span>${b}</span><span>${c}</span></div>`};
const IMG={id:'img',name:'Имаджинариум',icon:'🎭',color:'#a855f7',min:3,max:6,
desc:'Загадывай картинку ассоциацией, а друзья угадывают, какая карта твоя. Не слишком очевидно и не слишком мудрёно!',
rules:'🎤 Рассказчик выбирает карту и придумывает к ней ассоциацию. Остальные подкладывают свои карты под неё. Все карты перемешиваются — и все (кроме рассказчика) голосуют, какая карта рассказчика. Если угадали не все и не никто — рассказчик +3, угадавшие +3. За голоса на свою карту +1. Игра до 12 очков. Играйте с голосовой связью (Discord, Telegram) для общения!',
init(names){const n=names.length,deck=shuf([...Array(120).keys()]);
  return{names,hands:names.map(()=>deck.splice(0,6)),deck,score:names.map(()=>0),st:0,ph:'clue',clue:'',table:[],votes:{},d:null,rn:1,over:false}},
act(S,i,a){
  const n=S.names.length;
  if(a.t==='clue'&&S.ph==='clue'&&i===S.st&&S.hands[i].includes(a.c)&&a.text){
    S.clue=String(a.text).slice(0,80);S.hands[i]=S.hands[i].filter(x=>x!==a.c);S.table=[{c:a.c,o:i}];S.ph='pick';
  }else if(a.t==='pick'&&S.ph==='pick'&&i!==S.st&&!S.table.some(t=>t.o===i)&&S.hands[i].includes(a.c)){
    S.hands[i]=S.hands[i].filter(x=>x!==a.c);S.table.push({c:a.c,o:i});
    if(S.table.length===n){S.table=shuf(S.table);S.ph='vote';S.votes={}}
  }else if(a.t==='vote'&&S.ph==='vote'&&i!==S.st&&S.votes[i]===undefined&&S.table[a.k]&&S.table[a.k].o!==i){
    S.votes[i]=a.k;
    if(Object.keys(S.votes).length===n-1){
      const k=Object.entries(S.votes),si=S.table.findIndex(t=>t.o===S.st),right=k.filter(([p,v])=>v===si).length,d=S.names.map(()=>0);
      if(right===0||right===n-1){for(let p=0;p<n;p++)if(p!==S.st)d[p]+=2}else{d[S.st]+=3;k.forEach(([p,v])=>{if(v===si)d[+p]+=3})}
      k.forEach(([p,v])=>{const o=S.table[v].o;if(o!==S.st)d[o]+=1});
      S.score=S.score.map((s,j)=>s+d[j]);S.d=d;S.ph='result';if(Math.max(...S.score)>=12)S.over=true;
    }
  }else if(a.t==='next'&&S.ph==='result'&&!S.over){
    const all=[...Array(120).keys()],used=new Set(S.hands.flat());
    if(S.deck.length<n)S.deck=shuf(all.filter(x=>!used.has(x)));
    S.hands.forEach(h=>{if(h.length<6)h.push(S.deck.pop())});
    S.st=(S.st+1)%n;S.rn++;S.ph='clue';S.clue='';S.table=[];S.votes={};S.d=null;
  }
},
render(S,me){
  const n=S.names.length,st=S.st;
  let h=`<div class="sc">${S.names.map((x,i)=>`<span class="chip ${i===st?'st':''}" style="--c:${COL[i]}">${TOK[i]} ${E(x)} <b>${S.score[i]}</b>${S.d&&S.ph==='result'?`<small>(+${S.d[i]})</small>`:''}${i===st?' 🎤':''}</span>`).join('')}</div>`;
  if(S.over){const w=S.score.indexOf(Math.max(...S.score));h+=`<h2>🏆 Победил(а) ${E(S.names[w])}!</h2>`}
  const hand=()=>`<h4>Твои карты</h4><div class="hand">${S.hands[me].map(c=>`<div class="pc" onclick="pickSel(this,${c})">${art(c)}</div>`).join('')}</div>`;
  const played=S.table.some(t=>t.o===me);
  if(S.ph==='clue'){
    if(me===st)h+=`<p>🎤 Ты рассказчик! Выбери карту и придумай ассоциацию (слово, фраза, звук…)</p><div class="row"><input id="cl${S.rn}" placeholder="Твоя ассоциация" style="flex:1" maxlength="80">${B('Загадать',()=>{const t=($('#cl'+S.rn).value||'').trim();if(sel==null||!t)return toast('Выбери карту и напиши ассоциацию');send({t:'clue',c:sel,text:t})},'big')}</div>`+hand();
    else h+=`<p class="muted">Рассказчик ${E(S.names[st])} выбирает карту и придумывает ассоциацию…</p>`+hand();
  }else if(S.ph==='pick'){
    h+=`<p>Ассоциация: <b style="font-size:20px">«${E(S.clue)}»</b></p>`;
    if(me!==st&&!played)h+=`<p>Выбери свою карту, которая подходит под ассоциацию:</p>`+B('Подложить карту',()=>{if(sel==null)return toast('Сначала выбери карту');send({t:'pick',c:sel})},'big')+hand();
    else h+=`<p class="muted">Ждём остальных… (${S.table.length}/${n})</p>`+(me!==st?hand():'');
  }else if(S.ph==='vote'){
    h+=`<p>Ассоциация: <b style="font-size:20px">«${E(S.clue)}»</b></p>`;
    const can=me!==st&&S.votes[me]===undefined;
    h+=can?`<p>Какая карта принадлежит рассказчику? Нажми на неё:</p>`:`<p class="muted">Ждём голосов… (${Object.keys(S.votes).length}/${n-1})</p>`;
    h+=`<div class="tbl">${S.table.map((t,k)=>{const mine=t.o===me;return `<div class="tc"><div class="pc" style="${mine?'opacity:.55;cursor:default':''}" ${can&&!mine?`onclick="${H(()=>send({t:'vote',k}))}"`:''}>${art(t.c)}</div>${mine?'твоя':''}</div>`}).join('')}</div>`;
  }else{
    h+=`<p>Ассоциация: <b style="font-size:20px">«${E(S.clue)}»</b></p><div class="tbl">${S.table.map((t,k)=>{
      const vs=Object.entries(S.votes).filter(([p,v])=>v===k).map(([p])=>TOK[+p]).join('');
      return `<div class="tc ${t.o===st?'win':''}"><div class="pc" style="cursor:default">${art(t.c)}</div><b>${TOK[t.o]} ${E(S.names[t.o])}</b><span>${vs||'—'}</span></div>`}).join('')}</div>`;
    h+=S.over?'':B('Следующий раунд ➜',()=>send({t:'next'}),'big');
  }
  return h;
}};

/* ============ 3. УНО ============ */
const UC={R:'#dc2626',G:'#16a34a',B:'#2563eb',Y:'#ca8a04',W:'#1f2937'},UN={R:'🔴',G:'🟢',B:'🔵',Y:'🟡'};
const ul=c=>c.v==='s'?'⛔':c.v==='r'?'⇄':c.v==='w'?'🌈':c.v;
const ucard=(c,cls,on)=>`<div class="uc ${cls||''}" style="background:${UC[c.c]}" ${on?`onclick="${on}"`:''}>${ul(c)}</div>`;
function unoDraw(S,p,k){for(let j=0;j<k;j++){if(!S.deck.length){S.deck=shuf(S.disc);S.disc=[]}if(!S.deck.length)return;S.hands[p].push(S.deck.pop())}}
const unoOk=(S,c)=>c.c==='W'||c.c===S.col||c.v===S.top.v;
const UNO={id:'uno',name:'Уно',icon:'🃏',color:'#ef4444',min:2,max:6,
desc:'Классические карточки: сбрасывай карты по цвету или значению и первым избавься от всех. Пропуски, развороты, +2 и +4!',
rules:'Сбрось карту того же цвета или значения, что и верхняя. 🌈 дикая карта — выбираешь цвет. ⛔ пропуск, ⇄ разворот, +2 / +4 — следующий берёт карты и пропускает ход. Нет подходящей — тяни карту (ход переходит). Первый без карт побеждает.',
init(names){const deck=[];for(const c of 'RGBY'){deck.push({c,v:'0'});for(const v of ['1','2','3','4','5','6','7','8','9','s','r','+2'])deck.push({c,v},{c,v})}
  for(let i=0;i<4;i++)deck.push({c:'W',v:'w'},{c:'W',v:'+4'});
  const d=shuf(deck),hands=names.map(()=>d.splice(0,7));let top;do{top=d.pop();if(top.c==='W'){d.unshift(top);top=null}}while(!top);
  return{names,hands,deck:d,disc:[],top,col:top.c,turn:0,dir:1,win:-1,log:'Игра началась!'}},
act(S,i,a){
  if(S.win>=0||i!==S.turn)return;const n=S.names.length;
  const adv=s=>{S.turn=((S.turn+S.dir*s)%n+n)%n},nx=()=>((S.turn+S.dir)%n+n)%n;
  if(a.t==='draw'){unoDraw(S,i,1);S.log=`${S.names[i]} берёт карту`;adv(1)}
  else if(a.t==='play'){const c=S.hands[i][a.k];if(!c||!unoOk(S,c))return;if(c.c==='W'&&!UN[a.col])return;
    S.hands[i].splice(a.k,1);S.disc.push(S.top);S.top=c;S.col=c.c==='W'?a.col:c.c;S.log=`${S.names[i]} → ${ul(c)}`;
    if(!S.hands[i].length){S.win=i;return}
    if(c.v==='r'&&n>2){S.dir*=-1;adv(1)}
    else if(c.v==='s'||c.v==='r')adv(2);
    else if(c.v==='+2'){unoDraw(S,nx(),2);adv(2)}
    else if(c.v==='+4'){unoDraw(S,nx(),4);adv(2)}
    else adv(1);
  }
},
render(S,me){
  const my=S.turn===me;
  let h=`<div class="sc">${S.names.map((x,i)=>`<span class="chip ${i===S.turn?'st':''}" style="--c:${COL[i]}">${TOK[i]} ${E(x)} 🃏${S.hands[i].length}${S.hands[i].length===1?' <b>UNO!</b>':''}</span>`).join('')}</div>`;
  if(S.win>=0)h+=`<h2>🏆 ${E(S.names[S.win])} победил(а)!</h2>`;
  h+=`<div class="uno">${ucard(S.top,'big')}<div><div>Цвет: <span class="dot" style="background:${UC[S.col]}"></span></div><p class="muted">${E(S.log)}</p>${my&&S.win<0?B('Взять карту',()=>send({t:'draw'}),'ghost'):''}</div></div>`;
  if(my&&unoPend!=null)h+=`<p style="text-align:center">Выбери цвет:</p><div class="tools">${'RGBY'.split('').map(c=>B(UN[c],()=>{const k=unoPend;send({t:'play',k,col:c})},'big')).join('')}</div>`;
  else if(my&&S.win<0)h+=`<p style="text-align:center"><b>Твой ход!</b></p>`;
  h+=`<div class="hand" style="justify-content:center">${S.hands[me].map((c,k)=>{const ok=my&&S.win<0&&unoOk(S,c);
    return ucard(c,ok?'ok':'no',ok?H(()=>{if(c.c==='W'){unoPend=k;showGame()}else send({t:'play',k})}):'')}).join('')}</div>`;
  return h;
}};

const SPY={id:'spy',name:'Шпион',icon:'🕵️',color:'#06b6d4',min:3,max:6,
desc:'Все знают место, кроме одного — шпиона. Задавай хитрые вопросы, вычисли чужака или не выдай, что ты не в теме.',
rules:'Всем показывают одну локацию, а шпиону — нет. По очереди задавайте друг другу вопросы про это место (голосом в Discord/Telegram!). Шпион пытается понять локацию, остальные — вычислить шпиона. В любой момент шпион может назвать локацию, а все вместе — проголосовать. Таймер 8 минут.',
init(names){return{names,loc:rnd(LOCS.length),spy:rnd(names.length),ph:'play',t0:Date.now(),votes:{},res:null}},
act(S,i,a){

  if(a.t==='guess'&&S.ph==='play'&&i===S.spy){const ok=a.loc===S.loc;S.res={team:!ok,why:`Шпион назвал «${LOCS[a.loc]}» — ${ok?'верно, шпион победил!':'неверно, шпион проиграл!'}`};S.ph='end'}
  else if(a.t==='vote'&&S.ph==='play'&&S.votes[i]===undefined&&a.k!==i&&a.k>=0&&a.k<n){
    S.votes[i]=a.k;
    if(Object.keys(S.votes).length===n){const c=S.names.map(()=>0);Object.values(S.votes).forEach(v=>c[v]++);const mx=Math.max(...c),top=c.map((x,j)=>x===mx?j:-1).filter(j=>j>=0);
      const caught=top.length===1&&top[0]===S.spy;S.res={team:caught,why:caught?`Шпиона вычислили — это ${S.names[S.spy]}!`:`Шпиона не поймали! Это был ${S.names[S.spy]}.`};S.ph='end'}
  }else if(a.t==='again'&&S.ph==='end'){S.loc=rnd(LOCS.length);S.spy=rnd(n);S.ph='play';S.t0=Date.now();S.votes={};S.res=null}
},
render(S,me){
  const spy=me===S.spy;
  if(S.ph==='end')return `<div class="role">${S.res.team?'🎉 Победила команда!':'🕵️ Победил шпион!'}<br><small>${E(S.res.why)}</small><br><br>Локация была: <b>${LOCS[S.loc]}</b><br>Шпион: <b>${TOK[S.spy]} ${E(S.names[S.spy])}</b></div><div style="text-align:center">${net.host?B('Новый раунд',()=>send({t:'again'}),'big'):''}${net.host?'':'<p class="muted">Ждём хоста…</p>'}</div>`;
  let h=`<div class="role">${spy?'🕵️ Ты — <b>ШПИОН</b><br><small>Не выдай себя и угадай локацию!</small>':`📍 Локация: <b>${LOCS[S.loc]}</b><br><small>Найди шпиона вопросами. Не называй место прямо!</small>`}<br><small>⏱ <span id="tm">8:00</span></small></div>`;
  if(spy)h+=`<h4>Знаешь, где вы? Назови локацию (если ошибёшься — проиграешь):</h4><div class="locs">${LOCS.map((l,k)=>B(l,()=>{if(confirm('Точно «'+l+'»?'))send({t:'guess',loc:k})},'sm ghost')).join('')}</div>`;
  else h+=`<details><summary class="muted">Список возможных локаций</summary><p class="muted">${LOCS.join(' · ')}</p></details>`;
  h+=`<h4>Голосование: кто шпион? ${S.votes[me]!==undefined?'(ты проголосовал)':''}</h4><div class="locs">${S.names.map((x,k)=>k===me?'':B(`${TOK[k]} ${E(x)}`,()=>{if(S.votes[me]===undefined&&confirm('Голосуешь за '+x+'?'))send({t:'vote',k})},S.votes[me]===k?'':'ghost')).join('')}</div><p class="muted">Проголосовало: ${Object.keys(S.votes).length}/${S.names.length}</p>`;
  return h;
},
after(S){const el=$('#tm');if(!el||S.ph!=='play')return;const f=()=>{const s=Math.max(0,480-Math.floor((Date.now()-S.t0)/1000));el.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};f();tmr=setInterval(f,1000)}};

/* ============ 5. КРОКОДИЛ ============ */
const WORDS=['Кот','Самолёт','Холодильник','Пицца','Дракон','Велосипед','Футбол','Космонавт','Зонтик','Робот','Динозавр','Гитара','Замок','Мороженое','Ёлка','Телефон','Акула','Радуга','Пират','Вулкан','Паук','Часы','Снеговик','Бабочка','Поезд','Маяк','Слон','Корона','Ракета','Банан','Мост','Очки','Ведро','Попугай','Тыква','Фонарь','Верблюд','Кактус','Лыжи','Утюг','Арбуз','Лодка','Сова','Ключ','Свеча','Пингвин','Барабан','Зебра','Домик','Кофе'];
const norm=s=>String(s).toLowerCase().replace(/ё/g,'е').trim();
function line(x,s){x.strokeStyle=s.c;x.lineWidth=s.w*2;x.lineCap='round';x.beginPath();x.moveTo(s.p[0][0]*640,s.p[0][1]*440);x.lineTo(s.p[1][0]*640,s.p[1][1]*440);x.stroke()}
function drawSeg(s){
  const cv=$('#cv'),x=cv&&cv.getContext('2d');
  if(s.clr){STROKES=[];if(x){x.fillStyle='#fff';x.fillRect(0,0,640,440)}}else{STROKES.push(s);x&&line(x,s)}
}
function emit(s){drawSeg(s);if(net.host)broadcast({t:'d',seg:s});else net.conn&&net.conn.send({t:'d',seg:s})}
const CRO={id:'cro',name:'Крокодил',icon:'🐊',color:'#22c55e',min:2,max:6,
desc:'Рисуй слово, а друзья отгадывают в чате. Кто угадал — получает очки и рисует следующим.',
rules:'Один рисует загаданное слово (нельзя писать буквы!), остальные вводят догадки. Угадавший получает +2, художник +1, и угадавший становится следующим художником. Не нравится слово — нажми «Другое слово».',
init(names){return{names,dr:0,word:WORDS[rnd(WORDS.length)],score:names.map(()=>0),chat:[],round:1}},
act(S,i,a){
  const n=S.names.length;
  if(a.t==='guess'&&i!==S.dr){const t=String(a.text||'').trim().slice(0,40);if(!t)return;
    if(norm(t)===norm(S.word)){S.score[i]+=2;S.score[S.dr]+=1;S.chat.push({n:i,t:`угадал(а)! Слово: «${S.word}»`,ok:1});S.dr=i;S.word=WORDS[rnd(WORDS.length)];S.round++}
    else S.chat.push({n:i,t});
    S.chat=S.chat.slice(-30);
  }else if(a.t==='skip'&&i===S.dr){S.word=WORDS[rnd(WORDS.length)];S.round++;S.chat.push({n:i,t:'сменил(а) слово',ok:0})}
},
render(S,me){
  const dr=me===S.dr;
  let h=`<div class="sc">${S.names.map((x,i)=>`<span class="chip ${i===S.dr?'st':''}" style="--c:${COL[i]}">${TOK[i]} ${E(x)} <b>${S.score[i]}</b>${i===S.dr?' ✏️':''}</span>`).join('')}</div>`;
  h+=dr?`<div class="role" style="padding:10px">Рисуй: <b>${E(S.word)}</b> ${B('Другое слово',()=>send({t:'skip'}),'sm ghost')}</div>`:`<div class="role" style="padding:10px">${E(S.names[S.dr])} рисует: <b style="letter-spacing:4px">${S.word.split('').map(()=>'_').join(' ')}</b> <small>(${S.word.length} букв)</small></div>`;
  h+=`<canvas id="cv" width="640" height="440"></canvas>`;
  if(dr)h+=`<div class="tools">${['#111111','#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#ffffff'].map(c=>`<span class="sw" style="background:${c}" onclick="${H(()=>{tool.c=c})}"></span>`).join('')}${B('Тонко',()=>{tool.w=3},'sm ghost')}${B('Средне',()=>{tool.w=7},'sm ghost')}${B('Толсто',()=>{tool.w=16},'sm ghost')}${B('🗑 Очистить',()=>emit({clr:1}),'sm ghost')}<small class="muted">белый = ластик</small></div>`;
  else{const go=H(()=>{const el=$('#gi'+S.round),t=el.value.trim();if(!t)return;el.value='';send({t:'guess',text:t})});
    h+=`<div class="row" style="max-width:640px;margin:10px auto"><input id="gi${S.round}" placeholder="Твоя догадка…" style="flex:1" autocomplete="off" onkeydown="if(event.key==='Enter')${go}"><button class="btn" onclick="${go}">Отправить</button></div>`}
  h+=`<div class="chat">${S.chat.slice().reverse().map(c=>`<div class="${c.ok?'ok':''}">${TOK[c.n]} <b>${E(S.names[c.n])}:</b> ${E(c.t)}</div>`).join('')}</div>`;
  return h;
},
after(S,me){
  if(lastR!==S.round){STROKES=[];lastR=S.round}
  const cv=$('#cv');if(!cv)return;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,640,440);STROKES.forEach(s=>line(x,s));
  if(me!==S.dr)return;let dn=false,last;
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
  cv.onpointerdown=e=>{dn=true;cv.setPointerCapture(e.pointerId);last=pt(e);emit({c:tool.c,w:tool.w,p:[last,last]})};
  cv.onpointermove=e=>{if(!dn)return;const p=pt(e);emit({c:tool.c,w:tool.w,p:[last,p]});last=p};
  cv.onpointerup=cv.onpointercancel=()=>{dn=false};
}};

/* ============ запуск ============ */
const GAMES=[MONO,IMG,UNO,SPY,CRO],GM=Object.fromEntries(GAMES.map(g=>[g.id,g]));
home();
if(location.hash.length>3)joinRoom(location.hash.slice(1));
</script>
